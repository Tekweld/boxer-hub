# Sincroniza titulos e notas fiscais do Zen para o Hub.
#
# Manual + diario. Diario porque titulo/NF nao mudam de minuto em minuto e
# volume tende a ser alto. Manual (workflow_dispatch) para retomar de onde
# parou passando `desde=<id>` ou rodar so `alvo=titulos` / `alvo=notas`.
#
# O endpoint tem orcamento de 15s de leitura por chamada (funcao Vercel morre
# em 60s) e devolve `proximo_desde` PARA CADA ALVO -- este job encadeia as
# rodadas ate os dois (titulos e notas) chegarem em `concluido:true`. Sao
# cursores independentes porque titulo (financial.Receivable) e NF
# (fiscal.OutgoingInvoice) vivem em espacos de id diferentes no Zen -- um
# cursor compartilhado travava o job inteiro sempre que um dos dois
# terminava antes do outro (bug corrigido em 2026-10-30, duas semanas de
# cron falhando sem ninguem notar).
name: Sync financeiro ZenERP

on:
  schedule:
    # 05:30 BRT (08:30 UTC) -- antes do horario comercial, para o cliente ver
    # dados frescos ao logar de manha.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      alvo:
        description: "'titulos', 'notas' ou 'ambos' (default)"
        required: false
        default: 'ambos'
      desde:
        description: 'id inicial do receivable/outgoingInvoice (retoma / limita)'
        required: false
        default: ''
      desde_data:
        description: 'Notas: emitidas a partir desta data (YYYY-MM-DD). Padrao: 30d atras.'
        required: false
        default: ''
      dry:
        description: 'Simular sem gravar (1 = sim)'
        required: false
        default: '0'

concurrency:
  group: sync-financeiro
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Encadear /api/sync-financeiro ate concluir
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ALVO: ${{ github.event.inputs.alvo || 'ambos' }}
          DESDE: ${{ github.event.inputs.desde || '' }}
          DESDE_DATA: ${{ github.event.inputs.desde_data || '' }}
          DRY:  ${{ github.event.inputs.dry  || '0' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET nao configurado nos secrets do repositorio."
            exit 1
          fi

          # Titulo (financial.Receivable) e NF (fiscal.OutgoingInvoice) vivem
          # em espacos de id diferentes no Zen -- cursores SEPARADOS. Usar um
          # so (como era antes) fazia o cursor de um nao servir pra nada no
          # outro, e como titulo sempre consome o orcamento de leitura
          # primeiro (relê tudo todo dia, de proposito), NF nunca avancava e
          # o job abortava com "cursor nao avancou" (visto ao vivo em
          # producao, 2026-10-30).
          desde_titulos="$DESDE"
          desde_nf="$DESDE"
          total_gravados=0
          rodada=0
          # O Zen tem latencia instavel -- uma chamada individual pode
          # estourar o timeout de 10s do nosso lado (api/_zen.js) sem ser bug
          # nenhum, so rede lenta na hora (visto ao vivo em producao,
          # 2026-10-30). Tolera algumas rodadas seguidas sem avanco antes de
          # desistir de verdade -- um cursor preso por 5 rodadas e bug, um
          # preso por 1 e so a rede.
          sem_avanco_tit=0
          sem_avanco_nf=0

          while [ "$rodada" -lt 120 ]; do
            rodada=$((rodada + 1))
            url="https://hub.boxersoldas.com.br/api/sync-financeiro?alvo=${ALVO}&dry=${DRY}"
            [ -n "$desde_titulos" ] && url="${url}&desde_titulos=${desde_titulos}"
            [ -n "$desde_nf" ] && url="${url}&desde_nf=${desde_nf}"
            [ -n "$DESDE_DATA" ] && url="${url}&desde_data=${DESDE_DATA}"

            corpo=$(mktemp)
            codigo=$(curl -sS -o "$corpo" -w '%{http_code}' \
              -X POST "$url" \
              -H "x-cron-secret: $CRON_SECRET" \
              --max-time 120)

            echo "--- rodada $rodada (titulos ${desde_titulos:-inicio} / nf ${desde_nf:-inicio}) -> HTTP $codigo"
            jq . "$corpo" 2>/dev/null || cat "$corpo"; echo

            if [ "$codigo" != "200" ]; then
              echo "::error::sync-financeiro respondeu $codigo"
              exit 1
            fi

            g_tit=$(jq -r '.titulos.gravados // 0' "$corpo")
            g_nf=$(jq -r  '.notas.gravados // 0'   "$corpo")
            total_gravados=$((total_gravados + g_tit + g_nf))

            prox_tit=$(jq -r '.titulos.proximo_desde // empty' "$corpo")
            prox_nf=$(jq -r  '.notas.proximo_desde // empty'   "$corpo")

            # Cada alvo so e considerado concluido quando ele mesmo deixa de
            # mandar proximo_desde -- nao depende mais do outro.
            tit_concluido=1; [ -n "$prox_tit" ] && tit_concluido=0
            nf_concluido=1;  [ -n "$prox_nf" ]  && nf_concluido=0

            if [ "$tit_concluido" = "1" ] && [ "$nf_concluido" = "1" ]; then
              echo "Concluido. Total gravado nesta execucao: $total_gravados"
              exit 0
            fi

            # So aborta por "nao avancou" o alvo que realmente nao concluiu E
            # nao mudou de cursor POR VARIAS rodadas seguidas -- o outro pode
            # estar legitimamente parado (ja concluido) sem isso ser erro, e
            # uma rodada isolada sem avanco e so o Zen lento naquela hora.
            if [ "$tit_concluido" = "0" ] && [ "$prox_tit" = "$desde_titulos" ]; then
              sem_avanco_tit=$((sem_avanco_tit + 1))
              if [ "$sem_avanco_tit" -ge 5 ]; then
                echo "::error::cursor de titulos nao avancou por 5 rodadas seguidas (ficou em $desde_titulos) -- abortando"
                exit 1
              fi
              echo "aviso: titulos sem avancar (tentativa $sem_avanco_tit/5) -- provavel lentidao do Zen, tentando de novo"
            else
              sem_avanco_tit=0
            fi
            if [ "$nf_concluido" = "0" ] && [ "$prox_nf" = "$desde_nf" ]; then
              sem_avanco_nf=$((sem_avanco_nf + 1))
              if [ "$sem_avanco_nf" -ge 5 ]; then
                echo "::error::cursor de nf nao avancou por 5 rodadas seguidas (ficou em $desde_nf) -- abortando"
                exit 1
              fi
              echo "aviso: nf sem avancar (tentativa $sem_avanco_nf/5) -- provavel lentidao do Zen, tentando de novo"
            else
              sem_avanco_nf=0
            fi

            [ "$tit_concluido" = "0" ] && desde_titulos="$prox_tit"
            [ "$nf_concluido" = "0" ] && desde_nf="$prox_nf"
          done

          echo "::error::teto de rodadas atingido sem concluir (titulos $desde_titulos / nf $desde_nf)"
          exit 1
