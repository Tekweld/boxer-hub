# Mantem pedido do Hub e venda do Zen em dia, nos dois sentidos: empurra o que
# ficou para tras e traz a etapa do workflow de volta.
#
# A cada 15 min: e o intervalo em que o revendedor ainda aceita "ja atualiza",
# e o volume e baixo (dezenas de pedidos abertos, nao milhares). Se o Watcher
# nativo do Zen (webhook) se provar utilizavel, isto vira redundancia e o
# intervalo pode cair para horario.
name: Sync pedidos ZenERP

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      debug_sale:
        description: 'Vazio = sync. Id da venda = payload cru. Ou query direta: debug_pay=1, debug_spec=payment, preparar=48244'
        required: false
        default: ''

concurrency:
  group: sync-pedidos-zen
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/sync-pedidos-zen
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DEBUG_SALE: ${{ github.event.inputs.debug_sale }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET nao configurado nos secrets do repositorio."
            exit 1
          fi

          url='https://hub.boxersoldas.com.br/api/sync-pedidos-zen'
          # Regra unica, para nao virar escada de elif a cada diagnostico novo
          # (ja falhou uma vez: acrescentei um modo no endpoint e esqueci aqui,
          # e o valor caiu no ramo errado -- o Zen respondeu 400 com id==pay).
          # So numero = id de venda; qualquer outra coisa vai como query crua.
          if [ -n "$DEBUG_SALE" ]; then
            case "$DEBUG_SALE" in
              ''|*[!0-9]*) url="${url}?${DEBUG_SALE}" ;;
              *)           url="${url}?debug_sale=${DEBUG_SALE}" ;;
            esac
          fi

          corpo=$(mktemp)
          codigo=$(curl -sS -o "$corpo" -w '%{http_code}' \
            -X POST "$url" \
            -H "x-cron-secret: $CRON_SECRET" \
            --max-time 120)

          echo "HTTP $codigo"
          jq . "$corpo" 2>/dev/null || cat "$corpo"; echo

          if [ "$codigo" != "200" ]; then
            echo "::error::sync-pedidos-zen respondeu $codigo"
            exit 1
          fi

          # Modo diagnostico nao sincroniza nada -- nao ha o que checar depois.
          if [ -n "$DEBUG_SALE" ]; then exit 0; fi

          # Pedido que nao chega ao Zen e pedido que ninguem separa. Falhar aqui
          # e a unica forma de isso virar sinal em vez de silencio.
          falhas=$(jq -r '.falhas_push | length' "$corpo")
          if [ "$falhas" != "0" ]; then
            echo "::error::$falhas pedido(s) nao entraram no Zen"
            exit 1
          fi







