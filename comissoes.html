<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Comissao - Boxer Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;color:#1a202c}
.topbar{background:linear-gradient(135deg,#1d327b,#162666);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #25bbee}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{color:#fff;font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:16px}
.user-badge{color:#93b4d4;font-size:13px}.user-badge strong{color:#fff}
.logout-btn{color:#93b4d4;font-size:13px;padding:6px 12px;border:1px solid rgba(255,255,255,.2);border-radius:6px;cursor:pointer}
.logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-family:Outfit;font-size:13px;font-weight:500;z-index:2000;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:#16a34a}.toast-error{background:#dc2626}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.page-wrap{max-width:1100px;margin:0 auto;padding:20px 24px 60px}
.page-head{margin-bottom:18px}
.page-head h2{font-size:20px;font-weight:700;color:#1d327b}
.page-head p{font-size:13px;color:#718096;margin-top:2px}

.com-filtros{display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
.com-filtros select,.com-filtros input{font-family:Outfit;font-size:13px;padding:9px 12px;border:1px solid #c3cfe2;border-radius:8px;outline:none}
.com-filtros select:focus,.com-filtros input:focus{border-color:#25bbee}
.com-filtros select{min-width:260px}

.com-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
.com-card{background:#fff;border:1px solid #d0d8e8;border-radius:10px;padding:16px}
.com-card-label{font-size:11px;font-weight:500;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.com-card-valor{font-size:20px;font-weight:700;color:#1d327b}
.com-card-sub{font-size:12px;color:#a0aec0;margin-top:4px}

.com-sec{font-size:14px;font-weight:600;color:#1d327b;margin:24px 0 10px}
.com-resumo-row{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid #d0d8e8;border-radius:10px;padding:12px 16px;margin-bottom:8px}
.com-resumo-comp{font-size:14px;font-weight:600;color:#1a202c}
.com-resumo-meta{font-size:12px;color:#718096;margin-top:2px}
.com-resumo-valor{font-size:16px;font-weight:700;color:#1d327b;text-align:right}
.com-badge-fechado{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:#dcfce7;color:#16a34a;margin-left:8px}
.com-badge-aberto{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:#fef3c7;color:#d97706;margin-left:8px}

table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #d0d8e8;border-radius:10px;overflow:hidden}
thead th{padding:8px 12px;text-align:left;color:#718096;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;background:#f7fafc}
tbody td{padding:8px 12px;border-bottom:1px solid #e2e8f0;vertical-align:middle}
tbody tr:hover{background:#f0f7ff}
tbody tr.excluida{opacity:.55;text-decoration:line-through}
.com-wrap-tabela{overflow-x:auto}
.empty-state{text-align:center;padding:60px 20px;color:#718096}
.empty-state h3{color:#4a5568;margin-bottom:6px}
.btn{padding:6px 12px;border-radius:7px;border:1px solid;font-family:Outfit;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-outline{background:#fff;color:#4a5568;border-color:#c3cfe2}.btn-outline:hover{border-color:#25bbee;color:#1d327b}
.btn-danger{background:#fff;color:#e30613;border-color:#fecaca}.btn-danger:hover{background:#fee2e2}
.btn-primary{background:#1d327b;color:#fff;border-color:#1d327b}.btn-primary:hover{background:#162666}
</style>
</head>
<body>

<div class="page-wrap">
  <div class="page-head">
    <h2>Comissao</h2>
    <p>Historico de comissao direto do financeiro -- automatico, sem planilha solta.</p>
  </div>
  <div class="com-filtros" id="comFiltros"></div>
  <div id="comConteudo"><div class="empty-state"><h3>Carregando...</h3></div></div>
</div>

<script src="hub.js"></script>
<script>
if (!requireAuth()) throw 'auth';

let EH_GESTOR = false;
let VENDEDORES = [];

(async () => {
  await loadPerfil();
  renderTopbar('Comissao');
  EH_GESTOR = ['admin', 'manager'].includes(getUserRole());
  await carregarComissoes();
})();

async function chamarComissaoApi(body) {
  const r = await fetch('/api/push-pedido?target=comissoes', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (SESSION?.access_token || '') },
    body: JSON.stringify(body || {})
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Erro ao carregar comissao');
  return j;
}

function renderFiltros() {
  const el = document.getElementById('comFiltros');
  if (!EH_GESTOR) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <select id="comVendedorSel" onchange="carregarComissoes(this.value)">
      <option value="">Selecione um representante...</option>
      ${VENDEDORES.map(v => `<option value="${v.erp_representante_id}">${escHub(v.nome)}</option>`).join('')}
    </select>
  `;
}

async function carregarComissoes(vendedorIdForcado) {
  const conteudo = document.getElementById('comConteudo');
  const selecionado = vendedorIdForcado !== undefined ? vendedorIdForcado : document.getElementById('comVendedorSel')?.value;
  conteudo.innerHTML = '<div class="empty-state"><h3>Carregando...</h3></div>';

  try {
    // Pedido do Andre, 2026-11-24: "comissao tem que aparecer so da pessoa
    // que esta logando, ou pros admins a visao geral" -- gestor sem filtro
    // selecionado agora cai numa visao geral (todos os representantes
    // combinados), nao numa tela vazia pedindo pra escolher alguem.
    const j = await chamarComissaoApi(EH_GESTOR ? { vendedor_id: selecionado || null } : {});
    if (EH_GESTOR && VENDEDORES.length === 0 && j.vendedores) { VENDEDORES = j.vendedores; renderFiltros(); if (selecionado) document.getElementById('comVendedorSel').value = selecionado; }

    const visaoGeral = EH_GESTOR && !selecionado;

    if (!j.linhas.length) {
      conteudo.innerHTML = '<div class="empty-state"><h3>Nenhuma comissao encontrada</h3><p>' + (visaoGeral ? 'Ainda nao ha lancamentos de comissao.' : 'Ainda nao ha lancamentos de comissao pra este representante.') + '</p></div>';
      return;
    }

    const totalGeral = j.linhas.filter(l => !l.excluida).reduce((s, l) => s + (Number(l.valor_comissao) || 0), 0);
    const totalExcluidas = j.linhas.filter(l => l.excluida).length;
    // Chave composta (competencia|vendedor_id) -- nao so competencia, porque
    // na visao geral uma mesma competencia pode estar fechada pra um
    // representante e aberta pra outro. Usa j.fechamentos (registro real),
    // nao j.resumo.fechado (esse vem null quando a api nao tem um unico
    // vendedor_id pra avaliar, ver api/_comissoes.js linha ~137).
    const fechadoPorVendedorCompetencia = new Set(j.fechamentos.map(f => f.competencia + '|' + f.vendedor_id));
    const vendedorAtual = EH_GESTOR ? selecionado : null;

    let porRepresentanteHtml = '';
    if (visaoGeral) {
      const porRep = {};
      for (const l of j.linhas) {
        const k = l.vendedor_id || '—';
        if (!porRep[k]) porRep[k] = { vendedor_id: l.vendedor_id, nome: l.vendedor_nome || 'Sem nome', valor: 0, qtd: 0 };
        if (!l.excluida) { porRep[k].valor += Number(l.valor_comissao) || 0; porRep[k].qtd++; }
      }
      const lista = Object.values(porRep).sort((a, b) => b.valor - a.valor);
      porRepresentanteHtml = `
        <div class="com-sec">Por representante</div>
        ${lista.map(r => `
          <div class="com-resumo-row" style="cursor:pointer" onclick="selecionarRepresentante('${r.vendedor_id}')">
            <div>
              <div class="com-resumo-comp">${escHub(r.nome)}</div>
              <div class="com-resumo-meta">${r.qtd} lancamento(s)</div>
            </div>
            <div class="com-resumo-valor">${fmtMoeda(r.valor)}</div>
          </div>
        `).join('')}
      `;
    }

    conteudo.innerHTML = `
      <div class="com-cards">
        <div class="com-card"><div class="com-card-label">Comissao total ${visaoGeral ? '(todos os representantes)' : '(geral)'}</div><div class="com-card-valor">${fmtMoeda(totalGeral)}</div><div class="com-card-sub">${j.linhas.length} lancamento(s)${totalExcluidas ? ', ' + totalExcluidas + ' excluido(s)/corrigido(s)' : ''}</div></div>
        <div class="com-card"><div class="com-card-label">Competencias</div><div class="com-card-valor">${j.resumo.length}</div><div class="com-card-sub">${j.fechamentos.length} fechamento(s) registrado(s)</div></div>
      </div>

      ${porRepresentanteHtml}

      <div class="com-sec">Por competencia</div>
      ${j.resumo.map(r => `
        <div class="com-resumo-row">
          <div>
            <div class="com-resumo-comp">${fmtCompetencia(r.competencia)}${visaoGeral ? '' : (r.fechado ? '<span class="com-badge-fechado">Fechado</span>' : '<span class="com-badge-aberto">Aberto</span>')}</div>
            <div class="com-resumo-meta">${r.qtd} lancamento(s)${r.qtd_excluidas ? ', ' + r.qtd_excluidas + ' excluido(s)' : ''}</div>
          </div>
          <div style="display:flex;align-items:center;gap:12px">
            <div class="com-resumo-valor">${fmtMoeda(r.valor_comissao)}</div>
            ${EH_GESTOR && !visaoGeral ? (r.fechado
              ? `<button class="btn btn-outline" onclick="comReabrirCompetencia('${r.competencia}', '${vendedorAtual}')">Reabrir</button>`
              : `<button class="btn btn-primary" onclick="comFecharCompetencia('${r.competencia}', '${vendedorAtual}')">Fechar (aprovar)</button>`) : ''}
          </div>
        </div>
      `).join('')}

      <div class="com-sec">Lancamentos</div>
      <div class="com-wrap-tabela">
        <table>
          <thead><tr><th>Data</th><th>Cliente</th><th>NF / Titulo</th><th>Valor evento</th><th>Taxa</th><th>Comissao</th>${EH_GESTOR ? '<th></th>' : ''}</tr></thead>
          <tbody>
            ${j.linhas.map(l => {
              const fech = fechadoPorVendedorCompetencia.has(l.competencia + '|' + l.vendedor_id);
              return `
              <tr class="${l.excluida ? 'excluida' : ''}" title="${l.excluida && l.motivo_exclusao ? escHub(l.motivo_exclusao) : ''}">
                <td>${fmtData(l.data_evento)}</td>
                <td>${escHub(l.cliente_nome || '-')}</td>
                <td>${escHub(l.nf_numero || l.titulo_codigo || '-')}</td>
                <td>${fmtMoeda(l.valor_evento)}</td>
                <td>${l.taxa != null ? Number(l.taxa).toFixed(2) + '%' : '-'}</td>
                <td><strong>${fmtMoeda(l.valor_comissao)}</strong></td>
                ${EH_GESTOR ? `<td>${fech ? '' : (l.excluida
                  ? `<button class="btn btn-outline" onclick="comRestaurarLinha(${l.id})">Restaurar</button>`
                  : `<button class="btn btn-danger" onclick="comExcluirLinha(${l.id})">Reprovar</button>`)}</td>` : ''}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    `;
  } catch (e) {
    conteudo.innerHTML = '<div class="empty-state"><h3>Nao foi possivel carregar</h3><p>' + escHub(e.message) + '</p></div>';
  }
}

function selecionarRepresentante(erpId) {
  const sel = document.getElementById('comVendedorSel');
  if (sel) sel.value = erpId;
  carregarComissoes(erpId);
}

async function comExcluirLinha(id) {
  const motivo = prompt('Motivo da reprovacao desta linha (obrigatorio):');
  if (!motivo || !motivo.trim()) return;
  try {
    await chamarComissaoApi({ acao: 'excluir_linha', id, excluir: true, motivo: motivo.trim() });
    toast('Linha reprovada');
    await carregarComissoes(document.getElementById('comVendedorSel')?.value);
  } catch (e) { toast(e.message, 'error'); }
}

async function comRestaurarLinha(id) {
  if (!(await confirmModal('Restaurar esta linha de comissao (volta a contar normalmente)?'))) return;
  try {
    await chamarComissaoApi({ acao: 'excluir_linha', id, excluir: false });
    toast('Linha restaurada');
    await carregarComissoes(document.getElementById('comVendedorSel')?.value);
  } catch (e) { toast(e.message, 'error'); }
}

async function comFecharCompetencia(competencia, vendedorId) {
  if (!(await confirmModal('Fechar (aprovar) a competencia ' + fmtCompetencia(competencia) + '? Isso trava novas exclusoes e libera o titulo de comissao pro Zen.'))) return;
  try {
    await chamarComissaoApi({ acao: 'fechar', competencia, vendedor_id: vendedorId });
    toast('Competencia fechada');
    await carregarComissoes(document.getElementById('comVendedorSel')?.value);
  } catch (e) { toast(e.message, 'error'); }
}

async function comReabrirCompetencia(competencia, vendedorId) {
  if (!(await confirmModal('Reabrir a competencia ' + fmtCompetencia(competencia) + '? So administrador consegue fazer isso.'))) return;
  try {
    await chamarComissaoApi({ acao: 'reabrir', competencia, vendedor_id: vendedorId });
    toast('Competencia reaberta');
    await carregarComissoes(document.getElementById('comVendedorSel')?.value);
  } catch (e) { toast(e.message, 'error'); }
}

function fmtCompetencia(iso) {
  if (!iso) return '-';
  const [ano, mes] = iso.split('-');
  const MESES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  return MESES[Number(mes) - 1] + '/' + ano;
}
</script>
</body>
</html>
