<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Financeiro — Boxer Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;color:#1a202c}
.topbar{background:linear-gradient(135deg,#1d327b,#162666);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #25bbee}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{color:#fff;font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:16px}
.user-badge{color:#93b4d4;font-size:13px}.user-badge strong{color:#fff}
.logout-btn{color:#93b4d4;font-size:13px;padding:6px 12px;border:1px solid rgba(255,255,255,.2);border-radius:6px;cursor:pointer}
.logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.notif-badge{background:#e30613;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;cursor:pointer}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-family:Outfit;font-size:13px;font-weight:500;z-index:2000;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:#16a34a}.toast-error{background:#dc2626}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:550px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}

.tabs{display:flex;gap:4px;padding:16px 24px 0;max-width:1400px;margin:0 auto}
.tab{padding:10px 20px;border-radius:8px 8px 0 0;border:1px solid #d0d8e8;border-bottom:none;background:#fff;color:#4a5568;cursor:pointer;font-family:Outfit;font-size:14px;font-weight:500}
.tab:hover{color:#1d327b}
.tab.active{background:#1d327b;color:#fff;border-color:#1d327b}
.panel{max-width:1400px;margin:0 auto;padding:0 24px 24px}
.panel-content{background:#fff;border:1px solid #d0d8e8;border-radius:0 8px 8px 8px;padding:20px}
.hidden{display:none!important}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 12px;text-align:left;color:#718096;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;background:#f7fafc}
tbody td{padding:8px 12px;border-bottom:1px solid #e2e8f0;vertical-align:middle}
tbody tr:hover{background:#f0f7ff}

.btn{padding:8px 16px;border-radius:8px;border:1px solid;font-family:Outfit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#1d327b;color:#fff;border-color:#1d327b}.btn-primary:hover{background:#162666}
.btn-outline{background:#fff;color:#4a5568;border-color:#c3cfe2}.btn-outline:hover{border-color:#25bbee;color:#1d327b}
.btn-sm{padding:4px 10px;font-size:12px}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.kpi-card{background:#f7fafc;border:1px solid #e2e8f0;border-radius:8px;padding:14px}
.kpi-label{font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.kpi-value{font-size:20px;font-weight:700;color:#1d327b}
.kpi-value.danger{color:#dc2626}
.kpi-value.warning{color:#e97316}

.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.status-aberto{background:#dbeafe;color:#1e40af}
.status-vencido{background:#fee2e2;color:#991b1b}
.status-pago{background:#d1fae5;color:#065f46}
.status-parcial{background:#fef3c7;color:#92400e}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:16px;font-weight:600;color:#1d327b}
.empty-state{text-align:center;padding:40px 20px;color:#718096}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:500;color:#4a5568;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 12px;border:1px solid #c3cfe2;border-radius:6px;font-family:Outfit;font-size:13px;outline:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:#25bbee}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0}
</style>
</head>
<body>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('financeiro',this)">Financeiro</div>
  <div class="tab" onclick="showTab('credito',this)">Credito</div>
</div>
<div class="panel">
  <div class="panel-content" id="tab-financeiro">
    <div class="page-header">
      <h2 class="page-title">Financeiro</h2>
      <button class="btn btn-outline" onclick="abrirNovaSolicitacaoGeral('Duvida financeira')">Nova solicitacao</button>
    </div>
    <div id="kpiResumo"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px">
      <div style="flex:1 1 220px"><label style="display:block;font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Buscar (NF, titulo, pedido, cliente, chave)</label>
        <input id="filtroFinBusca" oninput="renderFinanceiro()" placeholder="Ex: 142042 ou HUB-2026-00004" style="width:100%"></div>
      <div><label style="display:block;font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Emissao de</label>
        <input id="filtroFinDe" type="date" onchange="renderFinanceiro()"></div>
      <div><label style="display:block;font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Ate</label>
        <input id="filtroFinAte" type="date" onchange="renderFinanceiro()"></div>
    </div>
    <div id="financeiroList"></div>
  </div>
  <div class="panel-content hidden" id="tab-credito">
    <div class="page-header">
      <h2 class="page-title">Credito</h2>
      <button class="btn btn-primary" onclick="openSolicitarCredito()">Solicitar aumento</button>
    </div>
    <div id="kpiCredito"></div>
    <h3 style="font-size:14px;color:#1d327b;margin:20px 0 10px">Solicitacoes de credito</h3>
    <div id="creditoList"></div>
  </div>
</div>

<script src="hub.js"></script>
<script>
if (!requireAuth()) throw 'auth';

function showTab(n, el) {
  document.querySelectorAll('.panel-content').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + n).classList.remove('hidden');
  el.classList.add('active');
}

(async () => {
  await loadPerfil();
  renderTopbar('Financeiro');
  await Promise.all([loadFinanceiro(), loadCredito()]);

  // Link direto de outras telas (ex: carrinho com credito insuficiente)
  // pode mandar pra #solicitar-credito -- abre a aba e o modal direto.
  if (location.hash === '#solicitar-credito') {
    const tabCredito = document.querySelector('.tab[onclick*="credito"]');
    if (tabCredito) showTab('credito', tabCredito);
    openSolicitarCredito();
  }
})();

// getClienteAtivo() (hub.js) ja resolve isso: dealer sempre devolve o
// proprio cliente; equipe/representante so devolve algo quando selecionou
// uma revenda no topo ("Atuando por X"). Null = visao geral de staff, sem
// revenda em foco -- usado para decidir entre lista filtrada e lista
// completa (e antes do ajuste de 2026-10-28, nenhuma tela aqui respeitava
// a revenda selecionada: Titulos/NFs mostravam tudo o que a RLS deixava
// ver, revenda escolhida ou nao).

function abrirNovaSolicitacaoGeral(assunto) {
  const clienteId = getClienteAtivo();
  if (!clienteId) { toast('Selecione uma revenda para abrir a solicitacao', 'error'); return; }
  abrirNovaSolicitacao('geral', null, clienteId, assunto);
}

// Resumo calculado a partir das linhas JA carregadas (nunca de consulta
// separada) -- garante que o numero bate com a lista logo abaixo, revenda
// selecionada ou nao.
async function renderResumoFinanceiro(linhas, clienteId) {
  const wrap = document.getElementById('kpiResumo');
  const aVencer = linhas.filter(l => l.status === 'aberto').reduce((s, l) => s + Number(l.valor_aberto || 0), 0);
  const vencido = linhas.filter(l => l.status === 'vencido').reduce((s, l) => s + Number(l.valor_aberto || 0), 0);
  const atrasos = linhas.filter(l => l.status === 'vencido').map(l => l.dias_atraso || 0);
  const maiorAtraso = atrasos.length ? Math.max(...atrasos) : 0;

  // Limite/Disponivel so fazem sentido por revenda -- somar o limite de
  // milhares de clientes nao e um numero que ajuda ninguem a decidir nada.
  let limiteCards = '';
  if (clienteId) {
    try {
      const [c] = await sb('/hub_clientes?id=eq.' + clienteId + '&select=limite_credito,limite_disponivel');
      if (c) {
        limiteCards = `
          <div class="kpi-card"><div class="kpi-label">Limite Total</div><div class="kpi-value">${fmtMoeda(c.limite_credito)}</div></div>
          <div class="kpi-card"><div class="kpi-label">Disponivel</div><div class="kpi-value">${fmtMoeda(c.limite_disponivel)}</div></div>`;
      }
    } catch {}
  }

  wrap.innerHTML = `<div class="kpi-row">
    ${limiteCards}
    <div class="kpi-card"><div class="kpi-label">A Vencer</div><div class="kpi-value">${fmtMoeda(aVencer)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Vencido</div><div class="kpi-value ${vencido > 0 ? 'danger' : ''}">${fmtMoeda(vencido)}</div></div>
    <div class="kpi-card"><div class="kpi-label">Maior Atraso</div><div class="kpi-value ${maiorAtraso > 0 ? 'warning' : ''}">${maiorAtraso} dias</div></div>
  </div>`;
}

// Cache local da lista carregada: filtro so re-renderiza (sem refetch),
// digitar na busca responde na hora.
let _financeiroCache = [];

function filtroTexto(valor, termo) {
  return String(valor || '').toLowerCase().includes(termo);
}

// Visao unificada Titulos + Notas Fiscais (feedback Andre, 2026-10-29: "para
// a visao do cliente e uma coisa so"). A NF e a BASE (nao o titulo): toda
// venda gera NF, mas o sync de titulo so traz status==APPROVED -- um titulo
// que foi pago (SETTLED) some da tabela, e a NF teria que sumir junto se ela
// fosse a base. Junta pelo vinculo estavel hub_titulos.nota_fiscal_id
// (gravado pelo sync/backfill em api/sync-financeiro.js), nao reconsultando
// o Zen na hora.
async function loadFinanceiro() {
  const wrap = document.getElementById('financeiroList');
  const clienteId = getClienteAtivo();
  try {
    let urlNf = '/hub_notas_fiscais?ativo=eq.true&order=data_emissao.desc&select=*,hub_clientes(razao_social),hub_pedidos(numero)';
    let urlTit = '/hub_titulos?ativo=eq.true&nota_fiscal_id=not.is.null&select=*,hub_pedidos(numero)';
    if (clienteId) { urlNf += '&cliente_id=eq.' + clienteId; urlTit += '&cliente_id=eq.' + clienteId; }
    const [nfs, titulos] = await Promise.all([sb(urlNf), sb(urlTit)]);

    const tituloPorNf = {};
    for (const t of titulos) tituloPorNf[t.nota_fiscal_id] = t;

    // Titulo sem NF vinculada ainda (sync nao casou -- ex: NF ainda nao
    // sincronizada) tambem precisa aparecer, senao a cobranca some da tela.
    const nfIds = new Set(nfs.map(n => n.id));
    const titulosOrfaos = titulos.filter(t => !nfIds.has(t.nota_fiscal_id));

    _financeiroCache = [
      ...nfs.map(n => ({ ...n, _titulo: tituloPorNf[n.id] || null, _tipo: 'nf' })),
      ...titulosOrfaos.map(t => ({ ...t, _titulo: t, _tipo: 'titulo_orfao' }))
    ];
    renderFinanceiro();
  } catch (e) {
    _financeiroCache = [];
    wrap.innerHTML = '<div class="empty-state"><h3>Erro ao carregar financeiro</h3></div>';
  }
}

function renderFinanceiro() {
  const wrap = document.getElementById('financeiroList');
  const clienteId = getClienteAtivo();
  const termo = (document.getElementById('filtroFinBusca')?.value || '').trim().toLowerCase();
  const de = document.getElementById('filtroFinDe')?.value || '';
  const ate = document.getElementById('filtroFinAte')?.value || '';

  const linhas = _financeiroCache.filter(l => {
    const dataRef = l._tipo === 'nf' ? l.data_emissao : l.data_vencimento;
    if (de && (dataRef || '') < de) return false;
    if (ate && (dataRef || '') > ate) return false;
    if (!termo) return true;
    return filtroTexto(l.numero_nf, termo) || filtroTexto(l.numero_titulo, termo)
      || filtroTexto(l.hub_pedidos?.numero, termo) || filtroTexto(l.hub_clientes?.razao_social, termo)
      || filtroTexto(l.chave_acesso, termo);
  });

  renderResumoFinanceiro(_financeiroCache.map(l => l._titulo).filter(Boolean), clienteId);
  if (!linhas.length) { wrap.innerHTML = '<div class="empty-state"><h3>Nenhum lancamento encontrado</h3></div>'; return; }
  wrap.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Cliente</th><th>Pedido</th><th>NF</th><th>Emissao</th><th>Valor</th><th>Vencimento</th><th>Status</th><th></th></tr></thead>
    <tbody>${linhas.map(l => {
      const t = l._titulo;
      const ehNf = l._tipo === 'nf';
      const assunto = (ehNf ? 'NF ' + String(l.numero_nf || '') : 'Titulo ' + String(l.numero_titulo || '')).replace(/'/g, "\\'");
      return `<tr>
      <td>${l.hub_clientes?.razao_social || '—'}</td>
      <td>${l.hub_pedidos?.numero || '—'}</td>
      <td>${ehNf ? `<strong>${l.numero_nf}</strong>` : `<span style="color:#a0aec0" title="Titulo ainda sem NF sincronizada">Titulo ${l.numero_titulo}</span>`}</td>
      <td>${fmtData(ehNf ? l.data_emissao : l.data_vencimento)}</td>
      <td>${fmtMoeda(ehNf ? l.valor_total : l.valor_original)}</td>
      <td>${t ? fmtData(t.data_vencimento) : '—'}</td>
      <td>${t
          ? `<span class="status-badge status-${t.status}">${t.status}</span>${t.dias_atraso > 0 ? ' <span style="font-size:11px;color:#718096">' + t.dias_atraso + 'd</span>' : ''}`
          : '<span style="font-size:11px;color:#a0aec0">sem titulo em aberto</span>'}
      </td>
      <td style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
        ${ehNf ? `
          <button class="btn btn-primary btn-sm" id="baixarNf-${l.id}" onclick="baixarDocumentoNF('pdf', '${l.id}', '${String(l.numero_nf || l.id)}')">Baixar NF</button>
          <button class="btn btn-outline btn-sm" id="baixarXml-${l.id}" onclick="baixarDocumentoNF('xml', '${l.id}', '${String(l.numero_nf || l.id)}')">XML</button>
        ` : ''}
        ${t ? (t.url_boleto
          ? `<a href="${t.url_boleto}" target="_blank" class="btn btn-primary btn-sm">Boleto</a>`
          : '<span style="font-size:11px;color:#a0aec0">Boleto nao integrado</span>') : ''}
        <button class="btn btn-outline btn-sm" onclick="abrirSolicitacoes('${ehNf ? 'nota_fiscal' : 'titulo'}', '${l.id}', '${l.cliente_id}', '${assunto}')">Duvida</button>
      </td>
    </tr>`; }).join('')}</tbody>
  </table></div>`;
}

// Baixa o PDF (DANFE) ou o XML da NF -- arquivo que o Zen ja guarda pronto
// desde a autorizacao da SEFAZ, nunca gerado na hora. Por isso vai por
// fetch+blob em vez de <a href>: precisa mandar o token de autenticacao no
// header.
async function baixarDocumentoNF(tipo, nfId, numeroNf) {
  const btnId = tipo === 'pdf' ? 'baixarNf-' + nfId : 'baixarXml-' + nfId;
  const btn = document.getElementById(btnId);
  const textoOriginal = btn ? btn.textContent : null;
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  try {
    const param = tipo === 'pdf' ? 'baixar_nf' : 'baixar_xml';
    const r = await fetch('/api/sync-financeiro?' + param + '=' + nfId, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + (SESSION?.access_token || '') }
    });
    if (!r.ok) {
      const erro = await r.json().catch(() => ({}));
      toast(erro.error || 'Documento nao disponivel', 'error');
      return;
    }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'NF-' + numeroNf + '.' + tipo;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  } catch (e) {
    toast('Documento nao disponivel', 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

async function loadCreditoResumo() {
  const wrap = document.getElementById('kpiCredito');
  const clienteId = getClienteAtivo();
  if (!clienteId) {
    wrap.innerHTML = '<div style="padding:10px 0;color:#718096;font-size:13px">Selecione uma revenda para ver o credito dela.</div>';
    return;
  }
  try {
    const [r] = await sb('/hub_v_financeiro_cliente?cliente_id=eq.' + clienteId + '&select=*&limit=1');
    if (!r) { wrap.innerHTML = ''; return; }
    const comprometido = Math.max(0, (r.limite_credito || 0) - (r.limite_disponivel || 0));
    wrap.innerHTML = `<div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Limite Atual</div><div class="kpi-value">${fmtMoeda(r.limite_credito)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Comprometido</div><div class="kpi-value">${fmtMoeda(comprometido)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Disponivel</div><div class="kpi-value">${fmtMoeda(r.limite_disponivel)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Dias Medio de Atraso</div><div class="kpi-value ${r.dias_medio_atraso_vencidos > 0 ? 'warning' : ''}">${r.dias_medio_atraso_vencidos || 0} dias</div></div>
    </div>`;
  } catch { wrap.innerHTML = ''; }
}

async function loadCredito() {
  const wrap = document.getElementById('creditoList');
  const clienteId = getClienteAtivo();
  await loadCreditoResumo();
  try {
    let url = '/hub_solicitacoes_credito?ativo=eq.true&order=criado_em.desc&select=*,hub_clientes(razao_social)';
    if (clienteId) url += '&cliente_id=eq.' + clienteId;
    const solic = await sb(url);
    if (!solic.length) { wrap.innerHTML = '<div class="empty-state"><h3>Nenhuma solicitacao</h3></div>'; return; }
    wrap.innerHTML = `<div style="overflow-x:auto"><table>
      <thead><tr><th>Cliente</th><th>Tipo</th><th>Valor Solicitado</th><th>Valor Aprovado</th><th>Status</th><th>Data</th></tr></thead>
      <tbody>${solic.map(s => `<tr>
        <td>${s.hub_clientes?.razao_social || '—'}</td>
        <td>${s.tipo.replace(/_/g,' ')}</td>
        <td>${fmtMoeda(s.valor_solicitado)}</td>
        <td>${s.valor_aprovado ? fmtMoeda(s.valor_aprovado) : '—'}</td>
        <td><span class="status-badge status-${s.status === 'aprovado' ? 'pago' : s.status === 'rejeitado' ? 'vencido' : 'aberto'}">${s.status}</span></td>
        <td>${fmtData(s.criado_em)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`;
  } catch (e) { wrap.innerHTML = '<div class="empty-state"><h3>Erro ao carregar solicitacoes</h3></div>'; }
}

function openSolicitarCredito() {
  openModal(`
    <h3 style="font-size:18px;margin-bottom:16px;color:#1d327b">Solicitar Credito</h3>
    <div class="form-row">
      <label>Tipo</label>
      <select id="credTipo">
        <option value="aumento_limite">Aumento de limite</option>
        <option value="antecipacao_pagamento">Antecipacao de pagamento</option>
        <option value="prazo_especial">Prazo especial</option>
      </select>
    </div>
    <div class="form-row"><label>Valor (R$)</label><input id="credValor" type="number" step="0.01" placeholder="0,00"></div>
    <div class="form-row"><label>Justificativa</label><textarea id="credJust" rows="3" placeholder="Descreva o motivo da solicitacao..."></textarea></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="enviarSolicitacao()">Enviar</button>
    </div>
  `);
}

async function enviarSolicitacao() {
  const tipo = document.getElementById('credTipo').value;
  const valor = parseFloat(document.getElementById('credValor').value);
  const just = document.getElementById('credJust').value.trim();
  if (!just) { toast('Preencha a justificativa', 'error'); return; }
  const clienteId = getClienteAtivo();
  if (!clienteId) { toast('Selecione uma revenda para solicitar credito', 'error'); return; }

  try {
    await sb('/hub_solicitacoes_credito', 'POST', {
      cliente_id: clienteId,
      solicitante_id: PERFIL.id,
      tipo, valor_solicitado: valor || null, justificativa: just
    });
    closeModal();
    toast('Solicitacao enviada');
    loadCredito();
  } catch (e) { toast('Erro ao enviar: ' + e.message, 'error'); }
}
</script>
</body>
</html>
