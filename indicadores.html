<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Indicadores - Boxer Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fs-h1:18px;--fs-h2:16px;--fs-body:13px;--fs-label:11px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;color:#1a202c}
:focus-visible{outline:2px solid #25bbee;outline-offset:1px}

.panel{max-width:1400px;margin:0 auto;padding:20px 24px 40px}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-4);flex-wrap:wrap;gap:var(--sp-3)}
.page-title{font-size:var(--fs-h1);font-weight:700;color:#1d327b}
.page-sub{font-size:var(--fs-body);color:#718096;margin-top:2px}

.btn{padding:8px 16px;border-radius:8px;border:1px solid;font-family:Outfit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#1d327b;color:#fff;border-color:#1d327b}.btn-primary:hover{background:#162666}
.btn-outline{background:#fff;color:#4a5568;border-color:#c3cfe2}.btn-outline:hover{border-color:#25bbee;color:#1d327b}
.btn-sm{padding:4px 10px;font-size:12px}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-3);margin-bottom:var(--sp-5)}
.kpi-card{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:var(--sp-4);position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:#1d327b}
.kpi-card.destaque::before{background:#25bbee}
.kpi-card.alerta::before{background:#dc2626}
.kpi-label{font-size:var(--fs-label);font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.06em;margin-bottom:var(--sp-2)}
.kpi-value{font-size:24px;font-weight:700;color:#1d327b;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-value.danger{color:#dc2626}
.kpi-sub{font-size:11px;color:#a0aec0;margin-top:4px}

.card{background:#fff;border:1px solid #d0d8e8;border-radius:10px;margin-bottom:var(--sp-4);overflow:hidden}
.card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #e2e8f0}
.card-header h3{font-size:var(--fs-h2);color:#1d327b;font-weight:600}
.card-body{overflow-x:auto}

table{width:100%;border-collapse:collapse;font-size:var(--fs-body)}
thead th{padding:var(--sp-2) var(--sp-3);text-align:left;color:#718096;font-weight:500;font-size:var(--fs-label);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;background:#f7fafc}
tbody td{padding:var(--sp-2) var(--sp-3);border-bottom:1px solid #e2e8f0;vertical-align:middle}
tbody tr:hover{background:#f0f7ff}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.st-aprovado,.st-faturado,.st-entregue{background:#d1fae5;color:#065f46}
.st-enviado{background:#dbeafe;color:#1e40af}
.st-cancelado,.st-rejeitado{background:#fee2e2;color:#991b1b}
.st-submetido,.st-em_analise,.st-em_separacao,.st-visualizado,.st-aceito_cliente{background:#fef3c7;color:#92400e}
.st-rascunho{background:#e2e8f0;color:#4a5568}

.empty-state{text-align:center;padding:40px 20px;color:#718096}
.sem-revenda{max-width:560px;margin:60px auto;text-align:center;background:#fff;border:1px solid #d0d8e8;border-radius:12px;padding:40px}
.sem-revenda h3{color:#1d327b;margin-bottom:10px}
.sem-revenda p{color:#718096;font-size:13px;margin-bottom:18px}

@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .topbar,.hub-nav,.btn,.hub-mobile-user{display:none!important}
  .card{break-inside:avoid;border-color:#cbd5e0}
}
</style>
</head>
<body>

<div class="panel">
  <div class="page-header">
    <div>
      <div class="page-title" id="tituloRevenda">Indicadores</div>
      <div class="page-sub" id="subRevenda"></div>
    </div>
    <div style="display:flex;gap:8px" id="acoesExport"></div>
  </div>
  <div id="corpoIndicadores"><div class="empty-state">Carregando...</div></div>
</div>

<script src="hub.js"></script>
<script>
if (!requireAuth()) throw 'auth';

const STATUS_LABEL = {
  rascunho: 'Rascunho', submetido: 'Submetido', em_analise: 'Em analise', aprovado: 'Aprovado',
  rejeitado: 'Rejeitado', em_separacao: 'Em separacao', faturado: 'Faturado', enviado: 'Enviado',
  entregue: 'Entregue', cancelado: 'Cancelado', visualizado: 'Visto pelo cliente', aceito_cliente: 'Aceito pelo cliente'
};

let DADOS = null;

async function carregarIndicadores() {
  const wrap = document.getElementById('corpoIndicadores');
  const clienteId = getClienteAtivo();

  if (!clienteId) {
    document.getElementById('acoesExport').innerHTML = '';
    wrap.innerHTML = `<div class="sem-revenda">
      <h3>Selecione uma revenda</h3>
      <p>Escolha a revenda para ver orcamentos gerados, pedidos confirmados, faturamento e taxa de conversao dela.</p>
      <button class="btn btn-primary" onclick="abrirSeletorCliente()">Selecionar revenda</button>
    </div>`;
    return;
  }

  try {
    const r = await fetch('/api/push-pedido?target=indicadores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (SESSION?.access_token || '') },
      body: JSON.stringify({ cliente_id: clienteId })
    });
    const j = await r.json();
    if (!r.ok) { wrap.innerHTML = '<div class="empty-state"><h3>' + esc(j.error || 'Erro ao carregar') + '</h3></div>'; return; }
    DADOS = j;
    render();
  } catch (e) {
    wrap.innerHTML = '<div class="empty-state"><h3>Erro ao carregar indicadores</h3></div>';
  }
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function badge(status) {
  const label = STATUS_LABEL[status] || status;
  return `<span class="status-badge st-${status}">${esc(label)}</span>`;
}

function render() {
  const { cliente, kpis, orcamentos, pedidos, produtos_top } = DADOS;
  document.getElementById('tituloRevenda').textContent = 'Indicadores — ' + (cliente.nome_fantasia || cliente.razao_social);
  document.getElementById('subRevenda').textContent = cliente.cnpj;

  document.getElementById('acoesExport').innerHTML = `
    <button class="btn btn-outline btn-sm" onclick="window.print()">Exportar PDF</button>
    <button class="btn btn-outline btn-sm" onclick="exportarExcel()">Exportar Excel</button>`;

  const taxaPct = kpis.taxa_conversao == null ? '—' : (kpis.taxa_conversao * 100).toFixed(0) + '%';

  const wrap = document.getElementById('corpoIndicadores');
  wrap.innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card destaque"><div class="kpi-label">Orcamentos Gerados</div><div class="kpi-value">${kpis.orcamentos_gerados}</div></div>
      <div class="kpi-card"><div class="kpi-label">Pedidos Confirmados</div><div class="kpi-value">${kpis.pedidos_confirmados}</div></div>
      <div class="kpi-card"><div class="kpi-label">Faturamento Realizado</div><div class="kpi-value">${fmtMoeda(kpis.faturamento_realizado)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Taxa de Conversao</div><div class="kpi-value">${taxaPct}</div><div class="kpi-sub">orcamento &rarr; pedido aprovado</div></div>
      <div class="kpi-card"><div class="kpi-label">Ticket Medio</div><div class="kpi-value">${fmtMoeda(kpis.ticket_medio_pedido)}</div></div>
      <div class="kpi-card${kpis.titulos_vencidos > 0 ? ' alerta' : ''}"><div class="kpi-label">Titulos Vencidos</div><div class="kpi-value ${kpis.titulos_vencidos > 0 ? 'danger' : ''}">${fmtMoeda(kpis.titulos_vencidos)}</div></div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Ultimos orcamentos</h3></div>
      <div class="card-body">
        ${orcamentos.length ? `<table>
          <thead><tr><th>Codigo</th><th>Status</th><th class="num">Valor</th><th>Data</th></tr></thead>
          <tbody>${orcamentos.map(o => `<tr>
            <td>${esc(o.codigo)}</td><td>${badge(o.status)}</td>
            <td class="num">${fmtMoeda(o.total_final)}</td><td>${fmtData(o.criado_em)}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="empty-state">Nenhum orcamento ainda</div>'}
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Ultimos pedidos</h3></div>
      <div class="card-body">
        ${pedidos.length ? `<table>
          <thead><tr><th>Numero</th><th>Nº ZEN</th><th>Status</th><th class="num">Valor</th><th>Data</th></tr></thead>
          <tbody>${pedidos.map(p => `<tr>
            <td>${esc(p.numero || 'Rascunho')}</td><td>${esc(p.erp_pedido_id || '—')}</td><td>${badge(p.status)}</td>
            <td class="num">${fmtMoeda(p.valor_total)}</td><td>${fmtData(p.criado_em)}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="empty-state">Nenhum pedido ainda</div>'}
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3>Produtos mais pedidos</h3></div>
      <div class="card-body">
        ${produtos_top.length ? `<table>
          <thead><tr><th>Codigo</th><th>Produto</th><th class="num">Qtd</th><th class="num">Valor</th></tr></thead>
          <tbody>${produtos_top.map(p => `<tr>
            <td>${esc(p.sku)}</td><td>${esc(p.nome)}</td><td class="num">${p.quantidade}</td><td class="num">${fmtMoeda(p.valor)}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="empty-state">Sem itens de pedido ainda</div>'}
      </div>
    </div>
  `;
}

// Exporta o que esta na tela como CSV (abre direto no Excel) -- sem
// dependencia nova no servidor, mesmo padrao de "gerar PDF" via window.print.
function exportarExcel() {
  if (!DADOS) return;
  const linhas = [['Tipo', 'Codigo/Numero', 'Status', 'Valor', 'Data']];
  DADOS.orcamentos.forEach(o => linhas.push(['Orcamento', o.codigo, STATUS_LABEL[o.status] || o.status, o.total_final, o.criado_em]));
  DADOS.pedidos.forEach(p => linhas.push(['Pedido', p.numero || 'Rascunho', STATUS_LABEL[p.status] || p.status, p.valor_total, p.criado_em]));
  const csv = linhas.map(l => l.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(';')).join('\r\n');
  const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'indicadores-' + (DADOS.cliente.cnpj || 'revenda') + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

(async () => {
  await loadPerfil();
  renderTopbar('Indicadores');
  carregarIndicadores();
})();

// Recarrega quando o usuario troca de revenda no topo (setClienteAtivo da
// reload completo da pagina, entao isto cobre o caso raro de storage mudar
// sem reload -- defensivo, baixo custo).
window.addEventListener('storage', e => { if (e.key === clienteAtivoKey()) carregarIndicadores(); });
</script>
</body>
</html>
