<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Orçamento — Boxer Soldas</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;color:#1a202c;padding-bottom:90px}
.top{background:linear-gradient(135deg,#1d327b,#162666);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #25bbee}
.top-left{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:15px}
.top-right{color:#93b4d4;font-size:13px;font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px}
@media(min-width:900px){.wrap{max-width:980px}}
.card{background:#fff;border:1px solid #d0d8e8;border-radius:12px;padding:20px;margin-bottom:16px}
.hero{border-left:4px solid #e30613;position:relative}
.hero h1{font-size:19px;color:#1d327b;margin-bottom:8px}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#e2e8f0;color:#4a5568;margin-right:6px}
.chip.laranja{background:#fff4e5;color:#9a5b00}
.chip.verm{background:#fee2e2;color:#991b1b}
.chip.verde{background:#dcfce7;color:#166534}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:#1d327b;font-weight:600;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:6px 8px;text-align:left;color:#718096;font-weight:500;font-size:10px;text-transform:uppercase;border-bottom:2px solid #e2e8f0}
tbody td{padding:8px;border-bottom:1px solid #e2e8f0;vertical-align:middle}
tfoot td{padding:8px;border-top:1px solid #e2e8f0}
.tfoot-grupo td{font-size:11px;font-weight:500;color:#a0aec0;border-top:1px solid #f0f4f8}
.tfoot-qtd{font-weight:400;color:#cbd5e0}
.tfoot-total td{font-size:15px;font-weight:700;color:#1d327b;border-top:2px solid #1d327b;padding-top:12px}
.est{display:inline-block;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600}
.est.ok{background:#dcfce7;color:#166534}
.est.prev{background:#fff4e5;color:#9a5b00}
.est.sem{background:#fee2e2;color:#991b1b}
.est.info{background:#e2e8f0;color:#4a5568}
.cond-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.cond-item b{display:block;font-size:13px;color:#1a202c;margin-bottom:2px}
.cond-item span{font-size:12px;color:#718096}
.dados-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.dados-bloco .t{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#718096;font-weight:600;margin-bottom:6px}
.dados-bloco .nome{font-size:14px;font-weight:700;color:#1d327b;line-height:1.3}
.dados-bloco .linha{font-size:12px;color:#4a5568;margin-top:3px;line-height:1.4}
@media(max-width:640px){.dados-grid{grid-template-columns:1fr;gap:16px}.cond-grid{grid-template-columns:1fr}}
.cta{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid #e2e8f0;padding:12px 16px;display:flex;align-items:center;gap:10px;z-index:50;flex-wrap:wrap}
.cta-total{font-size:17px;font-weight:700;color:#1d327b;flex:1}
.btn{padding:10px 18px;border-radius:8px;border:1px solid;font-family:Outfit;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn-primary{background:#e30613;color:#fff;border-color:#e30613}
.btn-outline{background:#fff;color:#1d327b;border-color:#c3cfe2}
.recusar{display:block;text-align:center;color:#a0aec0;font-size:12px;text-decoration:underline;margin-top:14px;cursor:pointer}
.prod-foto{width:40px;height:40px;border-radius:6px;background:#f7fafc;border:1px solid #e2e8f0;display:inline-flex;align-items:center;justify-content:center;overflow:hidden;flex:none;vertical-align:middle;margin-right:8px}
.prod-foto img{max-width:100%;max-height:100%;object-fit:contain}
.prod-cel{display:flex;align-items:center}
@media(max-width:640px){
  table,thead,tbody,tr,td{display:block;width:100%}
  thead{display:none}
  tbody tr{padding:10px 0;border-bottom:1px solid #e2e8f0;display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
  tbody td{padding:0;border:none}
  tbody td:first-child{grid-column:1/-1}
  tbody td[data-l]::before{content:attr(data-l) ' ';font-size:10px;color:#718096;text-transform:uppercase;display:block}
}
.so-print{display:none}
/* Impressao/PDF compacto (pedido do Andre, 2026-11-25): antes o card de itens tinha
   break-inside:avoid, nao cabia na 1a folha e ia INTEIRO para a 2a (1a folha quase vazia),
   e tudo ocupava 3 paginas. Agora o card de itens quebra entre linhas (cabecalho da tabela
   repete, totais so no fim) e os cards pequenos (condicoes/observacoes/dados) nao se partem.
   Mantido igual ao da previa em pedidos.html (renderOrcamentoHtml). */
@media print{
  @page{size:A4;margin:8mm}
  body{background:#fff;padding:0;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cta,.recusar{display:none!important}
  .top{padding:8px 14px;border-bottom-width:2px}
  .top-left{font-size:13px;gap:8px}.top-left svg{width:20px;height:20px}.top-right{font-size:12px}
  .wrap{max-width:none;padding:8px 0 0}
  .card{border-color:#cbd5e0;border-radius:6px;padding:8px 12px;margin-bottom:8px;break-inside:auto}
  .card.keep{break-inside:avoid}
  .hero{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;border-left-width:3px;break-after:avoid}
  .hero h1{font-size:14px;margin:0 8px 0 0}
  .chip{font-size:10px;padding:2px 8px;margin-right:0}
  .sec-title{font-size:10px;margin-bottom:5px;break-after:avoid}
  table{font-size:10px}
  thead{display:table-header-group}
  tfoot{display:table-row-group}
  tr{break-inside:avoid}
  thead th{padding:3px 5px;font-size:9px}
  tbody td{padding:3px 5px}
  tfoot td{padding:3px 5px}
  .tfoot-total td{font-size:12px;padding-top:5px}
  .prod-foto{width:24px;height:24px;margin-right:6px;border-radius:4px}
  .est{font-size:8.5px;padding:1px 6px}
  .cond-grid,.dados-grid{gap:10px}
  .cond-item b{font-size:11px;margin-bottom:1px}.cond-item span{font-size:10.5px}
  .dados-bloco .t{font-size:9px;margin-bottom:3px}.dados-bloco .nome{font-size:11.5px}.dados-bloco .linha{font-size:10px;margin-top:1px}
  .so-tela{display:none}.so-print{display:inline}
  td[data-l="Qtd"],td[data-l="Impostos"],td[data-l="Unitário"],td[data-l="Total"],tfoot td:last-child{white-space:nowrap}
  .tfoot-grupo td{color:#4a5568}.tfoot-qtd{color:#718096}
}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:420px;margin:16px}
.modal h3{color:#1d327b;font-size:16px;margin-bottom:12px}
.field{margin-bottom:12px}
.field-err{font-size:12px;color:#e30613;background:#fee2e2;border:1px solid #fecaca;border-radius:6px;padding:8px 10px;margin-bottom:12px;display:none}
.field-err.show{display:block}
.field label{display:block;font-size:11px;color:#4a5568;text-transform:uppercase;margin-bottom:4px}
.field input,.field textarea{width:100%;padding:9px 12px;border:1px solid #c3cfe2;border-radius:8px;font-family:Outfit;font-size:13px}
.aceito-faixa{background:#dcfce7;color:#166534;padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px;text-align:center}
.empty{text-align:center;padding:60px 20px;color:#718096}

body.noc,body.noc *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body.noc input,body.noc textarea{-webkit-user-select:text;user-select:text}
body.noc img{-webkit-user-drag:none}
.avoc{display:none}
body.noc.oculto .avoc{display:block;position:fixed;left:0;right:0;top:40%;text-align:center;font:700 15px Outfit,Arial,sans-serif;color:#1d327b;z-index:60}
@media print{body.noc>*{display:none!important}body.noc::before{content:'Impressão e cópia não são permitidas neste documento.';display:block;padding:60px;font:700 18px Arial,sans-serif;color:#1d327b}}
body.noc.oculto #corpo,body.noc.oculto .top,body.noc.oculto .cta{visibility:hidden}
.wm{position:fixed;left:0;top:0;right:0;bottom:0;pointer-events:none;z-index:45;background-repeat:repeat;background-size:760px 380px}
@media print{.wm{position:fixed;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>

<script>
const SB_URL = 'https://bmepxcnrsofofoswubuu.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtZXB4Y25yc29mb2Zvc3d1YnV1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MTczNzMsImV4cCI6MjA5NTI5MzM3M30.S55ouFczRYlUYNFf5PotYKXBPT5idypTSmbzR-x2Pk0';
const HUB_API = '/api/push-pedido?target=orcamento';

function fmtMoeda(v) { return (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }); }
function fmtData(d) { return d ? new Date(d).toLocaleDateString('pt-BR') : '—'; }
function fmtDataHora(d) { return d ? new Date(d).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function fmtCnpj(c) { const d = String(c || '').replace(/\D/g, ''); return d.length === 14 ? d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5') : (c || ''); }
// Telefone sempre formatado na exibicao -- o banco guarda so digitos
// (soDigitos em api/_orcamento.js), nunca formatado (achado real, Andre, 2026-11-24).
function fmtTel(t) { const d = String(t || '').replace(/\D/g, ''); return d.length === 11 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7) : d.length === 10 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6) : (t || ''); }
// Previsao de chegada em quinzena, nao data exata (pedido do Andre, 2026-11-24)
// -- copia standalone, hub.js nao carrega aqui. Ver a mesma funcao em hub.js
// pro resto do raciocinio (UTC, 1-15 vira 2a quinzena do mesmo mes, 16-31
// vira 1a quinzena do mes seguinte).
const MESES_ABREV = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
function fmtPrevisaoQuinzena(d) {
  if (!d) return '';
  const dt = new Date(d);
  const dia = dt.getUTCDate();
  let mes = dt.getUTCMonth(), ano = dt.getUTCFullYear(), semana;
  if (dia <= 15) { semana = 2; } else { semana = 1; mes++; if (mes > 11) { mes = 0; ano++; } }
  return 'Previsão de Fat. ' + semana + 'ª Semana ' + MESES_ABREV[mes] + '/' + String(ano).slice(-2);
}
// Vocabulario de frete (pedido do Andre, 2026-11-25) -- copia standalone,
// hub.js nao carrega aqui. Ver a mesma constante em pedidos.html/_orcamento.js.
const FRETE_LABELS = {
  CIF: 'CIF automático', FOB: 'FOB (cliente providencia o transporte)',
  RETIRADA_BOXER: 'Retirada na Boxer (Campinas/São Paulo/Guarulhos)',
  CARRO_BOXER: 'Carro Boxer', CAMINHAO_BOXER_SP: 'Entrega com Caminhão Boxer (SP)'
};
function abrirModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); }
function fecharModal() { document.getElementById('modalOverlay').classList.remove('show'); }

async function rpc(nome, params) {
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + nome, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Profile': 'comercial' },
    body: JSON.stringify(params)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

const params = new URLSearchParams(location.search);
const token = params.get('t');
let ORC = null;
let SESSAO = null, VISUALIZADOR = '', EMAIL_GATE = '';
const HUB_ACESSO = '/api/disponibilidade?target=acesso';
const SESS_KEY = 'orc_sess_' + token;

async function rpcPub(nome, p) {
  const r = await fetch(SB_URL + '/rest/v1/rpc/' + nome, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Profile': 'public' },
    body: JSON.stringify(p)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
function lerSessao() {
  try { const o = JSON.parse(sessionStorage.getItem(SESS_KEY) || 'null'); if (o && o.s && (!o.x || new Date(o.x) > new Date())) { EMAIL_GATE = o.e || ''; return o.s; } } catch (e) {}
  return null;
}
function limparSessao() { try { sessionStorage.removeItem(SESS_KEY); } catch (e) {} SESSAO = null; }
function gateHtml(titulo, texto, corpo, msg, ok) {
  document.getElementById('corpo').innerHTML = '<div class="card" style="max-width:420px;margin:30px auto"><h1 style="font-size:18px;color:#1d327b;margin-bottom:6px">' + titulo + '</h1>' +
    '<p style="font-size:13px;color:#4a5568;margin-bottom:14px">' + texto + '</p>' +
    (msg ? '<div class="field-err show" style="' + (ok ? 'background:#dcfce7;color:#166534;border-color:#bbf7d0' : '') + '">' + esc(msg) + '</div>' : '') + corpo + '</div>';
}
function telaEmail(msg, ok) {
  gateHtml('Acesso ao orçamento', 'Para a sua segurança, confirme o seu e-mail. Enviaremos um código de 6 dígitos. O acesso fica registrado com o seu e-mail.',
    '<div class="field"><label>E-mail</label><input id="gEmail" type="email" autocomplete="email" placeholder="seu@email.com" value="' + esc(EMAIL_GATE) + '" onkeydown="if(event.key===\'Enter\')gatePedir()"></div>' +
    '<button class="btn btn-primary" id="gBtn" style="width:100%;justify-content:center" onclick="gatePedir()">Enviar código</button>', msg, ok);
}
function telaCodigo(msg, ok) {
  gateHtml('Digite o código', 'Enviamos um código de 6 dígitos para <strong>' + esc(EMAIL_GATE) + '</strong>. Confira também a caixa de spam. Ele vale por 10 minutos.',
    '<div class="field"><label>Código</label><input id="gCod" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="000000" onkeydown="if(event.key===\'Enter\')gateConfirmar()"></div>' +
    '<button class="btn btn-primary" id="gBtn" style="width:100%;justify-content:center" onclick="gateConfirmar()">Entrar</button>' +
    '<a class="recusar" onclick="telaEmail()">Usar outro e-mail</a>', msg, ok);
}
const MSG_GATE = {
  nao_autorizado: 'Este e-mail não é o destinatário deste orçamento. Use o e-mail que recebeu o link.',
  expirado: 'Este orçamento expirou. Peça um novo ao seu representante Boxer.',
  cancelado: 'Este orçamento foi cancelado. Fale com o seu representante Boxer.',
  nao_encontrado: 'Link inválido ou não encontrado. Confira o endereço com o seu representante Boxer.',
  limite: 'Muitas tentativas. Aguarde alguns minutos e tente de novo.',
  erro: 'Não foi possível enviar o código agora. Tente novamente em instantes.'
};
async function gatePedir() {
  const email = (document.getElementById('gEmail').value || '').trim().toLowerCase();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { EMAIL_GATE = email; telaEmail('Informe um e-mail válido.'); return; }
  EMAIL_GATE = email;
  const b = document.getElementById('gBtn'); b.disabled = true; b.textContent = 'Enviando...';
  try {
    const r = await fetch(HUB_ACESSO, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao: 'link_codigo', origem: 'orcamento', token, email }) });
    const j = await r.json().catch(() => ({}));
    const st = (r.ok && j.status) || 'erro';
    if (st === 'enviado') { telaCodigo('Código enviado!', true); return; }
    let m = MSG_GATE[st] || MSG_GATE.erro;
    if (st === 'nao_autorizado' && j.dica) m += ' (cadastrado: ' + j.dica + ')';
    telaEmail(m);
  } catch (e) { telaEmail(MSG_GATE.erro); }
}
async function gateConfirmar() {
  const cod = (document.getElementById('gCod').value || '').replace(/\D/g, '');
  if (cod.length < 6) { telaCodigo('Digite o código recebido por e-mail.'); return; }
  const b = document.getElementById('gBtn'); b.disabled = true; b.textContent = 'Entrando...';
  try {
    const rr = await fetch(HUB_ACESSO, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ acao: 'link_validar', origem: 'orcamento', token, email: EMAIL_GATE, codigo: cod, ua: navigator.userAgent }) });
    const d = await rr.json().catch(() => ({}));
    if (!d || !d.ok) { telaCodigo(d && d.motivo === 'bloqueado' ? 'Muitas tentativas. Peça um novo código.' : (d && d.motivo === 'expirado' ? 'Este orçamento expirou.' : 'Código inválido ou expirado. Peça um novo código.')); return; }
    SESSAO = d.sessao;
    try { sessionStorage.setItem(SESS_KEY, JSON.stringify({ s: d.sessao, e: d.email, x: d.expira_em })); } catch (e) {}
    await abrirOrcamento(true);
  } catch (e) { telaCodigo('Erro de conexão. Tente novamente.'); }
}
function aplicarMarca() {
  const cut = (x, n) => { x = String(x || ''); return x.length > n ? x.slice(0, n - 1) + '…' : x; };
  const t1 = esc(cut('BOXER · ' + (ORC.codigo || '') + ' · ' + (ORC.cliente_nome || ''), 44)), t2 = esc(cut('Acesso de ' + VISUALIZADOR + ' · válido até ' + fmtData(ORC.validade_em), 60));
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380"><g transform="rotate(-26 380 190)" fill="#1d327b" fill-opacity="0.10" font-family="Arial,sans-serif" font-weight="700" text-anchor="middle"><text x="380" y="180" font-size="20">' + t1 + '</text><text x="380" y="208" font-size="13">' + t2 + '</text></g></svg>';

}

// ---- protecao de leitura: sem imprimir/PDF, sem copiar/selecionar, conteudo some sem foco (print de tela nao tem como impedir; a marca d'agua rastreia) ----
let _protegido = false;
function protegerLeitura(alvos, frame) {
  if (_protegido) return; _protegido = true;
  document.body.classList.add('noc');
  const permitido = e => { const t = e.target && e.target.tagName; return t === 'INPUT' || t === 'TEXTAREA'; };
  const bloqueia = e => { if (permitido(e)) return; e.preventDefault(); return false; };
  const teclas = e => {
    const k = (e.key || '').toLowerCase();
    if (k === 'printscreen') { try { navigator.clipboard && navigator.clipboard.writeText(''); } catch (x) {} ocultar(true); setTimeout(checarFoco, 1800); e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && ['p', 's', 'u'].indexOf(k) >= 0) { e.preventDefault(); e.stopPropagation(); return false; }
    if ((e.ctrlKey || e.metaKey) && ['c', 'a', 'x'].indexOf(k) >= 0 && !permitido(e)) { e.preventDefault(); e.stopPropagation(); return false; }
    if (k === 'f12' || (e.ctrlKey && e.shiftKey && ['i', 'j', 'c', 's'].indexOf(k) >= 0)) { e.preventDefault(); return false; }
    if (e.metaKey && e.shiftKey && ['3', '4', '5'].indexOf(k) >= 0) { ocultar(true); setTimeout(checarFoco, 1800); }
  };
  const ligar = d => { ['copy', 'cut', 'contextmenu', 'dragstart', 'selectstart'].forEach(ev => d.addEventListener(ev, bloqueia, true)); d.addEventListener('keydown', teclas, true); };
  const ocultar = v => document.body.classList.toggle('oculto', v);
  const checarFoco = () => ocultar(document.hidden || !document.hasFocus());
  ligar(document);
  window.addEventListener('blur', () => setTimeout(checarFoco, 80));
  window.addEventListener('focus', checarFoco);
  document.addEventListener('visibilitychange', checarFoco);
  window.__ligarProtecao = ligar;
  checarFoco();
}

async function abrirOrcamento(contar) {
  try {
    ORC = await rpc('buscar_orcamento_publico_v2', { p_token: token, p_sessao: SESSAO, p_ua: navigator.userAgent, p_contar: contar !== false });
  } catch (e) {
    document.getElementById('corpo').innerHTML = '<div class="empty"><h3>Não foi possível abrir o orçamento</h3></div>';
    return false;
  }
  if (ORC.sessao === false) { limparSessao(); telaEmail('Sua sessão terminou. Confirme o e-mail para abrir de novo.'); return false; }
  if (!ORC.encontrado) {
    document.getElementById('corpo').innerHTML = '<div class="empty"><h3>Orçamento não encontrado</h3></div>';
    return false;
  }
  VISUALIZADOR = ORC.visualizador || EMAIL_GATE;
  render();
  aplicarMarca();
  if (!document.querySelector('.avoc')) { const av = document.createElement('div'); av.className = 'avoc'; av.textContent = 'Conteúdo oculto enquanto esta janela não estiver em foco.'; document.body.appendChild(av); }
  protegerLeitura();
  return true;
}

(async () => {
  if (!token || !/^[0-9a-f-]{36}$/i.test(token)) {
    document.getElementById('corpo').innerHTML = '<div class="empty"><h3>Link inválido</h3></div>';
    return;
  }
  // 2026-11-24, pedido explicito do Andre: "o cliente tem que receber link,
  // clicar e ja acessar" -- o gate de e-mail+codigo travava o acesso real no
  // primeiro clique. SESSAO so e lida se sobrar de antes (sem quebrar quem
  // ja tinha passado pelo gate); sem ela, abre direto -- o backend
  // (buscar_orcamento_publico_v2) ja aceita p_sessao nulo.
  SESSAO = lerSessao();
  await abrirOrcamento(true);
})();

function render() {
  document.getElementById('topCodigo').textContent = ORC.codigo;
  const wrap = document.getElementById('corpo');

  if (ORC.status === 'cancelado') {
    wrap.innerHTML = '<div class="card empty"><h3>Orçamento cancelado</h3><p style="margin-top:8px;font-size:13px">Fale com ' + esc(ORC.vendedor_nome || 'seu representante') + ' para gerar um novo.</p></div>';
    return;
  }

  const aceito = ORC.status === 'aceito_cliente' || ORC.status === 'aprovado';
  const chipValidade = ORC.expirado
    ? '<span class="chip verm">Expirado em ' + fmtData(ORC.validade_em) + '</span>'
    : '<span class="chip' + (new Date(ORC.validade_em) - Date.now() < 2 * 86400000 ? ' laranja' : '') + '">Válido até ' + fmtData(ORC.validade_em) + '</span>';

  const itens = ORC.itens || [];
  const ESTOQUE = { ok: ['Disponível', 'ok'], prev: ['Previsão de chegada', 'prev'], sem: ['Sem previsão', 'sem'], sem_info: ['A confirmar', 'info'] };

  const grupos = { ok: { valor: 0, qtd: 0 }, prev: { valor: 0, qtd: 0 }, sem: { valor: 0, qtd: 0 } };
  itens.forEach(i => { if (grupos[i.estoque]) { grupos[i.estoque].valor += i.subtotal; grupos[i.estoque].qtd += i.qtd; } });
  const GRUPO_LABEL = { ok: 'Itens disponíveis', prev: 'Itens com previsão de chegada', sem: 'Itens sem previsão' };

  wrap.innerHTML = `
    ${aceito ? `<div class="aceito-faixa">${ORC.status === 'aprovado' ? '✓ Pedido confirmado pela Boxer' : '✓ Você aceitou este orçamento — aguardando confirmação da Boxer'}${ORC.aceito_em ? ' em ' + fmtDataHora(ORC.aceito_em) : ''}</div>` : ''}
    <div class="card hero">
      <h1>Orçamento para ${esc(ORC.cliente_fantasia || ORC.cliente_nome)}</h1>
      ${chipValidade} <span class="chip">Emitido em ${fmtData(ORC.criado_em)}</span>
    </div>

    <div class="card itens">
      <div class="sec-title">Itens do orçamento</div>
      <table>
        <thead><tr><th>Produto</th><th>Estoque</th><th>Qtd</th><th>Impostos</th><th>Unitário</th><th>Total</th></tr></thead>
        <tbody>${itens.map(i => {
          const [label, cls] = ESTOQUE[i.estoque] || ESTOQUE.sem_info;
          const riscado = i.unit_tabela > 0 && Math.abs(i.unit_tabela - i.unit) > 0.01
            ? `<div style="font-size:11px;color:#a0aec0;text-decoration:line-through">${fmtMoeda(i.unit_tabela)}</div>` : '';
          return `<tr>
            <td data-l="Produto"><span class="prod-cel">${i.imagem_url ? '<span class="prod-foto"><img src="' + esc(i.imagem_url) + '" alt="" loading="lazy" onerror="this.parentElement.remove()"></span>' : ''}<span><div>${esc(i.modelo || i.codigo)}</div><div style="font-size:10px;color:#a0aec0">${esc(i.codigo)}</div></span></span></td>
            <td data-l="Estoque"><span class="est ${cls}">${label}${i.previsao ? ' · ' + fmtPrevisaoQuinzena(i.previsao) : ''}</span></td>
            <td data-l="Qtd">${i.qtd}</td>
            <td data-l="Impostos" style="font-size:11px;color:#718096">IPI ${i.ipi != null ? i.ipi + '%' : '—'}<span class="so-print"> · </span><br class="so-tela">ICMS ${i.icms != null ? i.icms + '%' : '—'}</td>
            <td data-l="Unitário">${riscado}${fmtMoeda(i.unit)}</td>
            <td data-l="Total">${fmtMoeda(i.subtotal)}</td>
          </tr>`;
        }).join('')}</tbody>
        <tfoot>
          ${['ok', 'prev', 'sem'].map(k => grupos[k].valor > 0.004 ? `<tr class="tfoot-grupo"><td colspan="5">${GRUPO_LABEL[k]} <span class="tfoot-qtd">(${grupos[k].qtd} un)</span></td><td>${fmtMoeda(grupos[k].valor)}</td></tr>` : '').join('')}
          ${ORC.frete_valor > 0 ? `<tr class="tfoot-grupo"><td colspan="5">Frete (a cobrar pela Boxer — fora do total)</td><td>${fmtMoeda(ORC.frete_valor)}</td></tr>` : ''}
          <tr class="tfoot-total"><td colspan="5">Total geral</td><td>${fmtMoeda(ORC.total_final)}</td></tr>
        </tfoot>
      </table>
    </div>

    <div class="card keep">
      <div class="sec-title">Condições</div>
      <div class="cond-grid">
        <div class="cond-item"><b>Pagamento</b><span>${ORC.pagamento_tipo === 'avista' ? 'À vista' + (ORC.desconto_vista_pct ? ' (' + ORC.desconto_vista_pct + '% de desconto)' : '') : (Array.isArray(ORC.dias_pagamento) && ORC.dias_pagamento.length ? 'Boleto ' + ORC.dias_pagamento.join('/') + ' dias' : 'Boleto em ' + ORC.parcelas + 'x')}</span></div>
        <div class="cond-item"><b>Frete</b><span>${FRETE_LABELS[ORC.frete_tipo] || 'A combinar'}</span></div>
        <div class="cond-item"><b>Entrega</b><span>Sujeita à disponibilidade</span></div>
      </div>
    </div>

    ${ORC.observacoes ? `<div class="card keep"><div class="sec-title">Observações</div><p style="font-size:13px;color:#4a5568">${esc(ORC.observacoes)}</p></div>` : ''}

    <div class="card keep">
      <div class="sec-title">Dados</div>
      <div class="dados-grid">
        <div class="dados-bloco">
          <div class="t">Cliente</div>
          <div class="nome">${esc(ORC.cliente_fantasia || ORC.cliente_nome)}</div>
          ${ORC.cliente_fantasia && ORC.cliente_fantasia !== ORC.cliente_nome ? `<div class="linha">${esc(ORC.cliente_nome)}</div>` : ''}
          <div class="linha">${fmtCnpj(ORC.cliente_cnpj)}</div>
          ${ORC.cliente_endereco ? `<div class="linha">${esc(ORC.cliente_endereco)}</div>` : ''}
          ${ORC.cliente_cidade || ORC.cliente_uf ? `<div class="linha">${esc(ORC.cliente_cidade || '')}${ORC.cliente_uf ? '/' + esc(ORC.cliente_uf) : ''}</div>` : ''}
          ${ORC.cliente_contato ? `<div class="linha">A/C ${esc(ORC.cliente_contato)}</div>` : ''}
        </div>
        <div class="dados-bloco">
          <div class="t">Enviado por</div>
          ${ORC.vendedor_empresa ? `<div class="nome">${esc(ORC.vendedor_empresa)}</div>` : ''}
          <div class="${ORC.vendedor_empresa ? 'linha' : 'nome'}">${esc(ORC.vendedor_nome || 'Representante Boxer')}</div>
          ${ORC.vendedor_email ? `<div class="linha">${esc(ORC.vendedor_email)}</div>` : ''}
          ${ORC.vendedor_telefone ? `<div class="linha">${esc(fmtTel(ORC.vendedor_telefone))}</div>` : ''}
        </div>
        <div class="dados-bloco">
          <div class="t">Boxer Soldas</div>
          <div class="nome">Tekweld Importação e Comércio de Máquinas Industriais Ltda</div>
          <div class="linha">CNPJ 13.881.630/0001-64</div>
          <div class="linha">Rua Alvino Cristo, 36 · Parque Industrial Experts</div>
          <div class="linha">Nova Odessa/SP · CEP 13387-793</div>
        </div>
      </div>
    </div>

    ${!aceito && !ORC.expirado ? `<div class="recusar" onclick="abrirRecusa()">Não tenho interesse neste orçamento</div>` : ''}
  `;

  const cta = document.createElement('div');
  cta.className = 'cta';
  cta.innerHTML = `
    <div class="cta-total">${fmtMoeda(ORC.total_final)}</div>
    ${ORC.vendedor_telefone ? `<a class="btn btn-outline" href="https://wa.me/55${ORC.vendedor_telefone.replace(/\D/g,'')}" target="_blank" rel="noopener">Falar com ${esc((ORC.vendedor_nome || '').split(' ')[0] || 'vendedor')}</a>` : ''}
    ${!aceito && !ORC.expirado ? `<button class="btn btn-primary" onclick="abrirAceite()">Aceitar orçamento</button>` : ''}
  `;
  document.body.appendChild(cta);
}

function abrirAceite() {
  abrirModal(`
    <h3>Aceitar orçamento ${esc(ORC.codigo)}</h3>
    <p style="font-size:13px;color:#4a5568;margin-bottom:14px">Valor total: <strong>${fmtMoeda(ORC.total_final)}</strong></p>
    <div id="aceiteErro" class="field-err"></div>
    <div class="field"><label>Seu nome completo</label><input id="aceiteNome" type="text" placeholder="Nome de quem está aceitando"></div>
    <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;color:#4a5568;margin-bottom:16px">
      <input type="checkbox" id="aceiteConcordo" style="margin-top:2px">
      <span>Confirmo que revisei os itens, preços e condições acima e aceito este orçamento.</span>
    </label>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="fecharModal()">Voltar</button>
      <button class="btn btn-primary" id="btnConfirmarAceite" onclick="confirmarAceite()">Aceitar orçamento</button>
    </div>
  `);
}

// Erro de validacao/rede fica dentro do proprio modal (texto inline) em vez
// de alert() nativo -- achado em auditoria de UX (2026-11-04): essa e a
// tela mais exposta a alguem de fora da Boxer, e a caixa cinza do navegador
// quebrava a experiencia bem no momento de aceitar dinheiro.
function mostrarErroModal(id, msg) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
}

async function confirmarAceite() {
  const nome = document.getElementById('aceiteNome').value.trim();
  const concordo = document.getElementById('aceiteConcordo').checked;
  document.getElementById('aceiteErro').classList.remove('show');
  if (!nome) { mostrarErroModal('aceiteErro', 'Informe seu nome.'); return; }
  if (!concordo) { mostrarErroModal('aceiteErro', 'Confirme que revisou o orçamento.'); return; }
  const btn = document.getElementById('btnConfirmarAceite');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const ac = await rpc('aceitar_orcamento_publico_v2', { p_token: token, p_nome: nome, p_sessao: SESSAO, p_ua: navigator.userAgent });
    if (ac && ac.motivo === 'sessao') { fecharModal(); limparSessao(); telaEmail('Sua sessão terminou. Confirme o e-mail para continuar.'); return; }
    fecharModal();
    await abrirOrcamento(false);
    avisarRepresentante();
  } catch (e) {
    mostrarErroModal('aceiteErro', 'Não foi possível registrar o aceite. Tente novamente.');
    btn.disabled = false; btn.textContent = 'Aceitar orçamento';
  }
}

function abrirRecusa() {
  abrirModal(`
    <h3>Recusar orçamento ${esc(ORC.codigo)}</h3>
    <div id="recusaErro" class="field-err"></div>
    <div class="field"><label>Motivo (opcional)</label><textarea id="recusaMotivo" rows="3" placeholder="Ajuda seu representante a entender o que faltou"></textarea></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="fecharModal()">Voltar</button>
      <button class="btn btn-primary" id="btnConfirmarRecusa" onclick="confirmarRecusa()">Recusar orçamento</button>
    </div>
  `);
}

async function confirmarRecusa() {
  const motivo = document.getElementById('recusaMotivo').value.trim();
  const btn = document.getElementById('btnConfirmarRecusa');
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const rc = await rpc('recusar_orcamento_publico_v2', { p_token: token, p_motivo: motivo || null, p_sessao: SESSAO, p_ua: navigator.userAgent });
    if (rc && rc.motivo === 'sessao') { fecharModal(); limparSessao(); telaEmail('Sua sessão terminou. Confirme o e-mail para continuar.'); return; }
    fecharModal();
    await abrirOrcamento(false);
    avisarRepresentante();
  } catch (e) {
    mostrarErroModal('recusaErro', 'Não foi possível registrar. Tente novamente.');
    btn.disabled = false; btn.textContent = 'Recusar orçamento';
  }
}

// Fire-and-forget: avisa o representante (e-mail) que o cliente respondeu.
// Erro aqui nunca deve incomodar o cliente -- o aceite/recusa ja foi
// gravado de verdade no passo anterior.
function avisarRepresentante() {
  fetch(HUB_API, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ acao: 'avisar', token })
  }).catch(() => {});
}
</script>
