<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pedidos — Boxer Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fs-h1:18px;--fs-h2:16px;--fs-body:13px;--fs-label:11px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;color:#1a202c}
:focus-visible{outline:2px solid #25bbee;outline-offset:1px}
.topbar{background:linear-gradient(135deg,#1d327b,#162666);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #25bbee}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{color:#fff;font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:16px}
.user-badge{color:#93b4d4;font-size:13px}.user-badge strong{color:#fff}
.logout-btn{color:#93b4d4;font-size:13px;padding:6px 12px;border:1px solid rgba(255,255,255,.2);border-radius:6px;cursor:pointer}
.logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.notif-badge{background:#e30613;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;cursor:pointer}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-family:Outfit;font-size:13px;font-weight:500;z-index:2000;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:#16a34a}.toast-error{background:#dc2626}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}

.tabs{display:flex;gap:4px;padding:16px 24px 0;max-width:1400px;margin:0 auto}
.tab{padding:10px 20px;border-radius:8px 8px 0 0;border:1px solid #d0d8e8;border-bottom:none;background:#fff;color:#4a5568;cursor:pointer;font-family:Outfit;font-size:14px;font-weight:500}
.tab:hover{color:#1d327b}
.tab.active{background:#1d327b;color:#fff;border-color:#1d327b}
.panel{max-width:1400px;margin:0 auto;padding:0 24px 24px}
.panel-content{background:#fff;border:1px solid #d0d8e8;border-radius:0 8px 8px 8px;padding:20px}
.hidden{display:none!important}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 12px;text-align:left;color:#718096;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;background:#f7fafc}
tbody td{padding:8px 12px;border-bottom:1px solid #e2e8f0;vertical-align:middle}
tbody tr:hover{background:#f0f7ff}

.btn{padding:8px 16px;border-radius:8px;border:1px solid;font-family:Outfit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#1d327b;color:#fff;border-color:#1d327b}.btn-primary:hover{background:#162666}
.btn-danger{background:#fff;color:#e30613;border-color:#fecaca}.btn-danger:hover{background:#fee2e2}
.btn-outline{background:#fff;color:#4a5568;border-color:#c3cfe2}.btn-outline:hover{border-color:#25bbee;color:#1d327b}
.btn-warn{background:#f59e0b;color:#fff;border-color:#f59e0b}.btn-warn:hover{background:#d97706}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cart-bloqueio{margin-top:16px;padding:14px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b}
.cart-bloqueio strong{display:block;font-size:14px;margin-bottom:4px}
.cart-bloqueio p{font-size:13px;margin-bottom:8px;color:#7f1d1d}
.cart-bloqueio ul{margin:0;padding-left:18px;font-size:13px}
.cart-bloqueio li{margin-bottom:4px}
.cart-bloqueio hr{border:none;border-top:1px solid #fecaca;margin:12px 0}
.cart-bloqueio p:last-child{margin-bottom:0}
/* Confirmacao do pedido */
.rev-sec{margin-bottom:18px}
.rev-sec h4{font-size:12px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.rev-linha{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #edf2f7}
.rev-linha:last-child{border-bottom:none}
.rev-linha .v{font-weight:600;font-variant-numeric:tabular-nums}
.rev-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:2px solid #e2e8f0}
.rev-total .v{font-size:19px;font-weight:700;color:#1d327b;font-variant-numeric:tabular-nums}
.rev-credito{padding:12px 14px;border-radius:8px;border:1px solid #d0d8e8;background:#f7fafc}
.rev-credito.ok{border-color:#bbf7d0;background:#f0fdf4}
.rev-credito.ruim{border-color:#fecaca;background:#fef2f2}
.rev-credito .saldo{font-size:13px;font-weight:600;margin-top:6px;padding-top:6px;border-top:1px dashed #cbd5e0}
.rev-credito.ok .saldo{color:#166534}
.rev-credito.ruim .saldo{color:#991b1b}
.rev-frete{padding:12px 14px;border-radius:8px;border:1px solid #d0d8e8;background:#f7fafc;font-size:13px;color:#4a5568}
.rev-opcoes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rev-opcao{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid #c3cfe2;border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
.rev-opcao:hover{border-color:#25bbee}
.rev-opcao input{margin-top:2px}
.rev-opcao strong{display:block}
.rev-opcao span{color:#718096;font-size:12px}
textarea{font-family:Outfit;font-size:13px;padding:8px 12px;border:1px solid #c3cfe2;border-radius:6px;outline:none;width:100%;resize:vertical;min-height:64px}
textarea:focus{border-color:#25bbee}
.btn-sm{padding:4px 10px;font-size:12px}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:12px;font-weight:500;color:#4a5568;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-row input,.form-row select{width:100%;font-family:Outfit;font-size:13px;padding:8px 12px;border:1px solid #c3cfe2;border-radius:6px;outline:none}
.form-row input:focus,.form-row select:focus{border-color:#25bbee}
.form-row-inline{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0;flex-wrap:wrap}
.cart-pedido-sec{margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0}
.cart-preco-hint{font-size:11px;color:#718096;margin-bottom:10px}

.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.status-rascunho{background:#e2e8f0;color:#4a5568}
.status-submetido{background:#dbeafe;color:#1e40af}
.status-em_analise{background:#fef3c7;color:#92400e}
.status-aprovado{background:#d1fae5;color:#065f46}
.status-rejeitado{background:#fee2e2;color:#991b1b}
.status-em_separacao{background:#e0e7ff;color:#3730a3}
.status-faturado{background:#cffafe;color:#155e75}
.status-enviado{background:#ddd6fe;color:#5b21b6}
.status-entregue{background:#d1fae5;color:#065f46}
.status-cancelado{background:#f3f4f6;color:#6b7280}
.orc-st-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;background:#e2e8f0;color:#4a5568}
.orc-st-badge.verde{background:#dcfce7;color:#166534}
.orc-st-badge.azul{background:#dbeafe;color:#1e40af}
.orc-st-badge.laranja{background:#ffedd5;color:#9a3412}
.orc-st-badge.verm{background:#fee2e2;color:#991b1b}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:16px;font-weight:600;color:#1d327b}
.empty-state{text-align:center;padding:40px 20px;color:#718096}

.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8f0}
.cart-item:last-child{border-bottom:none}
.cart-item-info{flex:1;min-width:0}
.cart-item-sku{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.5px}
.cart-item-nome{font-size:13px;font-weight:600;color:#1a202c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-preco{font-size:12px;color:#718096}
.cart-item-qty{display:flex;align-items:center;gap:4px}
.cart-item-qty label{font-size:10px;color:#718096;font-weight:500}
.cart-item-qty input{width:52px;padding:6px;border:1px solid #d0d8e8;border-radius:6px;text-align:center;font-family:Outfit;font-size:13px}
.cart-item-subtotal{font-size:14px;font-weight:700;color:#1d327b;min-width:80px;text-align:right}
.cart-item-remove{background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;padding:4px 8px}
.cart-item-remove:hover{background:#fef2f2;border-radius:4px}
.cart-summary{display:flex;align-items:center;justify-content:space-between;padding:16px 0;margin-top:8px;border-top:2px solid #1d327b}
.cart-total-label{font-size:14px;color:#4a5568;font-weight:500}
.cart-total-valor{font-size:22px;font-weight:700;color:#1d327b}
.cart-total-nota{font-size:10px;color:#718096;display:block}
.cart-actions{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #e2e8f0;box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:12px 24px;display:flex;align-items:center;gap:14px;z-index:40}
.cart-actions-total{flex:1;min-width:0}
.cart-actions-total b{font-size:18px;color:#1d327b;display:block;line-height:1.2}
.cart-actions-total span{font-size:11px;color:#718096}
.cart-actions-botoes{display:flex;gap:8px;flex-wrap:wrap}
#carrinhoWrap{padding-bottom:76px}
.cart-tab-badge{background:#e30613;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:5px}
.cart-item-stock{font-size:10px;font-weight:600;display:flex;align-items:center;gap:3px;margin-top:2px}
.cart-item-stock .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.s-ok{color:#16a34a}.s-ok .dot{background:#16a34a}
.s-low{color:#f59e0b}.s-low .dot{background:#f59e0b}
.s-bo{color:#718096}.s-bo .dot{background:#718096}
.s-no{color:#dc2626}.s-no .dot{background:#dc2626}
.s-prev{color:#1d4ed8}.s-prev .dot{background:#1d4ed8}
</style>

<body>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('lista',this)">Meus Pedidos</div>
  <div class="tab" onclick="showTab('novo',this)">Novo Pedido</div>
</div>
<div class="panel">
  <div class="panel-content" id="tab-lista">
    <div class="page-header">
      <h2 class="page-title">Historico de Pedidos</h2>
      <select id="filtroStatus" onchange="loadPedidos()" style="padding:6px 10px;border:1px solid #c3cfe2;border-radius:6px;font-family:Outfit;font-size:12px">
        <option value="">Todos os status</option>
        <option value="rascunho">Rascunho</option>
        <option value="submetido">Submetido</option>
        <option value="em_analise">Em analise</option>
        <option value="aprovado">Aprovado</option>
        <option value="faturado">Faturado</option>
        <option value="enviado">Enviado</option>
        <option value="entregue">Entregue</option>
      </select>
    </div>
    <div style="margin-bottom:14px">
      <input id="filtroPedidoBusca" oninput="renderPedidosFiltrados()" placeholder="Buscar por numero, OC, numero do pedido no ZEN ou cliente" style="width:100%;padding:8px 12px;border:1px solid #c3cfe2;border-radius:6px;font-family:Outfit;font-size:13px">
    </div>
    <div id="pedidosList"></div>
  </div>
  <div class="panel-content hidden" id="tab-novo">
    <div class="page-header">
      <h2 class="page-title">Novo Pedido</h2>
      <a href="catalogo.html" class="btn btn-outline btn-sm">+ Adicionar produtos</a>
    </div>
    <div id="carrinhoWrap"></div>
  </div>
</div>

<script src="hub.js"></script>
<script>
if (!requireAuth()) throw 'auth';

function showTab(n, el) {
  document.querySelectorAll('.panel-content').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + n).classList.remove('hidden');
  el.classList.add('active');
  // O rodape fixo do carrinho (#cartActionsBar) nao pertence a nenhuma aba --
  // some quando sai de "Novo Pedido" para nao sobrepor "Meus Pedidos".
  const bar = document.getElementById('cartActionsBar');
  if (bar) bar.style.display = n === 'novo' ? '' : 'none';
}

(async () => {
  await loadPerfil();
  renderTopbar('Pedidos');
  await loadPedidos();
  renderCarrinho();
  const cart = getCart();
  if (cart.length > 0) {
    showTab('novo', document.querySelectorAll('.tab')[1]);
  }
})();

// === CARRINHO ===

function getCart() {
  try { return JSON.parse(sessionStorage.getItem(cartKey()) || '[]'); } catch { return []; }
}

function saveCart(cart) {
  sessionStorage.setItem(cartKey(), JSON.stringify(cart));
  stockMap = {};
  // O cliente mexeu no carrinho: as violacoes da tentativa anterior podem nao
  // valer mais. Some com elas em vez de deixar alerta velho na tela.
  ultimasViolacoes = [];
  renderCarrinho();
}

let stockMap = {};
// Hoisted pra fora de renderCarrinho (era local ali) -- enviarOrcamento
// tambem precisa, pra mandar a disponibilidade real de cada item (sem isso
// o orcamento publico sempre mostrava "A confirmar", nunca a previsao de
// verdade -- bug visto ao vivo em teste, 2026-11-03).
let prevMap = {};

// Mesma logica de badgeEstoque em renderCarrinho, mas devolvendo o par
// {disp, previsao} no formato que api/_orcamento.js espera por item
// ('ok'|'prev'|'sem'|'sem_info', data ISO opcional).
function dispDoItem(item) {
  const prev = prevMap[item.sku];
  if (prev) return prev.iso ? { disp: 'prev', previsao: prev.iso } : { disp: 'sem', previsao: null };
  const st = stockMap[item.produto_id];
  if (st) {
    const info = stockLabel(st, item.quantidade);
    if (info.cls === 's-ok' || info.cls === 's-low') return { disp: 'ok', previsao: null };
    if (info.cls === 's-bo') return { disp: 'sem', previsao: null };
    if (info.cls === 's-no') return { disp: 'sem', previsao: null };
  }
  return { disp: 'sem_info', previsao: null };
}

// === PEDIDO EM EDICAO ===
// Todo envio criava um hub_pedidos novo, sempre. Consequencia: (a) reabrir um
// pedido e reenviar deixava o rascunho reaberto para tras e criava uma copia;
// (b) cada submissao que falhava na politica largava mais um rascunho orfao
// (havia 8 presos no banco). Guardando qual rascunho esta em edicao, o envio
// REUSA essa linha em vez de criar outra.
// === DETALHES DO PEDIDO (pagamento/OC/observacoes) ===
// Pedido do Andre em teste ao vivo (2026-11-03): esses campos viviam so
// dentro do modal de revisao, exigindo clicar "Revisar pedido" pra aparecer.
// Agora moram na propria tela do carrinho; persistidos em sessionStorage
// porque renderCarrinho() recria o HTML inteiro a cada mudanca de
// quantidade/preco (senao o texto digitado sumiria no proximo re-render).
function contextoAtivoSufixo() {
  const prospect = getProspectAtivo();
  return getClienteAtivo() || (prospect ? 'prospect_' + prospect.cnpj : 'self');
}
function detalhesKey() { return 'hub_pedido_detalhes_' + getUserId() + '_' + contextoAtivoSufixo(); }
function getDetalhesPedido() { try { return JSON.parse(sessionStorage.getItem(detalhesKey()) || '{}'); } catch { return {}; } }
function salvarDetalhesPedido(patch) {
  sessionStorage.setItem(detalhesKey(), JSON.stringify(Object.assign(getDetalhesPedido(), patch)));
}

// Cartao: 1 a 10x sem juros. Boleto/duplicata: ate 3x (28/56/84 dias).
// PIX e transferencia: a vista. Espelha hub_politica_parametros -- quem decide
// de verdade continua sendo hub_fn_validar_politica no envio.
function atualizarParcelasCarrinho() {
  const forma = document.getElementById('cartPagamento')?.value;
  const sel = document.getElementById('cartParcelas');
  if (!sel) return;
  const max = forma === 'cartao_credito' ? 10 : forma === 'boleto' ? 3 : 1;
  const salvas = Math.min(getDetalhesPedido().parcelas || 1, max);
  sel.innerHTML = Array.from({ length: max }, (_, i) =>
    `<option value="${i + 1}" ${salvas === i + 1 ? 'selected' : ''}>${i + 1}x${max > 1 ? ' sem juros' : ' (a vista)'}</option>`).join('');
  sel.disabled = max === 1;
  if (max === 1) salvarDetalhesPedido({ parcelas: 1 });
}

// Preco editavel direto no item do carrinho -- mesmo padrao do
// tabela-teste.html (orcEditarPreco/orcRestaurarPreco), so que agora visivel
// na tela principal (antes vivia escondido dentro da revisao do orcamento,
// achado pelo Andre em teste ao vivo). So quem pode enviar orcamento ve isso
// (podeEnviarOrcamento) -- o pedido real do proprio dealer sempre usa o
// preco de verdade calculado pelo servidor, nunca o editado aqui.
function editarPrecoCarrinho(idx) {
  const el = document.getElementById('cartPreco_' + idx);
  if (!el) return;
  const cart = getCart();
  const item = cart[idx];
  if (!item) return;
  const atual = item.precoManual != null ? item.precoManual : parseFloat(el.dataset.base) || 0;
  el.outerHTML = `<input id="cartPreco_${idx}" class="cart-preco-in" inputmode="decimal" value="${String(atual.toFixed(2)).replace('.', ',')}"
    style="width:90px;text-align:right;padding:4px 6px;font-size:13px;border:1px solid #c3cfe2;border-radius:6px"
    onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){this.dataset.x=1;this.blur();}"
    onblur="confirmarPrecoCarrinho(${idx}, this)">`;
  const input = document.getElementById('cartPreco_' + idx);
  input.focus(); input.select();
}

function confirmarPrecoCarrinho(idx, el) {
  if (el.dataset.x) { renderCarrinho(); return; } // Esc: descarta, so re-renderiza
  const n = parseFloat(el.value.replace(/\./g, '').replace(',', '.'));
  const base = parseFloat(el.dataset.base) || 0;
  const cart = getCart();
  const item = cart[idx];
  if (!item) return;
  if (!(n > 0) || Math.abs(n - base) < 0.005) delete item.precoManual; else item.precoManual = n;
  saveCart(cart);
}

function restaurarPrecoCarrinho(idx) {
  const cart = getCart();
  if (cart[idx]) { delete cart[idx].precoManual; saveCart(cart); }
}

function pedidoEdicaoKey() { return 'hub_pedido_edicao_' + getUserId() + '_' + (getClienteAtivo() || 'self'); }
function getPedidoEmEdicao() { return sessionStorage.getItem(pedidoEdicaoKey()) || null; }
function setPedidoEmEdicao(id) { sessionStorage.setItem(pedidoEdicaoKey(), id); }
function clearPedidoEmEdicao() { sessionStorage.removeItem(pedidoEdicaoKey()); }

// Violacoes devolvidas pelo servidor na ultima tentativa de envio. Ficam na
// tela ate o carrinho mudar -- um toast de 3 segundos some antes de o cliente
// terminar de ler, ainda mais numa lista de itens.
let ultimasViolacoes = [];

// Preco do carrinho vem da base mestre, na faixa correta.
// A faixa (classe) do Varejo/Fisica depende do valor do pedido, entao e preciso
// primeiro somar o carrinho a PRECO DE TABELA e so depois pedir os precos
// naquela faixa — mesma ordem que o servidor usa em hub_fn_submeter_pedido.
// Medir na tabela, e nao no preco ja descontado, evita a circularidade de o
// desconto baixar o valor e o valor rebaixar a faixa.
// Le o ajuste de politica comercial feito em catalogo.html (UF/Segmento/
// Classe), que e salvo com o id da revenda OU o cnpj do prospect -- so
// devolve se bater com quem esta ativo agora.
function lerOverridePolitica() {
  try {
    const salvo = JSON.parse(localStorage.getItem('hub_override_politica') || 'null');
    if (!salvo) return null;
    const clienteId = getClienteAtivo();
    const prospect = getProspectAtivo();
    if (clienteId && salvo.clienteId === clienteId) return salvo;
    if (prospect && salvo.prospectCnpj === prospect.cnpj) return salvo;
    return null;
  } catch { return null; }
}

async function carregarPrecosCarrinho(cart) {
  const clienteId = getClienteAtivo();
  const prospect = getProspectAtivo();
  if (!cart.length || (!clienteId && !prospect)) return {};

  // CNPJ novo (prospect) nao tem politica comercial cadastrada -- o preco so
  // existe se o representante escolheu UF/Segmento/Classe no catalogo
  // (restaurarAjustePolitica ja semeia um padrao na primeira vez).
  if (prospect && !clienteId) {
    const override = lerOverridePolitica();
    if (!override) return {};
    try {
      const linhas = await sbRpc('hub_fn_precos_parametro', { p_uf: override.uf, p_segmento: override.segmento, p_classe: override.classe });
      const out = {};
      linhas.forEach(l => { out[l.produto_id] = l; });
      return out;
    } catch (e) {
      console.error('[preco] falha ao recalcular carrinho (prospect):', e);
      return {};
    }
  }

  try {
    const base = await sbRpc('hub_fn_precos_cliente', { p_cliente_id: clienteId, p_valor_pedido: 0 });
    const porId = {};
    base.forEach(l => { porId[l.produto_id] = l; });

    const subtotalTabela = cart.reduce(
      (s, i) => s + (+(porId[i.produto_id]?.preco_tabela || 0) * i.quantidade), 0);

    const finais = await sbRpc('hub_fn_precos_cliente', {
      p_cliente_id: clienteId, p_valor_pedido: subtotalTabela
    });
    const out = {};
    finais.forEach(l => { out[l.produto_id] = l; });
    return out;
  } catch (e) {
    console.error('[preco] falha ao recalcular carrinho:', e);
    return {};
  }
}

async function renderCarrinho() {
  const wrap = document.getElementById('carrinhoWrap');
  const cart = getCart();
  const tabNovo = document.querySelectorAll('.tab')[1];
  const totalQty = cart.reduce((s, i) => s + i.quantidade, 0);

  if (cart.length > 0) {
    tabNovo.innerHTML = 'Novo Pedido <span class="cart-tab-badge">' + totalQty + '</span>';
  } else {
    tabNovo.textContent = 'Novo Pedido';
  }

  if (!cart.length) {
    wrap.innerHTML = '<div class="empty-state"><h3>Carrinho vazio</h3><p>Adicione produtos pelo <a href="catalogo.html" style="color:#1d327b">catalogo</a>.</p></div>';
    document.getElementById('cartActionsBar')?.remove();
    return;
  }

  if (!Object.keys(stockMap).length) {
    try {
      const ids = cart.map(c => c.produto_id).join(',');
      const prods = await sb('/hub_v_catalogo?produto_id=in.(' + ids + ')&select=produto_id,status_estoque,backorder_disponivel,estoque_disponivel');
      prods.forEach(p => { stockMap[p.produto_id] = p; });
    } catch {}
  }

  prevMap = {};
  try {
    await fetchDisponibilidadeEstoque(); // aquece o cache uma unica vez
    await Promise.all(cart.map(async item => {
      const estoqueAtual = stockMap[item.produto_id]?.estoque_disponivel;
      const prev = await fetchDisponibilidadePrevistaSku(item.sku, item.quantidade, estoqueAtual);
      if (prev) prevMap[item.sku] = prev;
    }));
  } catch {}

  const precos = await carregarPrecosCarrinho(cart);
  // precoBaseDe e o que o servidor calculou (preco_final da politica comercial
  // da revenda); precoDe aplica por cima o ajuste manual do item, quando
  // existe -- igual tabela-teste.html, mas agora direto na tela do carrinho
  // (antes vivia escondido dentro da revisao, achado pelo Andre em teste).
  const precoBaseDe = item => +(precos[item.produto_id]?.preco_final ?? item.preco_base ?? 0);
  const precoDe = item => item.precoManual != null ? item.precoManual : precoBaseDe(item);
  // hub_fn_precos_cliente devolve segmento/uf/classe na propria linha;
  // hub_fn_precos_parametro (usado pra prospect/simulacao) nao devolve --
  // nesse caso o override escolhido em catalogo.html (mesmo uf/segmento/
  // classe que gerou o preco) e que vale pra nota abaixo do total.
  const faixaBase = Object.values(precos)[0];
  const override = lerOverridePolitica();
  const faixa = faixaBase?.segmento ? faixaBase : (override ? { segmento: override.segmento, uf: override.uf, classe: override.classe } : null);
  const podeEditarPreco = podeEnviarOrcamento();
  const detalhes = getDetalhesPedido();

  const totalVal = cart.reduce((s, i) => s + (precoDe(i) * i.quantidade), 0);
  const semEstoque = itensSemEstoque(cart, stockMap);

  // "Faltam R$X para a proxima faixa" -- so faz sentido para clientes com
  // segmento Fisica; para Ecommerce/Hibrido a resposta vem com aplicavel=false
  // e o banner nao aparece. A conta e feita no servidor (fonte unica das
  // faixas 7.000/20.000 vive em hub_fn_classe e hub_politica_parametros).
  let faixaProxima = null;
  let creditoInfo = null;
  try {
    const clienteId = getClienteAtivo();
    if (clienteId) {
      faixaProxima = await sbRpc('hub_fn_faixa_proxima', {
        p_cliente_id: clienteId, p_valor_pedido: totalVal
      });
      // Credito do carrinho -- antes so aparecia depois de clicar "Revisar
      // pedido" (que ja grava rascunho no banco). Mostrar aqui e so leitura,
      // sem custo de escrita, e evita o cliente descobrir tarde que falta
      // limite. A checagem que vale de verdade continua no servidor.
      const cli = await sb('/hub_clientes?id=eq.' + clienteId + '&select=limite_credito,limite_disponivel').then(r => r[0] || null);
      if (cli) creditoInfo = cli;
    }
  } catch {}

  wrap.innerHTML = `
    ${podeEditarPreco ? '<div class="cart-preco-hint">Clique no preço de um item para ajustar manualmente — vale só para o orçamento enviado ao cliente; o pedido confirmado sempre usa o preço real calculado pelo sistema.</div>' : ''}
    <div>
      ${cart.map((item, idx) => {
        const st = stockMap[item.produto_id];
        const stInfo = st ? stockLabel(st, item.quantidade) : { cls: '', text: '' };
        const prev = prevMap[item.sku];
        const prevTexto = prev ? (prev.iso ? 'Disponibilidade Prevista para ' + fmtData(prev.iso) : 'Sem Disponibilidade Prevista') : '';
        // So uma badge de estoque por item -- antes mostravamos stInfo (calculo
        // grosseiro: qtd x estoque_disponivel estatico) E prevTexto (previsao
        // dinamica, mais precisa) ao mesmo tempo, as vezes se contradizendo
        // (ex: "Indisponivel" e "Prevista para X" juntos). A previsao e mais
        // informativa quando existe; a badge generica so entra quando nao ha
        // previsao nenhuma calculada ainda. Bug visto ao vivo em teste, 2026-11-03.
        const badgeEstoque = prevTexto
          ? '<div class="cart-item-stock s-prev"><span class="dot"></span>' + prevTexto + '</div>'
          : (stInfo.text ? '<div class="cart-item-stock ' + stInfo.cls + '"><span class="dot"></span>' + stInfo.text + '</div>' : '');
        const unit = precoDe(item);
        const basePreco = precoBaseDe(item);
        const tabela = +(precos[item.produto_id]?.preco_tabela || 0);
        const riscadoHtml = tabela > 0 && Math.abs(tabela - unit) > 0.01
          ? `<s style="color:#a0aec0;font-size:11px;margin-right:4px">${fmtMoeda(tabela)}</s>` : '';
        const precoHtml = podeEditarPreco
          ? `<span id="cartPreco_${idx}" data-base="${basePreco}" onclick="editarPrecoCarrinho(${idx})" style="cursor:pointer;border-bottom:1px dotted #a0aec0" title="Clique para ajustar o preço deste item">${fmtMoeda(unit)}</span>${item.precoManual != null ? ` · <a href="javascript:void(0)" onclick="restaurarPrecoCarrinho(${idx})" style="color:#718096;font-size:11px">restaurar</a>` : ''}`
          : fmtMoeda(unit);
        return `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-sku">${esc(item.sku)}</div>
            <div class="cart-item-nome">${esc(item.nome || item.sku)}</div>
            <div class="cart-item-preco">${riscadoHtml}${precoHtml} un</div>
            ${badgeEstoque}
          </div>
          <div class="cart-item-qty">
            <label>Qtd</label>
            <input type="number" value="${item.quantidade}" min="1" max="999" onchange="updateCartQty(${idx}, this.value)">
          </div>
          <div class="cart-item-subtotal">${fmtMoeda(unit * item.quantidade)}</div>
          <button class="cart-item-remove" onclick="removeCartItem(${idx})" title="Remover">&times;</button>
        </div>`;
      }).join('')}
    </div>
    <div class="cart-summary">
      <div>
        <span class="cart-total-label">${cart.length} produto${cart.length !== 1 ? 's' : ''} | ${totalQty} unidade${totalQty !== 1 ? 's' : ''}</span>
        <span class="cart-total-nota">c/ impostos inclusos${faixa ? ' | ' + esc(faixa.segmento) + '/' + esc(faixa.uf) + ' — classe ' + faixa.classe : ''}</span>
      </div>
      <div class="cart-total-valor">${fmtMoeda(totalVal)}</div>
    </div>
    ${renderCreditoCarrinho(creditoInfo, totalVal)}
    ${renderFaixaProxima(faixaProxima)}
    ${renderSobEncomenda(semEstoque)}
    ${renderBloqueios()}

    <div class="cart-pedido-sec">
      <h4 style="font-size:12px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Pagamento</h4>
      <div class="form-row-inline">
        <div class="form-row">
          <label>Forma de pagamento</label>
          <select id="cartPagamento" onchange="salvarDetalhesPedido({forma_pagamento:this.value});atualizarParcelasCarrinho()">
            <option value="boleto" ${!detalhes.forma_pagamento || detalhes.forma_pagamento === 'boleto' ? 'selected' : ''}>Boleto / Duplicata a prazo</option>
            <option value="cartao_credito" ${detalhes.forma_pagamento === 'cartao_credito' ? 'selected' : ''}>Cartão de crédito</option>
            <option value="pix" ${detalhes.forma_pagamento === 'pix' ? 'selected' : ''}>PIX / à vista</option>
            <option value="transferencia" ${detalhes.forma_pagamento === 'transferencia' ? 'selected' : ''}>Transferência</option>
          </select>
        </div>
        <div class="form-row">
          <label>Parcelas</label>
          <select id="cartParcelas" onchange="salvarDetalhesPedido({parcelas:+this.value})"></select>
        </div>
      </div>
    </div>
    <div class="cart-pedido-sec">
      <h4 style="font-size:12px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Seus dados</h4>
      <div class="form-row">
        <label>Número da sua ordem de compra (opcional)</label>
        <input id="cartOC" type="text" maxlength="60" value="${esc(detalhes.ordem_compra || '')}" oninput="salvarDetalhesPedido({ordem_compra:this.value})" placeholder="Ex: OC-2026-114">
      </div>
      <div class="form-row">
        <label>Observações (opcional)</label>
        <textarea id="cartObs" maxlength="1000" oninput="salvarDetalhesPedido({observacoes:this.value})" placeholder="Instrucoes de entrega, transportadora preferida, etc.">${esc(detalhes.observacoes || '')}</textarea>
      </div>
    </div>`;

  atualizarParcelasCarrinho();

  // Rodape fixo: os botoes de acao ficam visiveis desde o primeiro item
  // adicionado, sem precisar rolar ate o fim do carrinho -- pedido do Andre
  // apos testar com um carrinho grande.
  let acoes = document.getElementById('cartActionsBar');
  if (!acoes) {
    acoes = document.createElement('div');
    acoes.id = 'cartActionsBar';
    acoes.className = 'cart-actions';
    wrap.parentNode.appendChild(acoes);
  }
  acoes.innerHTML = `
    <div class="cart-actions-total">
      <b>${fmtMoeda(totalVal)}</b>
      <span>${cart.length} produto${cart.length !== 1 ? 's' : ''} · ${totalQty} unidade${totalQty !== 1 ? 's' : ''}</span>
    </div>
    <div class="cart-actions-botoes">
      <button class="btn btn-danger btn-sm" onclick="clearCart()">Limpar carrinho</button>
      <button class="btn btn-primary" id="btnEnviarPedido" onclick="enviarPedido()">Revisar pedido</button>
    </div>`;
}

// Mostra o limite de credito ja no carrinho, antes de "Revisar pedido" --
// achado por Andre em 2026-10-27 testando a APM: o aviso so aparecia depois
// de criar o rascunho, tarde demais para o cliente decidir ali. So leitura
// (hub_clientes), nao grava nada -- a checagem que vale de verdade continua
// em hub_fn_validar_politica no momento de submeter.
function renderCreditoCarrinho(cliente, totalVal) {
  if (!cliente) return '';
  const disponivel = +(cliente.limite_disponivel || 0);
  const limite = +(cliente.limite_credito || 0);
  const saldo = disponivel - totalVal;
  if (saldo >= 0) return '';
  return `<div style="margin-top:12px;padding:10px 14px;background:#fef2f2;border-left:3px solid #e30613;border-radius:0 6px 6px 0;font-size:13px;color:#991b1b">
    <strong>Limite de credito insuficiente para este pedido</strong>
    <div style="margin-top:4px">Pedido ${fmtMoeda(totalVal)}, disponivel ${fmtMoeda(disponivel)} de um limite de ${fmtMoeda(limite)}.
    Faltam ${fmtMoeda(Math.abs(saldo))}. Reduza o pedido ou <a href="financeiro.html#solicitar-credito" style="color:#991b1b;font-weight:600">solicite aumento de limite</a>.</div>
  </div>`;
}

// Banner motivador logo depois do total: "adicione mais R$X para uma faixa
// melhor de desconto". So aparece para segmento Fisica (Ecommerce/Hibrido
// nao tem faixa por valor). Nao promete "quanto vai ganhar" -- varia por
// produto e enganaria; a promessa e so "voce sobe de faixa".
function renderFaixaProxima(f) {
  if (!f || !f.aplicavel || !f.mensagem) return '';
  if (f.melhor_faixa) {
    return `<div style="margin-top:12px;padding:10px 14px;background:#f0fdf4;border-left:3px solid #16a34a;border-radius:0 6px 6px 0;font-size:13px;color:#166534">
      ${esc(f.mensagem)}
    </div>`;
  }
  return `<div style="margin-top:12px;padding:10px 14px;background:#eff6ff;border-left:3px solid #25bbee;border-radius:0 6px 6px 0;font-size:13px;color:#1d327b;display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div>${esc(f.mensagem)}</div>
    <a href="catalogo.html" style="font-size:12px;color:#25bbee;text-decoration:none;white-space:nowrap">Adicionar mais itens</a>
  </div>`;
}

// Um unico painel para tudo que impede o pedido de sair -- credito, pedido
// minimo, boleto, parcelamento. Estoque NAO bloqueia mais (backorder
// reaberto em 2026-10-26) -- ver renderSobEncomenda, que e informativo.
function renderBloqueios() {
  const blocos = [];

  ultimasViolacoes.forEach(v => {
    blocos.push(`<strong>${esc(rotuloRegra(v.regra))}</strong><p>${esc(v.mensagem || '')}</p>`);
  });

  if (!blocos.length) return '';
  return '<div class="cart-bloqueio">' + blocos.join('<hr>') + '</div>';
}

// Painel informativo (nao bloqueia): itens sem estoque imediato entram no
// pedido como "Sob encomenda" -- a previsao por item ja aparece inline no
// card de cada produto (ver prevTexto), isso aqui e so o resumo no rodape.
function renderSobEncomenda(semEstoque) {
  if (!semEstoque.length) return '';
  return `<div style="margin-top:12px;padding:10px 14px;background:#eff6ff;border-left:3px solid #25bbee;border-radius:0 6px 6px 0;font-size:13px;color:#1d327b">
    <strong>${semEstoque.length} ${semEstoque.length > 1 ? 'itens sob encomenda' : 'item sob encomenda'}</strong>
    <div style="margin-top:4px;color:#2563eb">Entram no pedido normalmente e serao atendidos conforme a previsao de chegada de cada item.</div>
  </div>`;
}

function regraDoErro(erro) {
  const e = String(erro || '').toLowerCase();
  if (e.includes('limite')) return 'credito';
  if (e.includes('cadastro')) return 'cadastro';
  return 'outro';
}

// O erro de credito vem com os numeros separados; montar a frase aqui evita
// mandar o cliente conferir o limite em outra tela para descobrir quanto falta.
function mensagemDeCredito(r) {
  if (regraDoErro(r.erro) !== 'credito' || r.excedente == null) return r.erro;
  return 'Limite de credito insuficiente para este pedido. '
    + 'Pedido ' + fmtMoeda(r.valor_pedido)
    + ', disponivel ' + fmtMoeda(r.disponivel)
    + ' de um limite de ' + fmtMoeda(r.limite_total) + '. '
    + 'Faltam ' + fmtMoeda(r.excedente) + '. '
    + 'Reduza o pedido ou solicite aumento de limite em Financeiro.';
}

function rotuloRegra(regra) {
  return ({
    estoque: 'Falta estoque',
    pedido_minimo: 'Pedido abaixo do minimo',
    credito: 'Limite de credito insuficiente',
    cadastro: 'Cadastro do cliente',
    boleto_elegibilidade: 'Boleto/duplicata indisponivel',
    parcelamento: 'Parcelamento fora da politica',
    valor_minimo_duplicata: 'Valor minimo por duplicata'
  })[regra] || 'Pedido bloqueado';
}

// Espelha no carrinho a trava que o servidor aplica em hub_fn_validar_politica.
// Aqui e so aviso antecipado -- quem garante e o banco. Se o estoque nao veio
// (stockMap vazio, sync fora do ar), nao bloqueia nada: mesma decisao do
// servidor, que suspende a trava quando o sync parece quebrado.
function itensSemEstoque(cart, stockMap) {
  return cart.reduce((acc, item) => {
    const st = stockMap[item.produto_id];
    const disp = Number(st?.estoque_disponivel);
    if (Number.isFinite(disp) && item.quantidade > disp) {
      acc.push({ sku: item.sku || '—', nome: item.nome || '', pedida: item.quantidade, disponivel: disp });
    }
    return acc;
  }, []);
}

let _enviandoPedido = false;

async function enviarPedido() {
  if (_enviandoPedido) return; // trava de reentrancia -- protege mesmo se o
  // botao for recriado (renderCarrinho) enquanto o envio anterior ainda esta em voo
  _enviandoPedido = true;

  try {
    await _enviarPedidoInterno();
  } finally {
    _enviandoPedido = false;
  }
}

async function _enviarPedidoInterno() {
  const cart = getCart();
  if (!cart.length) return;

  // Dealer pede para si; representante e funcionario pedem em nome da revenda
  // que escolheram na topbar. Quem valida o direito e a RLS/hub_pode_acessar_cliente.
  const clienteId = getClienteAtivo();

  // CNPJ novo (prospect): nao existe cliente_id nenhum pra criar rascunho em
  // hub_pedidos (a coluna e not-null) -- nao faz sentido tentar, ja que so
  // "Enviar Link do Orcamento" existe pra esse caso (ver podeEnviarOrcamento).
  // Caminho totalmente a parte, sem passar por hub_fn_validar_politica.
  if (!clienteId && getProspectAtivo()) {
    await abrirRevisaoProspect(cart);
    return;
  }

  if (!clienteId) {
    if (getUserTipo() !== 'cliente') {
      toast('Selecione a revenda antes de enviar o pedido', 'error');
      abrirSeletorCliente();
    } else {
      toast('Seu usuario nao esta vinculado a um cliente', 'error');
    }
    return;
  }

  const btn = document.getElementById('btnEnviarPedido');
  btn.disabled = true;
  btn.textContent = 'Preparando...';

  try {
    // Os precos abaixo sao so uma estimativa para o rascunho: quem decide e
    // hub_fn_submeter_pedido, que reprecifica tudo pela base mestre, aciona a
    // politica comercial e reserva o credito numa transacao so. Duplicar essas
    // contas aqui so criaria uma segunda versao da regra para divergir.
    const precos = await carregarPrecosCarrinho(cart);

    const tipo = getUserTipo();
    const novoPedido = { cliente_id: clienteId, status: 'rascunho' };
    if (tipo === 'representante') {
      novoPedido.origem = 'proxy_representante';
      novoPedido.representante_id = getUserRepresentanteId();
    } else if (tipo !== 'cliente') {
      novoPedido.origem = 'admin';
    }

    // Reusa o rascunho em edicao, se ainda existir e continuar sendo rascunho
    // desta revenda. Evita duplicar o pedido a cada reenvio.
    let pedido = null;
    const emEdicao = getPedidoEmEdicao();
    if (emEdicao) {
      const [r] = await sb('/hub_pedidos?id=eq.' + emEdicao +
        '&status=eq.rascunho&ativo=eq.true&cliente_id=eq.' + clienteId + '&select=id');
      if (r) {
        pedido = r;
        // Troca os itens pelo conteudo atual do carrinho.
        await sb('/hub_pedido_itens?pedido_id=eq.' + r.id, 'DELETE');
      } else {
        clearPedidoEmEdicao(); // sumiu, foi submetido ou e de outra revenda
      }
    }

    if (!pedido) {
      [pedido] = await sb('/hub_pedidos', 'POST', novoPedido);
      setPedidoEmEdicao(pedido.id);
    }

    await sb('/hub_pedido_itens', 'POST', cart.map(i => {
      const p = precos[i.produto_id];
      const unit = +(p?.preco_final ?? i.preco_base ?? 0);
      return {
        pedido_id: pedido.id,
        produto_id: i.produto_id,
        sku: i.sku,
        nome_produto: i.nome,
        quantidade: i.quantidade,
        preco_unitario: +(p?.preco_tabela ?? unit),
        preco_final: unit,
        subtotal_item: +(unit * i.quantidade).toFixed(2)
      };
    }));

    // Ate aqui o pedido esta salvo como rascunho, com itens e precos do
    // servidor. Nada foi submetido: o proximo passo e a revisao.
    const [politica, cliente, endereco] = await Promise.all([
      sbRpc('hub_fn_validar_politica', { p_pedido_id: pedido.id }),
      sb('/hub_clientes?id=eq.' + clienteId + '&select=limite_credito,limite_disponivel,uf,razao_social,nome_fantasia,cnpj,email_principal,telefone,canal')
        .then(r => r[0] || {}),
      // Endereco de entrega. Regra: o pedido usa o endereco do cadastro, sem
      // opcao de editar na tela -- alteracao vira solicitacao que muda
      // primeiro no Zen e reflete depois no Hub. `padrao=true` prefere o
      // principal; se nao houver, o primeiro ativo.
      sb('/hub_enderecos?cliente_id=eq.' + clienteId + '&ativo=eq.true' +
         '&select=logradouro,numero,complemento,bairro,cidade,uf,cep,tipo,padrao' +
         '&order=padrao.desc,tipo.asc&limit=1').then(r => r[0] || null)
    ]);

    abrirRevisao(pedido.id, politica, cliente, endereco);
  } catch (e) {
    toast('Erro: ' + erroLegivel(e), 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Revisar pedido';
  }
}

// === REVISAO ANTES DE ENVIAR ===
// O pedido so sai depois desta tela. Ela existe porque o cliente precisava
// declarar OC, pagamento e frete, e porque descobrir o limite de credito na
// mensagem de recusa e tarde demais -- ele tem que ver antes de tentar.

let _revisao = null;

// Rotulo legivel da forma de pagamento escolhida na tela do carrinho -- so
// para recapitular aqui, o campo em si mora em getDetalhesPedido() agora.
const PAGAMENTO_LABEL = { boleto: 'Boleto / Duplicata a prazo', cartao_credito: 'Cartão de crédito', pix: 'PIX / à vista', transferencia: 'Transferência' };

// Revisao do orcamento para CNPJ novo (prospect) -- caminho bem mais curto
// que abrirRevisao: nao ha rascunho em hub_pedidos, nao ha endereco/credito/
// frete reais (o cliente ainda nao existe), e "Confirmar e Enviar para ZEN"
// nunca aparece, so "Enviar Link do Orcamento". _revisao.cliente e montado
// na mao a partir do prospect pra enviarOrcamento() funcionar sem mudanca.
async function abrirRevisaoProspect(cart) {
  const btn = document.getElementById('btnEnviarPedido');
  if (btn) { btn.disabled = true; btn.textContent = 'Preparando...'; }
  try {
    const prospect = getProspectAtivo();
    const precos = await carregarPrecosCarrinho(cart);
    if (!Object.keys(precos).length) {
      toast('Escolha UF/Segmento/Classe no catálogo antes de revisar (CNPJ novo não tem política comercial cadastrada)', 'error');
      return;
    }
    const total = cart.reduce((s, i) => s + (+(precos[i.produto_id]?.preco_final ?? 0) * i.quantidade), 0);
    const detalhes = getDetalhesPedido();

    _revisao = {
      pedidoId: null, subtotal: total, valorFrete: 0, total, frete: null,
      cliente: { cnpj: prospect.cnpj, razao_social: prospect.nome, nome_fantasia: '', uf: prospect.uf, email_principal: '', telefone: '' }
    };

    openModal(`
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px">
        <h3 style="font-size:18px;color:#1d327b">Revisar orçamento — CNPJ novo</h3>
        <span style="cursor:pointer;font-size:20px;color:#718096" onclick="closeModal()">&times;</span>
      </div>
      <div style="font-size:12px;color:#92400e;background:#fff7ed;border:1px solid #fed7aa;padding:10px 12px;border-radius:8px;margin-bottom:16px">
        <strong>${esc(prospect.nome)}</strong> ainda não é cliente cadastrado no ZEN. Endereço, crédito e frete serão definidos no cadastro — por enquanto só dá pra enviar o link do orçamento, não confirmar um pedido real.
      </div>
      <div class="rev-sec">
        <h4>Resumo</h4>
        <div class="rev-linha"><span>${cart.length} item(ns)</span><span class="v">${fmtMoeda(total)}</span></div>
        <div class="rev-total"><span>Total</span><span class="v">${fmtMoeda(total)}</span></div>
      </div>
      <div class="rev-sec">
        <h4>Confirmação</h4>
        <div class="rev-linha"><span>Pagamento</span><span class="v">${esc(PAGAMENTO_LABEL[detalhes.forma_pagamento] || PAGAMENTO_LABEL.boleto)}${detalhes.parcelas > 1 ? ' em ' + detalhes.parcelas + 'x' : ''}</span></div>
        ${detalhes.ordem_compra ? `<div class="rev-linha"><span>OC</span><span class="v">${esc(detalhes.ordem_compra)}</span></div>` : ''}
        <div style="font-size:11px;color:#718096;margin-top:6px">Para ajustar isso, <a href="javascript:void(0)" onclick="closeModal()" style="color:#25bbee">volte ao carrinho</a>.</div>
      </div>
      <div class="rev-sec">
        <h4>Enviar para aprovação (orçamento)</h4>
        <div class="form-row">
          <label>Nome de quem recebe</label>
          <input id="orcDestNome" type="text" maxlength="120" placeholder="Nome do contato">
        </div>
        <div class="form-row-inline">
          <div class="form-row"><label>E-mail</label><input id="orcDestEmail" type="email" placeholder="contato@empresa.com.br"></div>
          <div class="form-row"><label>Celular / WhatsApp</label><input id="orcDestCelular" type="text" placeholder="(11) 99999-9999"></div>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline" onclick="closeModal()">Voltar ao carrinho</button>
        <button class="btn" style="background:#25bbee;color:#fff;border-color:#25bbee" id="btnEnviarOrcamento" onclick="enviarOrcamento()">Enviar Link do Orçamento</button>
      </div>
    `);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Revisar pedido'; }
  }
}
function esc(s) { return esc(s); }

function abrirRevisao(pedidoId, politica, cliente, endereco) {
  const subtotal = +(politica.subtotal || 0);
  const frete = politica.frete && politica.frete !== 'null' ? politica.frete : null;
  const valorFrete = +(frete?.valor || 0);
  const total = subtotal + valorFrete;

  const disponivel = +(cliente.limite_disponivel || 0);
  const limite = +(cliente.limite_credito || 0);
  const saldo = disponivel - total;
  const detalhes = getDetalhesPedido();

  _revisao = { pedidoId, subtotal, valorFrete, total, frete, cliente };

  const violacoes = politica.violacoes || [];
  const bloqueado = violacoes.length > 0;

  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px">
      <h3 style="font-size:18px;color:#1d327b">Revisar e enviar pedido</h3>
      <span style="cursor:pointer;font-size:20px;color:#718096" onclick="closeModal()">&times;</span>
    </div>

    ${bloqueado ? `<div class="cart-bloqueio" style="margin:0 0 18px">
      ${violacoes.map(v => `<strong>${esc(rotuloRegra(v.regra))}</strong><p>${esc(v.mensagem || '')}</p>`).join('<hr>')}
    </div>` : ''}

    <div class="rev-sec">
      <h4>Resumo</h4>
      <div class="rev-linha"><span>${politica.itens || 0} item(ns)</span><span class="v">${fmtMoeda(subtotal)}</span></div>
      <div class="rev-linha"><span>Frete</span><span class="v">${valorFrete > 0 ? fmtMoeda(valorFrete) : 'Sem custo'}</span></div>
      <div class="rev-total"><span>Total</span><span class="v">${fmtMoeda(total)}</span></div>
    </div>

    <div class="rev-sec">
      <h4>Limite de credito</h4>
      <div class="rev-credito ${saldo >= 0 ? 'ok' : 'ruim'}">
        <div class="rev-linha"><span>Limite total</span><span class="v">${fmtMoeda(limite)}</span></div>
        <div class="rev-linha"><span>Disponivel hoje</span><span class="v">${fmtMoeda(disponivel)}</span></div>
        <div class="rev-linha"><span>Este pedido</span><span class="v">${fmtMoeda(total)}</span></div>
        <div class="saldo">${saldo >= 0
          ? 'Sobra ' + fmtMoeda(saldo) + ' de limite apos este pedido.'
          : 'Faltam ' + fmtMoeda(Math.abs(saldo)) + '. Reduza o pedido ou <a href="financeiro.html#solicitar-credito" style="color:#1d327b;font-weight:600">solicite aumento de limite</a>.'}</div>
      </div>
    </div>

    <div class="rev-sec">
      <h4>Endereco de entrega</h4>
      ${endereco
        ? `<div class="rev-endereco">
            <div style="font-size:13px;color:#1a202c">
              ${esc(endereco.logradouro || '')}${endereco.numero ? ', ' + esc(endereco.numero) : ''}
              ${endereco.complemento ? ' — ' + esc(endereco.complemento) : ''}
            </div>
            <div style="font-size:12px;color:#4a5568;margin-top:2px">
              ${esc(endereco.bairro || '')}${endereco.bairro ? ' · ' : ''}${esc(endereco.cidade || '')}/${esc(endereco.uf || '')}
              ${endereco.cep ? ' · CEP ' + esc(endereco.cep) : ''}
            </div>
            <div style="font-size:11px;color:#718096;margin-top:6px">
              Alteracao de endereco precisa passar pelo cadastro para atualizar tambem no ERP.
              <a href="cadastro.html" style="color:#25bbee;text-decoration:none">Ir para meu cadastro</a>.
            </div>
          </div>`
        : `<div class="rev-endereco" style="color:#991b1b;background:#fee2e2;border:1px solid #fecaca;padding:10px;border-radius:6px;font-size:13px">
            Nao ha endereco cadastrado. <a href="cadastro.html" style="color:#25bbee">Complete o cadastro</a> antes de enviar o pedido.
          </div>`}
    </div>

    ${frete ? `<div class="rev-sec">
      <h4>Frete</h4>
      <div class="rev-frete">${esc(frete.motivo || '')}</div>
      ${renderOpcoesFrete(frete, valorFrete)}
    </div>` : ''}

    <div class="rev-sec">
      <h4>Confirmação</h4>
      <div class="rev-linha"><span>Pagamento</span><span class="v">${esc(PAGAMENTO_LABEL[detalhes.forma_pagamento] || PAGAMENTO_LABEL.boleto)}${detalhes.parcelas > 1 ? ' em ' + detalhes.parcelas + 'x' : ''}</span></div>
      ${detalhes.ordem_compra ? `<div class="rev-linha"><span>OC</span><span class="v">${esc(detalhes.ordem_compra)}</span></div>` : ''}
      ${detalhes.observacoes ? `<div class="rev-linha" style="align-items:flex-start"><span>Observações</span><span class="v" style="font-weight:400;text-align:right;max-width:65%">${esc(detalhes.observacoes)}</span></div>` : ''}
      <div style="font-size:11px;color:#718096;margin-top:6px">Para ajustar isso, <a href="javascript:void(0)" onclick="closeModal()" style="color:#25bbee">volte ao carrinho</a>.</div>

    ${podeEnviarOrcamento() ? `<div class="rev-sec">

      <div style="font-size:12px;color:#718096;margin-bottom:10px">

      </div>
      <div class="form-row">
        <label>Nome de quem recebe</label>
        <input id="orcDestNome" type="text" maxlength="120" placeholder="Nome do contato">
      </div>
      <div class="form-row-inline">
        <div class="form-row">
          <label>E-mail</label>
          <input id="orcDestEmail" type="email" value="${esc(cliente.email_principal || '')}">
        </div>
        <div class="form-row">
          <label>Celular / WhatsApp</label>

      </div>
    </div>` : ''}

    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Voltar ao carrinho</button>
      ${podeEnviarOrcamento() ? `<button class="btn btn-outline" style="color:#0e7490;border-color:#67c6e8" id="btnEnviarOrcamento" onclick="enviarOrcamento()">Enviar Orçamento</button>` : ''}
      <button class="btn btn-primary" id="btnConfirmarEnvio" onclick="confirmarEnvio()"
              ${bloqueado ? 'disabled title="Resolva os bloqueios acima"' : ''}>Confirmar e Enviar Pedido${getUserTipo() === 'cliente' ? '' : ' para ZEN'}</button>
    </div>
  `);
}

// "Enviar Orcamento" so existe pra quem esta montando pedido para OUTRA
// revenda (Modo Proxy) -- o proprio dealer so tem "Confirmar e enviar": ele
// ja esta comprando de verdade, nao faz sentido propor orcamento pra si
// mesmo. Ver plano "Orcamento com link + aceite digital dentro do Hub".
function podeEnviarOrcamento() {
  return getUserTipo() !== 'cliente' && (!!getClienteAtivo() || !!getProspectAtivo());
}

// Envia o carrinho como orcamento (perfil "Orcamento" no Zen, PREPARING, sem
// reservar credito/estoque) em vez de pedido de verdade -- chama o mesmo
// backend que ja atende tabela-teste.html (api/_orcamento.js, roteado por
// api/push-pedido.js com ?target=orcamento). O preco e calculado la, com o
// cenario de politica comercial escolhido em catalogo.html (ver
// aplicarAjustePolitica) quando houver, senao a politica real da revenda.
async function enviarOrcamento() {
  if (!_revisao) return;
  const btn = document.getElementById('btnEnviarOrcamento');
  const nome = document.getElementById('orcDestNome').value.trim();
  const email = document.getElementById('orcDestEmail').value.trim();
  const celular = document.getElementById('orcDestCelular').value.trim();
  if (!email || !/^\S+@\S+\.\S+$/.test(email)) { toast('Informe um e-mail valido para quem recebe o orcamento', 'error'); return; }
  if (!celular.replace(/\D/g, '')) { toast('Informe o celular de quem recebe o orcamento', 'error'); return; }

  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const clienteId = getClienteAtivo();
    const cliente = _revisao.cliente;
    const cart = getCart();

    const override = lerOverridePolitica();
    let uf = override?.uf, segmento = override?.segmento, classe = override?.classe;
    if ((!uf || !segmento || !classe) && clienteId) {
      // p_valor_pedido=0 sempre devolve a classe MAIS CARA (1) -- "preco
      // publicado" antes de qualquer desconto por volume (ver comentario em
      // hub_fn_precos_cliente). Pra achar a classe de verdade do carrinho,
      // repete o mesmo passo-duplo que carregarPrecosCarrinho ja faz: mede o
      // subtotal a preco de TABELA primeiro, so depois pede a classe naquela
      // faixa. Sem isso, todo orcamento saia incorretamente classificado
      // como classe 1 (bug visto ao vivo em teste, 2026-11-03).
      const tabelaBase = await sbRpc('hub_fn_precos_cliente', { p_cliente_id: clienteId, p_valor_pedido: 0 });
      const porId = {}; tabelaBase.forEach(l => { porId[l.produto_id] = l; });
      const subtotalTabela = cart.reduce((s, i) => s + (+(porId[i.produto_id]?.preco_tabela || 0) * i.quantidade), 0);
      const base = await sbRpc('hub_fn_precos_cliente', { p_cliente_id: clienteId, p_valor_pedido: subtotalTabela });
      const ref = base[0];
      if (!ref) { toast('Nao foi possivel calcular a politica comercial desta revenda', 'error'); return; }
      uf = uf || ref.uf; segmento = segmento || ref.segmento; classe = classe || ref.classe;
    }
    // CNPJ novo (prospect): nao tem hub_fn_precos_cliente pra cair de volta --
    // uf/segmento/classe tem que vir do ajuste feito em catalogo.html.
    if (!uf || !segmento || !classe) { toast('Escolha UF/Segmento/Classe no catálogo antes de enviar o orçamento', 'error'); return; }

    const detalhes = getDetalhesPedido();
    const payload = {
      acao: 'criar', tabela: 1,
      uf, segmento, classe: Number(classe),
      itens: cart.map(i => {
        const item = Object.assign({ codigo: i.sku, qtd: i.quantidade }, dispDoItem(i));
        if (i.precoManual != null) item.preco = i.precoManual;
        return item;
      }),
      cliente: {
        cnpj: cliente.cnpj, nome: cliente.razao_social, fantasia: cliente.nome_fantasia || '',
        email, celular, contato: nome || null, cidade: null, uf: cliente.uf
      },
      vendedor: { telefone: '' },
      pagamento: {
        tipo: detalhes.forma_pagamento === 'pix' ? 'avista' : 'boleto',
        parcelas: Number(detalhes.parcelas) || 1
      },
      observacoes: (detalhes.observacoes || '').trim() || null
    };

    const r = await fetch('/api/push-pedido?target=orcamento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (SESSION?.access_token || '') },
      body: JSON.stringify(payload)
    });
    const j = await r.json();
    if (!r.ok) { toast(j.error || 'Erro ao gerar orcamento', 'error'); return; }

    // O orcamento vive em comercial.orcamentos, nao em hub_pedidos -- o
    // rascunho criado antes da revisao (so para calcular preco/credito) fica
    // sem uso; apaga pra nao acumular rascunho orfao a cada orcamento
    // enviado. CNPJ novo (prospect) nunca cria esse rascunho (pedidoId null).
    if (_revisao.pedidoId) { try { await sb('/hub_pedidos?id=eq.' + _revisao.pedidoId, 'DELETE'); } catch (_) {} }
    clearPedidoEmEdicao();
    clearCart();
    _revisao = null;

    mostrarOrcamentoCriado(j);
  } catch (e) {
    toast('Erro ao gerar orcamento: ' + erroLegivel(e), 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

function mostrarOrcamentoCriado(j) {
  const wa = 'https://wa.me/?text=' + encodeURIComponent('Segue o orcamento: ' + j.link);
  openModal(`
    <div style="text-align:center">
      <h3 style="color:#1d327b;margin-bottom:10px">Orcamento ${esc(j.codigo)} gerado!</h3>
      <p style="font-size:13px;color:#4a5568;margin-bottom:14px">Valor: <strong>${fmtMoeda(j.total_final)}</strong> · validade ${fmtData(j.validade_em)}</p>
      <div style="display:flex;gap:6px;margin-bottom:14px">
        <input readonly value="${esc(j.link)}" style="flex:1;font-size:12px;padding:8px" onclick="this.select()">
        <button class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText('${j.link}');toast('Link copiado')">Copiar</button>
      </div>
      <a class="btn btn-primary" href="${wa}" target="_blank" rel="noopener" style="margin-right:6px">Enviar por WhatsApp</a>
      <button class="btn btn-outline" id="btnEmailOrc_${j.id}" onclick="enviarEmailOrcamento('${j.id}', this)">Enviar por E-mail</button>
      ${j.zen && !j.zen.ok ? `<div style="margin-top:12px;padding:8px;background:#fff4e5;color:#9a5b00;border-radius:6px;font-size:12px;text-align:left">${esc(j.zen.erro || '')}</div>` : ''}
      ${(j.avisos || []).length ? `<div style="margin-top:10px;text-align:left;font-size:12px;color:#92400e">${j.avisos.map(a => '<div>⚠ ' + esc(a) + '</div>').join('')}</div>` : ''}
      <div style="margin-top:18px"><button class="btn btn-outline" onclick="closeModal();document.querySelectorAll('.tab')[0].click();loadPedidos()">Fechar</button></div>
    </div>
  `);
}

// Mesmo backend do WhatsApp (link direto), so que por e-mail via Resend --
// usa o cliente_email ja cadastrado no orcamento, sem pedir de novo na tela.
async function enviarEmailOrcamento(id, btn) {
  const textoOriginal = btn.textContent;
  btn.disabled = true; btn.textContent = 'Enviando...';
  try {
    const r = await chamarOrcamentoApi('enviar_email', { id });
    toast('E-mail enviado para ' + r.enviado_para);
  } catch (e) {
    toast('Erro ao enviar e-mail: ' + erroLegivel(e), 'error');
  } finally {
    btn.disabled = false; btn.textContent = textoOriginal;
  }
}

// Quando ha alternativa real (pedido abaixo do minimo de frete gratis, ou UF
// FOB), o cliente escolhe. Quando nao ha -- CIF gratuito -- nao se pergunta.
function renderOpcoesFrete(frete, valorFrete) {
  const podeRetirar = frete.retirada_disponivel === true;
  const podeEnviar = frete.envio_disponivel === true;
  if (!podeRetirar) return ''; // so ha envio: nada a escolher

  return `<div class="rev-opcoes">
    ${podeEnviar ? `<label class="rev-opcao">
      <input type="radio" name="revFrete" value="envio" checked>
      <span><strong>Boxer envia</strong>
      <span>Frete de ${fmtMoeda(valorFrete)} incluido na nota.</span></span>
    </label>` : ''}
    <label class="rev-opcao">
      <input type="radio" name="revFrete" value="retirada" ${!podeEnviar ? 'checked' : ''}>
      <span><strong>Retirada por conta propria</strong>
      <span>Sem custo de frete. Retirada em Campinas, Sao Paulo ou Guarulhos, ou transportadora indicada por voce.</span></span>
    </label>
  </div>`;
}

async function confirmarEnvio() {
  if (!_revisao) return;
  const btn = document.getElementById('btnConfirmarEnvio');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    // Quando so ha uma opcao (CIF puro, sem retirada), renderOpcoesFrete nao
    // desenha radio nenhum -- sem isso, modalidade ficava null e o Zen
    // recebia freightType=NONE mesmo com frete real definido. Mesma logica
    // de podeRetirar/podeEnviar de renderOpcoesFrete, espelhada aqui.
    let modalidade = document.querySelector('input[name="revFrete"]:checked')?.value || null;
    if (!modalidade && _revisao.frete) {
      modalidade = _revisao.frete.envio_disponivel ? 'envio'
                 : _revisao.frete.retirada_disponivel ? 'retirada' : null;
    }

    const detalhes = getDetalhesPedido();
    await sb('/hub_pedidos?id=eq.' + _revisao.pedidoId, 'PATCH', {
      ordem_compra: (detalhes.ordem_compra || '').trim() || null,
      observacoes: (detalhes.observacoes || '').trim() || null,
      forma_pagamento: detalhes.forma_pagamento || 'boleto',
      parcelas: +detalhes.parcelas || 1,
      frete_modalidade: modalidade
    });

    const resultado = await sbRpc('hub_fn_submeter_pedido', { p_pedido_id: _revisao.pedidoId });

    if (!resultado.ok) {
      // hub_fn_submeter_pedido devolve as regras da politica em `violacoes`,
      // mas credito e cadastro voltam como `erro` solto. Para o cliente e tudo
      // a mesma coisa -- motivo pelo qual o pedido nao saiu -- entao normaliza
      // e mostra tudo no mesmo painel.
      const violacoes = (resultado.violacoes || []).slice();
      if (!violacoes.length && resultado.erro) {
        violacoes.push({
          regra: regraDoErro(resultado.erro),
          mensagem: mensagemDeCredito(resultado)
        });
      }
      // O rascunho fica salvo e continua marcado como "em edicao": o
      // revendedor ajusta o carrinho e reenvia NA MESMA linha, sem gerar
      // um pedido novo a cada tentativa.
      ultimasViolacoes = violacoes;
      closeModal();
      renderCarrinho();
      throw new Error(violacoes.map(v => v.mensagem).join(' ') || 'Erro ao submeter pedido');
    }

    // Submetido: o rascunho deixou de existir como rascunho.
    const pedidoId = _revisao.pedidoId;
    clearPedidoEmEdicao();
    ultimasViolacoes = [];
    _revisao = null;

    closeModal();
    clearCart();
    toast('Pedido ' + resultado.numero + ' enviado!');
    showTab('lista', document.querySelectorAll('.tab')[0]);

    // Espelha no ERP sem prender o cliente: o pedido JA passou pelo portao e ja
    // esta submetido: se o Zen estiver fora do ar, isso e problema nosso, nao
    // dele. Falhou aqui, o api/sync-pedidos-zen empurra depois -- por isso nem
    // avisa erro na tela nem desfaz nada.
    enviarAoErp(pedidoId);

    loadPedidos();
  } catch (e) {
    toast('Erro: ' + erroLegivel(e), 'error');
  } finally {
    if (btn && document.body.contains(btn)) {
      btn.disabled = false;
      btn.textContent = 'Confirmar e enviar';
    }
  }
}

// Best-effort, de proposito: nunca lanca e nunca fala com o usuario. O unico
// caminho garantido de entrega no Zen e o job (api/sync-pedidos-zen); esta
// chamada existe so para o caso normal chegar la em segundos em vez de esperar
// a proxima rodada.
async function enviarAoErp(pedidoId) {
  try {
    const r = await fetch('/api/push-pedido', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
      body: JSON.stringify({ pedido_id: pedidoId, dry: 0 })
    });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) console.warn('[hub] push ao Zen adiado para o job:', out.error || r.status);
    else setTimeout(loadPedidos, 1200); // ja mostra a etapa "Enviado ao ERP"
  } catch (e) {
    console.warn('[hub] push ao Zen adiado para o job:', e.message);
  }
}

function stockLabel(p, quantidade) {
  // Checagem numerica real: se a quantidade pedida excede o estoque conhecido,
  // isso vale mais que a categoria generica calculada sem olhar a quantidade.
  const estoque = Number(p.estoque_disponivel);
  if (Number.isFinite(estoque) && quantidade != null && quantidade > estoque) {
    if (p.backorder_disponivel) return { cls: 's-bo', text: 'Sob encomenda' };
    return { cls: 's-no', text: 'Indisponivel' };
  }
  if (p.status_estoque === 'disponivel') return { cls: 's-ok', text: 'Em estoque' };
  if (p.status_estoque === 'baixo') return { cls: 's-low', text: 'Estoque baixo' };
  if (p.backorder_disponivel) return { cls: 's-bo', text: 'Sob encomenda' };
  return { cls: 's-no', text: 'Indisponivel' };
}

function updateCartQty(idx, val) {
  const cart = getCart();
  const qty = parseInt(val) || 1;
  if (cart[idx]) {
    cart[idx].quantidade = Math.max(1, qty);
    saveCart(cart);
  }
}

function removeCartItem(idx) {
  const cart = getCart();
  cart.splice(idx, 1);
  saveCart(cart);
}

function clearCart() {
  sessionStorage.removeItem(cartKey());
  sessionStorage.removeItem(detalhesKey());
  // Esvaziar o carrinho encerra a edicao: o proximo envio e um pedido novo.
  // O rascunho antigo continua no historico, para retomar ou descartar de la.
  clearPedidoEmEdicao();
  ultimasViolacoes = [];
  renderCarrinho();
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Status do orcamento -- mesma paleta/rotulo ja usada em tabela-teste.html
// (orc-st), pra quem conhece as duas telas nao estranhar.
const ORC_STATUS_LABEL = {
  enviado: ['Enviado', ''], visualizado: ['Visto pelo cliente', 'azul'],
  aceito_cliente: ['Aceito pelo cliente', 'laranja'], aprovado: ['No Zen', 'verde'],
  cancelado: ['Cancelado', 'verm'], erro: ['Erro', 'verm']
};
let _orcamentosCache = {};

// Dealer nunca cria nem ve orcamento (ver podeEnviarOrcamento) -- so chama o
// backend quando faz sentido. Filtra pela revenda em foco comparando CNPJ,
// porque o backend lista por user_id (quem criou), nao por cliente.
async function carregarOrcamentosParaLista(clienteId) {
  if (getUserTipo() === 'cliente') return [];
  try {
    const r = await fetch('/api/push-pedido?target=orcamento', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (SESSION?.access_token || '') },
      body: JSON.stringify({ acao: 'listar', leve: true })
    });
    if (!r.ok) return [];
    const j = await r.json();
    let lista = (j.orcamentos || []).filter(o => !o.arquivado);
    if (clienteId) {
      // Grupo empresarial: orcamento e feito para um CNPJ especifico, mas o
      // olhar e pelo grupo (ex.: Diafer, 8 filiais) -- mesmo criterio de
      // getClienteGrupoIds, so que aqui filtrando por CNPJ (orcamento guarda
      // cliente_cnpj, nao cliente_id).
      const idsGrupo = await getClienteGrupoIds(clienteId);
      const filtro = idsGrupo.length > 1 ? 'id=in.(' + idsGrupo.join(',') + ')' : 'id=eq.' + clienteId;
      const cnpjsGrupo = await sb('/hub_clientes?' + filtro + '&select=cnpj');
      const cnpjSet = new Set(cnpjsGrupo.map(c => c.cnpj));
      if (cnpjSet.size) lista = lista.filter(o => cnpjSet.has(o.cliente_cnpj));
    }
    return lista;
  } catch (_) { return []; }
}

// Cache local das linhas -- filtro de texto so re-renderiza, sem refetch.
let _linhasPedidosCache = [];

async function loadPedidos() {
  const wrap = document.getElementById('pedidosList');
  const status = document.getElementById('filtroStatus').value;

  let url = '/hub_pedidos?select=id,numero,status,origem,valor_total,criado_em,erp_workflow_status,erp_pedido_id,ordem_compra,hub_clientes(razao_social,nome_fantasia)&order=criado_em.desc&ativo=eq.true';
  if (status) url += '&status=eq.' + status;
  // Com revenda selecionada (ou dealer logado, que ja e sempre a sua),
  // a lista mostra so os pedidos dela -- antes mostrava tudo que a RLS
  // deixava ver, mesmo com uma revenda especifica em foco no topo.
  const clienteId = getClienteAtivo();
  if (clienteId) {
    // Grupo empresarial (ex.: Diafer, 8 CNPJs/filiais): pedido nasce numa
    // filial especifica, mas o olhar e pelo grupo inteiro.
    const idsGrupo = await getClienteGrupoIds(clienteId);
    url += idsGrupo.length > 1 ? '&cliente_id=in.(' + idsGrupo.join(',') + ')' : '&cliente_id=eq.' + clienteId;
  }

  try {
    const [pedidos, orcamentos] = await Promise.all([sb(url), carregarOrcamentosParaLista(clienteId)]);
    _orcamentosCache = {};
    orcamentos.forEach(o => { _orcamentosCache[o.id] = o; });

    // Pedido e orcamento sao entidades separadas (ver plano), mas aparecem
    // juntos aqui -- cronologico, com etiqueta de tipo -- pra nao exigir uma
    // aba a parte so pra orcamento.
    _linhasPedidosCache = [
      ...pedidos.map(p => ({
        tipo: 'pedido', id: p.id, numero: p.numero || 'Rascunho', cliente: p.hub_clientes?.nome_fantasia || p.hub_clientes?.razao_social || '—',
        erpId: p.erp_pedido_id || null, oc: p.ordem_compra || null,
        statusHtml: `<span class="status-badge status-${p.status}">${esc(etapaVisivel(p))}</span>`,
        valor: p.valor_total, data: p.criado_em
      })),
      ...(status ? [] : orcamentos.map(o => {
        const [label, classe] = ORC_STATUS_LABEL[o.status] || [o.status, ''];
        // CNPJ novo ainda nao cadastrado no ZEN -- destaca na lista pra nao
        // depender de abrir cada orcamento pra perceber (pedido do Andre).
        const avisoCadastro = o.zen_status === 'sem_cliente_zen'
          ? ' <span class="orc-st-badge laranja" title="Verificar cadastro assim que o cliente existir no ZEN">aguardando cadastro</span>' : '';
        return {
          tipo: 'orcamento', id: o.id, numero: o.codigo, cliente: o.cliente_nome,
          erpId: o.zen_sale_id || null, oc: null,
          statusHtml: `<span class="orc-st-badge${classe ? ' ' + classe : ''}">${esc(label)}</span>${avisoCadastro}`,
          valor: o.total_final, data: o.criado_em
        };
      }))
    ].sort((a, b) => new Date(b.data) - new Date(a.data));

    renderPedidosFiltrados();
  } catch (e) {
    wrap.innerHTML = '<div class="empty-state"><h3>Erro ao carregar pedidos</h3><p>' + e.message + '</p></div>';
  }
}

function renderPedidosFiltrados() {
  const wrap = document.getElementById('pedidosList');
  const termo = (document.getElementById('filtroPedidoBusca')?.value || '').trim().toLowerCase();
  const bate = v => String(v || '').toLowerCase().includes(termo);
  const linhas = !termo ? _linhasPedidosCache : _linhasPedidosCache.filter(l =>
    bate(l.numero) || bate(l.cliente) || bate(l.oc) || bate(l.erpId));

  if (!linhas.length) {
    wrap.innerHTML = '<div class="empty-state"><h3>Nenhum pedido encontrado</h3></div>';
    return;
  }
  wrap.innerHTML = `<div style="overflow-x:auto"><table>
    <thead><tr><th>Numero</th><th>Nº ZEN</th><th>OC</th><th>Cliente</th><th>Tipo</th><th>Status</th><th>Valor</th><th>Data</th><th></th></tr></thead>
    <tbody>${linhas.map(l => `<tr>
      <td><strong>${esc(l.numero)}</strong></td>
      <td>${l.erpId ? esc(l.erpId) : '<span style="color:#a0aec0">—</span>'}</td>
      <td>${l.oc ? esc(l.oc) : '<span style="color:#a0aec0">—</span>'}</td>
      <td>${esc(l.cliente)}</td>
      <td><span style="font-size:11px;font-weight:600;color:${l.tipo === 'orcamento' ? '#9a3412' : '#1d327b'}">${l.tipo === 'orcamento' ? 'Orçamento' : 'Pedido'}</span></td>
      <td>${l.statusHtml}</td>
      <td>${fmtMoeda(l.valor)}</td>

    </tr>`).join('')}</tbody>
  </table></div>`;
}

async function chamarOrcamentoApi(acao, extra) {
  const r = await fetch('/api/push-pedido?target=orcamento', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + (SESSION?.access_token || '') },
    body: JSON.stringify(Object.assign({ acao }, extra))
  });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'Erro ao comunicar com o orcamento');
  return j;
}

// "Fundamental" pro Andre (2026-11-03): orcamento de CNPJ novo fica
// zen_status='sem_cliente_zen' ate o cadastro aparecer (ver
// api/_orcamento.js). O retry automatico so roda em janela limitada; isso
// aqui deixa o representante confirmar na hora, assim que sabe que o
// cadastro saiu, em vez de esperar.
async function verificarCadastroOrcamento(id) {
  const btn = document.getElementById('btnVerificarCadastro_' + id);
  if (btn) { btn.disabled = true; btn.textContent = 'Verificando...'; }
  try {
    const r = await chamarOrcamentoApi('verificar_cadastro', { id });
    if (r.encontrado === false) {
      toast('Cliente ainda não aparece no cadastro do ZEN. Tente de novo depois que o cadastro terminar.', 'error');
      return;
    }
    toast('Cliente encontrado — venda criada no ZEN!');
    closeModal();
    loadPedidos();
  } catch (e) {
    toast(e.message, 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Verificar cadastro agora'; }
  }
}

async function aprovarOrcamento(id) {
  if (!confirm('Confirmar este orçamento? A venda vira pedido de verdade no Zen.')) return;
  const o = _orcamentosCache[id];
  try {
    const r = await chamarOrcamentoApi('aprovar', { id });
    toast('Orçamento aprovado — pedido criado no Zen');
    closeModal();
    if (r.zen_sale_id && o) await espelharOrcamentoComoPedido(o, r.zen_sale_id);
    loadPedidos();
  } catch (e) { toast(e.message, 'error'); }
}

// Orcamento aprovado vira venda de verdade no Zen (ver aprovarOrcamento) --
// mas comercial.orcamentos e comercial.hub_pedidos sao tabelas separadas de
// proposito (ver plano). Sem espelhar aqui, o pedido some da visao do Hub
// depois de aprovado; com a linha criada e erp_pedido_id preenchido, o cron
// de sincronizacao que ja existe (api/sync-pedidos-zen.js) assume dali pra
// frente e traz a etapa certa sozinho, igual a qualquer outro pedido. Se
// isto falhar, o pedido no Zen continua real -- so nao aparece no Hub ainda
// (Monitor de Pedidos/Zen continuam a fonte de verdade de qualquer jeito).
async function espelharOrcamentoComoPedido(o, zenSaleId) {
  try {
    const [cliente] = await sb('/hub_clientes?cnpj=eq.' + o.cliente_cnpj + '&select=id,representante_id&limit=1');
    if (!cliente) { toast('Pedido criado no Zen, mas sem cliente cadastrado no Hub pra espelhar aqui ainda', 'error'); return; }

    const numero = await sbRpc('hub_fn_gerar_numero', {});
    const [pedido] = await sb('/hub_pedidos', 'POST', {
      numero: typeof numero === 'string' ? numero : numero?.numero || null,
      cliente_id: cliente.id,
      representante_id: cliente.representante_id || null,
      status: 'submetido',
      // hub_pedidos_origem_check so aceita cliente/proxy_representante/admin/
      // erp -- 'orcamento' nao existe e derrubava o INSERT inteiro (bug
      // visto ao vivo em teste, 2026-11-03: a venda avancou certo no Zen mas
      // nunca apareceu no Hub). E sempre o representante/staff atuando por
      // uma revenda que confirma o orcamento, nunca o proprio dealer.
      origem: 'proxy_representante',
      forma_pagamento: o.pagamento_tipo,
      parcelas: o.parcelas,
      valor_frete: o.frete_valor || 0,
      valor_total: o.total_final,
      observacoes: o.observacoes || null,
      erp_pedido_id: String(zenSaleId),
      erp_tipo: 'sale',
      erp_sincronizado_em: new Date().toISOString()
    });
    if (!pedido) return;

    const itens = (o.itens || []).map(async (i) => {
      const [prod] = await sb('/hub_produtos?sku=eq.' + encodeURIComponent(i.codigo) + '&select=id&limit=1');
      return {
        pedido_id: pedido.id, produto_id: prod?.id || null, sku: i.codigo, nome_produto: i.modelo,
        quantidade: i.qtd, preco_unitario: i.unit_tabela ?? i.unit, preco_final: i.unit,
        subtotal_item: i.subtotal ?? (i.unit * i.qtd)
      };
    });
    await sb('/hub_pedido_itens', 'POST', await Promise.all(itens));
  } catch (e) {
    console.error('[orcamento->pedido] falha ao espelhar:', e);
    toast('Pedido criado no Zen, mas houve erro ao refletir aqui no Hub — confira no Zen/Monitor', 'error');
  }
}
