<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Pedidos — Boxer Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f4f8;color:#1a202c}
.topbar{background:linear-gradient(135deg,#1d327b,#162666);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid #25bbee}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar h1{color:#fff;font-size:18px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:16px}
.user-badge{color:#93b4d4;font-size:13px}.user-badge strong{color:#fff}
.logout-btn{color:#93b4d4;font-size:13px;padding:6px 12px;border:1px solid rgba(255,255,255,.2);border-radius:6px;cursor:pointer}
.logout-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.notif-badge{background:#e30613;color:#fff;font-size:10px;padding:2px 6px;border-radius:10px;cursor:pointer}
.toast{position:fixed;top:20px;right:20px;padding:12px 20px;border-radius:8px;color:#fff;font-family:Outfit;font-size:13px;font-weight:500;z-index:2000;animation:slideIn .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast-success{background:#16a34a}.toast-error{background:#dc2626}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:1000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:700px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}

.tabs{display:flex;gap:4px;padding:16px 24px 0;max-width:1400px;margin:0 auto}
.tab{padding:10px 20px;border-radius:8px 8px 0 0;border:1px solid #d0d8e8;border-bottom:none;background:#fff;color:#4a5568;cursor:pointer;font-family:Outfit;font-size:14px;font-weight:500}
.tab:hover{color:#1d327b}
.tab.active{background:#1d327b;color:#fff;border-color:#1d327b}
.panel{max-width:1400px;margin:0 auto;padding:0 24px 24px}
.panel-content{background:#fff;border:1px solid #d0d8e8;border-radius:0 8px 8px 8px;padding:20px}
.hidden{display:none!important}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{padding:8px 12px;text-align:left;color:#718096;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid #e2e8f0;background:#f7fafc}
tbody td{padding:8px 12px;border-bottom:1px solid #e2e8f0;vertical-align:middle}
tbody tr:hover{background:#f0f7ff}

.btn{padding:8px 16px;border-radius:8px;border:1px solid;font-family:Outfit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:#1d327b;color:#fff;border-color:#1d327b}.btn-primary:hover{background:#162666}
.btn-danger{background:#fff;color:#e30613;border-color:#fecaca}.btn-danger:hover{background:#fee2e2}
.btn-outline{background:#fff;color:#4a5568;border-color:#c3cfe2}.btn-outline:hover{border-color:#25bbee;color:#1d327b}
.btn-warn{background:#f59e0b;color:#fff;border-color:#f59e0b}.btn-warn:hover{background:#d97706}
.btn:disabled{opacity:.45;cursor:not-allowed}
.cart-bloqueio{margin-top:16px;padding:14px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b}
.cart-bloqueio strong{display:block;font-size:14px;margin-bottom:4px}
.cart-bloqueio p{font-size:13px;margin-bottom:8px;color:#7f1d1d}
.cart-bloqueio ul{margin:0;padding-left:18px;font-size:13px}
.cart-bloqueio li{margin-bottom:4px}
.cart-bloqueio hr{border:none;border-top:1px solid #fecaca;margin:12px 0}
.cart-bloqueio p:last-child{margin-bottom:0}
/* Confirmacao do pedido */
.rev-sec{margin-bottom:18px}
.rev-sec h4{font-size:12px;font-weight:600;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.rev-linha{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px solid #edf2f7}
.rev-linha:last-child{border-bottom:none}
.rev-linha .v{font-weight:600;font-variant-numeric:tabular-nums}
.rev-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:10px;margin-top:4px;border-top:2px solid #e2e8f0}
.rev-total .v{font-size:19px;font-weight:700;color:#1d327b;font-variant-numeric:tabular-nums}
.rev-credito{padding:12px 14px;border-radius:8px;border:1px solid #d0d8e8;background:#f7fafc}
.rev-credito.ok{border-color:#bbf7d0;background:#f0fdf4}
.rev-credito.ruim{border-color:#fecaca;background:#fef2f2}
.rev-credito .saldo{font-size:13px;font-weight:600;margin-top:6px;padding-top:6px;border-top:1px dashed #cbd5e0}
.rev-credito.ok .saldo{color:#166534}
.rev-credito.ruim .saldo{color:#991b1b}
.rev-frete{padding:12px 14px;border-radius:8px;border:1px solid #d0d8e8;background:#f7fafc;font-size:13px;color:#4a5568}
.rev-opcoes{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.rev-opcao{display:flex;gap:8px;align-items:flex-start;padding:10px;border:1px solid #c3cfe2;border-radius:8px;background:#fff;cursor:pointer;font-size:13px}
.rev-opcao:hover{border-color:#25bbee}
.rev-opcao input{margin-top:2px}
.rev-opcao strong{display:block}
.rev-opcao span{color:#718096;font-size:12px}
textarea{font-family:Outfit;font-size:13px;padding:8px 12px;border:1px solid #c3cfe2;border-radius:6px;outline:none;width:100%;resize:vertical;min-height:64px}
textarea:focus{border-color:#25bbee}
.btn-sm{padding:4px 10px;font-size:12px}

.status-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.status-rascunho{background:#e2e8f0;color:#4a5568}
.status-submetido{background:#dbeafe;color:#1e40af}
.status-em_analise{background:#fef3c7;color:#92400e}
.status-aprovado{background:#d1fae5;color:#065f46}
.status-rejeitado{background:#fee2e2;color:#991b1b}
.status-em_separacao{background:#e0e7ff;color:#3730a3}
.status-faturado{background:#cffafe;color:#155e75}
.status-enviado{background:#ddd6fe;color:#5b21b6}
.status-entregue{background:#d1fae5;color:#065f46}
.status-cancelado{background:#f3f4f6;color:#6b7280}

.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.page-title{font-size:16px;font-weight:600;color:#1d327b}
.empty-state{text-align:center;padding:40px 20px;color:#718096}

.cart-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #e2e8f0}
.cart-item:last-child{border-bottom:none}
.cart-item-info{flex:1;min-width:0}
.cart-item-sku{font-size:10px;color:#718096;text-transform:uppercase;letter-spacing:.5px}
.cart-item-nome{font-size:13px;font-weight:600;color:#1a202c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-preco{font-size:12px;color:#718096}
.cart-item-qty{display:flex;align-items:center;gap:4px}
.cart-item-qty label{font-size:10px;color:#718096;font-weight:500}
.cart-item-qty input{width:52px;padding:6px;border:1px solid #d0d8e8;border-radius:6px;text-align:center;font-family:Outfit;font-size:13px}
.cart-item-subtotal{font-size:14px;font-weight:700;color:#1d327b;min-width:80px;text-align:right}
.cart-item-remove{background:none;border:none;color:#dc2626;cursor:pointer;font-size:16px;padding:4px 8px}
.cart-item-remove:hover{background:#fef2f2;border-radius:4px}
.cart-summary{display:flex;align-items:center;justify-content:space-between;padding:16px 0;margin-top:8px;border-top:2px solid #1d327b}
.cart-total-label{font-size:14px;color:#4a5568;font-weight:500}
.cart-total-valor{font-size:22px;font-weight:700;color:#1d327b}
.cart-total-nota{font-size:10px;color:#718096;display:block}
.cart-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.cart-tab-badge{background:#e30613;color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:8px;margin-left:5px}
.cart-item-stock{font-size:10px;font-weight:600;display:flex;align-items:center;gap:3px;margin-top:2px}
.cart-item-stock .dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.s-ok{color:#16a34a}.s-ok .dot{background:#16a34a}
.s-low{color:#f59e0b}.s-low .dot{background:#f59e0b}
.s-bo{color:#718096}.s-bo .dot{background:#718096}
.s-no{color:#dc2626}.s-no .dot{background:#dc2626}
.s-prev{color:#1d4ed8}.s-prev .dot{background:#1d4ed8}
</style>
</head>
<body>

<div id="modalOverlay" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('lista',this)">Meus Pedidos</div>
  <div class="tab" onclick="showTab('novo',this)">Novo Pedido</div>
</div>
<div class="panel">
  <div class="panel-content" id="tab-lista">
    <div class="page-header">
      <h2 class="page-title">Historico de Pedidos</h2>
      <select id="filtroStatus" onchange="loadPedidos()" style="padding:6px 10px;border:1px solid #c3cfe2;border-radius:6px;font-family:Outfit;font-size:12px">
        <option value="">Todos os status</option>
        <option value="rascunho">Rascunho</option>
        <option value="submetido">Submetido</option>
        <option value="em_analise">Em analise</option>
        <option value="aprovado">Aprovado</option>
        <option value="faturado">Faturado</option>
        <option value="enviado">Enviado</option>
        <option value="entregue">Entregue</option>
      </select>
    </div>
    <div id="pedidosList"></div>
  </div>
  <div class="panel-content hidden" id="tab-novo">
    <div class="page-header">
      <h2 class="page-title">Novo Pedido</h2>
      <a href="catalogo.html" class="btn btn-outline btn-sm">+ Adicionar produtos</a>
    </div>
    <div id="carrinhoWrap"></div>
  </div>
</div>

<script src="hub.js"></script>
<script>
if (!requireAuth()) throw 'auth';

function showTab(n, el) {
  document.querySelectorAll('.panel-content').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + n).classList.remove('hidden');
  el.classList.add('active');
}

(async () => {
  await loadPerfil();
  renderTopbar('Pedidos');
  await loadPedidos();
  renderCarrinho();
  const cart = getCart();
  if (cart.length > 0) {
    showTab('novo', document.querySelectorAll('.tab')[1]);
  }
})();

// === CARRINHO ===

function getCart() {
  try { return JSON.parse(sessionStorage.getItem(cartKey()) || '[]'); } catch { return []; }
}

function saveCart(cart) {
  sessionStorage.setItem(cartKey(), JSON.stringify(cart));
  stockMap = {};
  // O cliente mexeu no carrinho: as violacoes da tentativa anterior podem nao
  // valer mais. Some com elas em vez de deixar alerta velho na tela.
  ultimasViolacoes = [];
  renderCarrinho();
}

let stockMap = {};

// === PEDIDO EM EDICAO ===
// Todo envio criava um hub_pedidos novo, sempre. Consequencia: (a) reabrir um
// pedido e reenviar deixava o rascunho reaberto para tras e criava uma copia;
// (b) cada submissao que falhava na politica largava mais um rascunho orfao
// (havia 8 presos no banco). Guardando qual rascunho esta em edicao, o envio
// REUSA essa linha em vez de criar outra.
function pedidoEdicaoKey() { return 'hub_pedido_edicao_' + getUserId() + '_' + (getClienteAtivo() || 'self'); }
function getPedidoEmEdicao() { return sessionStorage.getItem(pedidoEdicaoKey()) || null; }
function setPedidoEmEdicao(id) { sessionStorage.setItem(pedidoEdicaoKey(), id); }
function clearPedidoEmEdicao() { sessionStorage.removeItem(pedidoEdicaoKey()); }

// Violacoes devolvidas pelo servidor na ultima tentativa de envio. Ficam na
// tela ate o carrinho mudar -- um toast de 3 segundos some antes de o cliente
// terminar de ler, ainda mais numa lista de itens.
let ultimasViolacoes = [];

// Preco do carrinho vem da base mestre, na faixa correta.
// A faixa (classe) do Varejo/Fisica depende do valor do pedido, entao e preciso
// primeiro somar o carrinho a PRECO DE TABELA e so depois pedir os precos
// naquela faixa — mesma ordem que o servidor usa em hub_fn_submeter_pedido.
// Medir na tabela, e nao no preco ja descontado, evita a circularidade de o
// desconto baixar o valor e o valor rebaixar a faixa.
async function carregarPrecosCarrinho(cart) {
  const clienteId = getClienteAtivo();
  if (!clienteId || !cart.length) return {};
  try {
    const base = await sbRpc('hub_fn_precos_cliente', { p_cliente_id: clienteId, p_valor_pedido: 0 });
    const porId = {};
    base.forEach(l => { porId[l.produto_id] = l; });

    const subtotalTabela = cart.reduce(
      (s, i) => s + (+(porId[i.produto_id]?.preco_tabela || 0) * i.quantidade), 0);

    const finais = await sbRpc('hub_fn_precos_cliente', {
      p_cliente_id: clienteId, p_valor_pedido: subtotalTabela
    });
    const out = {};
    finais.forEach(l => { out[l.produto_id] = l; });
    return out;
  } catch (e) {
    console.error('[preco] falha ao recalcular carrinho:', e);
    return {};
  }
}

async function renderCarrinho() {
  const wrap = document.getElementById('carrinhoWrap');
  const cart = getCart();
  const tabNovo = document.querySelectorAll('.tab')[1];
  const totalQty = cart.reduce((s, i) => s + i.quantidade, 0);

  if (cart.length > 0) {
    tabNovo.innerHTML = 'Novo Pedido <span class="cart-tab-badge">' + totalQty + '</span>';
  } else {
    tabNovo.textContent = 'Novo Pedido';
  }

  if (!cart.length) {
    wrap.innerHTML = '<div class="empty-state"><h3>Carrinho vazio</h3><p>Adicione produtos pelo <a href="catalogo.html" style="color:#1d327b">catalogo</a>.</p></div>';
    return;
  }

  if (!Object.keys(stockMap).length) {
    try {
      const ids = cart.map(c => c.produto_id).join(',');
      const prods = await sb('/hub_v_catalogo?produto_id=in.(' + ids + ')&select=produto_id,status_estoque,backorder_disponivel,estoque_disponivel');
      prods.forEach(p => { stockMap[p.produto_id] = p; });
    } catch {}
  }

  const prevMap = {};
  try {
    await fetchDisponibilidadeEstoque(); // aquece o cache uma unica vez
    await Promise.all(cart.map(async item => {
      const estoqueAtual = stockMap[item.produto_id]?.estoque_disponivel;
      const prev = await fetchDisponibilidadePrevistaSku(item.sku, item.quantidade, estoqueAtual);
      if (prev) prevMap[item.sku] = prev;
    }));
  } catch {}

  const precos = await carregarPrecosCarrinho(cart);
  const precoDe = item => +(precos[item.produto_id]?.preco_final ?? item.preco_base);
  const faixa = Object.values(precos)[0];

  const totalVal = cart.reduce((s, i) => s + (precoDe(i) * i.quantidade), 0);
  const semEstoque = itensSemEstoque(cart, stockMap);

  wrap.innerHTML = `
    <div>
      ${cart.map((item, idx) => {
        const st = stockMap[item.produto_id];
        const stInfo = st ? stockLabel(st, item.quantidade) : { cls: '', text: '' };
        const prev = prevMap[item.sku];
        const prevTexto = prev ? (prev.iso ? 'Disponibilidade Prevista para ' + fmtData(prev.iso) : 'Sem Disponibilidade Prevista') : '';
        return `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-sku">${esc(item.sku)}</div>
            <div class="cart-item-nome">${esc(item.nome || item.sku)}</div>
            <div class="cart-item-preco">${fmtMoeda(precoDe(item))} un</div>
            ${stInfo.text ? '<div class="cart-item-stock ' + stInfo.cls + '"><span class="dot"></span>' + stInfo.text + '</div>' : ''}
            ${prevTexto ? '<div class="cart-item-stock s-prev"><span class="dot"></span>' + prevTexto + '</div>' : ''}
          </div>
          <div class="cart-item-qty">
            <label>Qtd</label>
            <input type="number" value="${item.quantidade}" min="1" max="999" onchange="updateCartQty(${idx}, this.value)">
          </div>
          <div class="cart-item-subtotal">${fmtMoeda(precoDe(item) * item.quantidade)}</div>
          <button class="cart-item-remove" onclick="removeCartItem(${idx})" title="Remover">&times;</button>
        </div>`;
      }).join('')}
    </div>
    <div class="cart-summary">
      <div>
        <span class="cart-total-label">${cart.length} produto${cart.length !== 1 ? 's' : ''} | ${totalQty} unidade${totalQty !== 1 ? 's' : ''}</span>
        <span class="cart-total-nota">c/ impostos inclusos${faixa ? ' | ' + esc(faixa.segmento) + '/' + esc(faixa.uf) + ' — classe ' + faixa.classe : ''}</span>
      </div>
      <div class="cart-total-valor">${fmtMoeda(totalVal)}</div>
    </div>
    ${renderBloqueios(semEstoque)}
    <div class="cart-actions">
      <button class="btn btn-danger btn-sm" onclick="clearCart()">Limpar carrinho</button>
      <button class="btn btn-primary" id="btnEnviarPedido" onclick="enviarPedido()"
              ${semEstoque.length ? 'disabled title="Ha itens sem estoque suficiente"' : ''}>Revisar pedido</button>
    </div>`;
}

// Um unico painel para tudo que impede o pedido de sair -- estoque, credito,
// pedido minimo, boleto, parcelamento. Antes so o estoque tinha tratamento
// visivel e o resto morria num toast de 3 segundos.
function renderBloqueios(semEstoque) {
  const blocos = [];

  if (semEstoque.length) {
    blocos.push(`
      <strong>Falta estoque</strong>
      <p>So entra pedido do que tem estoque disponivel. Ajuste a quantidade ou remova ${semEstoque.length > 1 ? 'os itens abaixo' : 'o item abaixo'}:</p>
      <ul>${semEstoque.map(s => `<li><strong>${esc(s.sku)}</strong>${s.nome ? ' — ' + esc(s.nome) : ''}<br>pedido <strong>${s.pedida}</strong>, disponivel <strong>${s.disponivel}</strong></li>`).join('')}</ul>`);
  }

  // Violacoes do servidor, exceto estoque (ja detalhado acima com nome do produto).
  ultimasViolacoes.filter(v => v.regra !== 'estoque').forEach(v => {
    blocos.push(`<strong>${esc(rotuloRegra(v.regra))}</strong><p>${esc(v.mensagem || '')}</p>`);
  });

  if (!blocos.length) return '';
  return '<div class="cart-bloqueio">' + blocos.join('<hr>') + '</div>';
}

function regraDoErro(erro) {
  const e = String(erro || '').toLowerCase();
  if (e.includes('limite')) return 'credito';
  if (e.includes('cadastro')) return 'cadastro';
  return 'outro';
}

// O erro de credito vem com os numeros separados; montar a frase aqui evita
// mandar o cliente conferir o limite em outra tela para descobrir quanto falta.
function mensagemDeCredito(r) {
  if (regraDoErro(r.erro) !== 'credito' || r.excedente == null) return r.erro;
  return 'Limite de credito insuficiente para este pedido. '
    + 'Pedido ' + fmtMoeda(r.valor_pedido)
    + ', disponivel ' + fmtMoeda(r.disponivel)
    + ' de um limite de ' + fmtMoeda(r.limite_total) + '. '
    + 'Faltam ' + fmtMoeda(r.excedente) + '. '
    + 'Reduza o pedido ou solicite aumento de limite em Financeiro.';
}

function rotuloRegra(regra) {
  return ({
    estoque: 'Falta estoque',
    pedido_minimo: 'Pedido abaixo do minimo',
    credito: 'Limite de credito insuficiente',
    cadastro: 'Cadastro do cliente',
    boleto_elegibilidade: 'Boleto/duplicata indisponivel',
    parcelamento: 'Parcelamento fora da politica',
    valor_minimo_duplicata: 'Valor minimo por duplicata'
  })[regra] || 'Pedido bloqueado';
}

// Espelha no carrinho a trava que o servidor aplica em hub_fn_validar_politica.
// Aqui e so aviso antecipado -- quem garante e o banco. Se o estoque nao veio
// (stockMap vazio, sync fora do ar), nao bloqueia nada: mesma decisao do
// servidor, que suspende a trava quando o sync parece quebrado.
function itensSemEstoque(cart, stockMap) {
  return cart.reduce((acc, item) => {
    const st = stockMap[item.produto_id];
    const disp = Number(st?.estoque_disponivel);
    if (Number.isFinite(disp) && item.quantidade > disp) {
      acc.push({ sku: item.sku || '—', nome: item.nome || '', pedida: item.quantidade, disponivel: disp });
    }
    return acc;
  }, []);
}

let _enviandoPedido = false;

async function enviarPedido() {
  if (_enviandoPedido) return; // trava de reentrancia -- protege mesmo se o
  // botao for recriado (renderCarrinho) enquanto o envio anterior ainda esta em voo
  _enviandoPedido = true;

  try {
    await _enviarPedidoInterno();
  } finally {
    _enviandoPedido = false;
  }
}

async function _enviarPedidoInterno() {
  const cart = getCart();
  if (!cart.length) return;

  // Dealer pede para si; representante e funcionario pedem em nome da revenda
  // que escolheram na topbar. Quem valida o direito e a RLS/hub_pode_acessar_cliente.
  const clienteId = getClienteAtivo();
  if (!clienteId) {
    if (getUserTipo() !== 'cliente') {
      toast('Selecione a revenda antes de enviar o pedido', 'error');
      abrirSeletorCliente();
    } else {
      toast('Seu usuario nao esta vinculado a um cliente', 'error');
    }
    return;
  }

  const btn = document.getElementById('btnEnviarPedido');
  btn.disabled = true;
  btn.textContent = 'Preparando...';

  try {
    // Os precos abaixo sao so uma estimativa para o rascunho: quem decide e
    // hub_fn_submeter_pedido, que reprecifica tudo pela base mestre, aciona a
    // politica comercial e reserva o credito numa transacao so. Duplicar essas
    // contas aqui so criaria uma segunda versao da regra para divergir.
    const precos = await carregarPrecosCarrinho(cart);

    const tipo = getUserTipo();
    const novoPedido = { cliente_id: clienteId, status: 'rascunho' };
    if (tipo === 'representante') {
      novoPedido.origem = 'proxy_representante';
      novoPedido.representante_id = getUserRepresentanteId();
    } else if (tipo !== 'cliente') {
      novoPedido.origem = 'admin';
    }

    // Reusa o rascunho em edicao, se ainda existir e continuar sendo rascunho
    // desta revenda. Evita duplicar o pedido a cada reenvio.
    let pedido = null;
    const emEdicao = getPedidoEmEdicao();
    if (emEdicao) {
      const [r] = await sb('/hub_pedidos?id=eq.' + emEdicao +
        '&status=eq.rascunho&ativo=eq.true&cliente_id=eq.' + clienteId + '&select=id');
      if (r) {
        pedido = r;
        // Troca os itens pelo conteudo atual do carrinho.
        await sb('/hub_pedido_itens?pedido_id=eq.' + r.id, 'DELETE');
      } else {
        clearPedidoEmEdicao(); // sumiu, foi submetido ou e de outra revenda
      }
    }

    if (!pedido) {
      [pedido] = await sb('/hub_pedidos', 'POST', novoPedido);
      setPedidoEmEdicao(pedido.id);
    }

    await sb('/hub_pedido_itens', 'POST', cart.map(i => {
      const p = precos[i.produto_id];
      const unit = +(p?.preco_final ?? i.preco_base ?? 0);
      return {
        pedido_id: pedido.id,
        produto_id: i.produto_id,
        sku: i.sku,
        nome_produto: i.nome,
        quantidade: i.quantidade,
        preco_unitario: +(p?.preco_tabela ?? unit),
        preco_final: unit,
        subtotal_item: +(unit * i.quantidade).toFixed(2)
      };
    }));

    // Ate aqui o pedido esta salvo como rascunho, com itens e precos do
    // servidor. Nada foi submetido: o proximo passo e a revisao.
    const [politica, cliente] = await Promise.all([
      sbRpc('hub_fn_validar_politica', { p_pedido_id: pedido.id }),
      sb('/hub_clientes?id=eq.' + clienteId + '&select=limite_credito,limite_disponivel,uf')
        .then(r => r[0] || {})
    ]);

    abrirRevisao(pedido.id, politica, cliente);
  } catch (e) {
    toast('Erro: ' + erroLegivel(e), 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Revisar pedido';
  }
}

// === REVISAO ANTES DE ENVIAR ===
// O pedido so sai depois desta tela. Ela existe porque o cliente precisava
// declarar OC, pagamento e frete, e porque descobrir o limite de credito na
// mensagem de recusa e tarde demais -- ele tem que ver antes de tentar.

let _revisao = null;

function abrirRevisao(pedidoId, politica, cliente) {
  const subtotal = +(politica.subtotal || 0);
  const frete = politica.frete && politica.frete !== 'null' ? politica.frete : null;
  const valorFrete = +(frete?.valor || 0);
  const total = subtotal + valorFrete;

  const disponivel = +(cliente.limite_disponivel || 0);
  const limite = +(cliente.limite_credito || 0);
  const saldo = disponivel - total;

  _revisao = { pedidoId, subtotal, valorFrete, total, frete, cliente };

  const violacoes = politica.violacoes || [];
  const bloqueado = violacoes.length > 0;

  openModal(`
    <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px">
      <h3 style="font-size:18px;color:#1d327b">Revisar e enviar pedido</h3>
      <span style="cursor:pointer;font-size:20px;color:#718096" onclick="closeModal()">&times;</span>
    </div>

    ${bloqueado ? `<div class="cart-bloqueio" style="margin:0 0 18px">
      ${violacoes.map(v => `<strong>${esc(rotuloRegra(v.regra))}</strong><p>${esc(v.mensagem || '')}</p>`).join('<hr>')}
    </div>` : ''}

    <div class="rev-sec">
      <h4>Resumo</h4>
      <div class="rev-linha"><span>${politica.itens || 0} item(ns)</span><span class="v">${fmtMoeda(subtotal)}</span></div>
      <div class="rev-linha"><span>Frete</span><span class="v">${valorFrete > 0 ? fmtMoeda(valorFrete) : 'Sem custo'}</span></div>
      <div class="rev-total"><span>Total</span><span class="v">${fmtMoeda(total)}</span></div>
    </div>

    <div class="rev-sec">
      <h4>Limite de credito</h4>
      <div class="rev-credito ${saldo >= 0 ? 'ok' : 'ruim'}">
        <div class="rev-linha"><span>Limite total</span><span class="v">${fmtMoeda(limite)}</span></div>
        <div class="rev-linha"><span>Disponivel hoje</span><span class="v">${fmtMoeda(disponivel)}</span></div>
        <div class="rev-linha"><span>Este pedido</span><span class="v">${fmtMoeda(total)}</span></div>
        <div class="saldo">${saldo >= 0
          ? 'Sobra ' + fmtMoeda(saldo) + ' de limite apos este pedido.'
          : 'Faltam ' + fmtMoeda(Math.abs(saldo)) + '. Reduza o pedido ou solicite aumento de limite em Financeiro.'}</div>
      </div>
    </div>

    ${frete ? `<div class="rev-sec">
      <h4>Frete</h4>
      <div class="rev-frete">${esc(frete.motivo || '')}</div>
      ${renderOpcoesFrete(frete, valorFrete)}
    </div>` : ''}

    <div class="rev-sec">
      <h4>Pagamento</h4>
      <div class="form-row-inline">
        <div class="form-row">
          <label>Forma de pagamento</label>
          <select id="revPagamento" onchange="atualizarParcelas()">
            <option value="boleto">Boleto / Duplicata a prazo</option>
            <option value="cartao_credito">Cartao de credito</option>
            <option value="pix">PIX / a vista</option>
            <option value="transferencia">Transferencia</option>
          </select>
        </div>
        <div class="form-row">
          <label>Parcelas</label>
          <select id="revParcelas"></select>
        </div>
      </div>
    </div>

    <div class="rev-sec">
      <h4>Seus dados</h4>
      <div class="form-row">
        <label>Numero da sua ordem de compra (opcional)</label>
        <input id="revOC" type="text" maxlength="60" placeholder="Ex: OC-2026-114">
      </div>
      <div class="form-row">
        <label>Observacoes (opcional)</label>
        <textarea id="revObs" maxlength="1000" placeholder="Instrucoes de entrega, transportadora preferida, etc."></textarea>
      </div>
    </div>

    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal()">Voltar ao carrinho</button>
      <button class="btn btn-primary" id="btnConfirmarEnvio" onclick="confirmarEnvio()"
              ${bloqueado ? 'disabled title="Resolva os bloqueios acima"' : ''}>Confirmar e enviar</button>
    </div>
  `);

  atualizarParcelas();
}

// Quando ha alternativa real (pedido abaixo do minimo de frete gratis, ou UF
// FOB), o cliente escolhe. Quando nao ha -- CIF gratuito -- nao se pergunta.
function renderOpcoesFrete(frete, valorFrete) {
  const podeRetirar = frete.retirada_disponivel === true;
  const podeEnviar = frete.envio_disponivel === true;
  if (!podeRetirar) return ''; // so ha envio: nada a escolher

  return `<div class="rev-opcoes">
    ${podeEnviar ? `<label class="rev-opcao">
      <input type="radio" name="revFrete" value="envio" checked>
      <span><strong>Boxer envia</strong>
      <span>Frete de ${fmtMoeda(valorFrete)} incluido na nota.</span></span>
    </label>` : ''}
    <label class="rev-opcao">
      <input type="radio" name="revFrete" value="retirada" ${!podeEnviar ? 'checked' : ''}>
      <span><strong>Retirada por conta propria</strong>
      <span>Sem custo de frete. Retirada em Campinas, Sao Paulo ou Guarulhos, ou transportadora indicada por voce.</span></span>
    </label>
  </div>`;
}

// Cartao: 1 a 10x sem juros. Boleto/duplicata: ate 3x (28/56/84 dias).
// PIX e transferencia: a vista. Espelha hub_politica_parametros -- quem decide
// continua sendo hub_fn_validar_politica no envio.
function atualizarParcelas() {
  const forma = document.getElementById('revPagamento')?.value;
  const sel = document.getElementById('revParcelas');
  if (!sel) return;
  const max = forma === 'cartao_credito' ? 10 : forma === 'boleto' ? 3 : 1;
  sel.innerHTML = Array.from({ length: max }, (_, i) =>
    `<option value="${i + 1}">${i + 1}x${max > 1 ? ' sem juros' : ' (a vista)'}</option>`).join('');
  sel.disabled = max === 1;
}

async function confirmarEnvio() {
  if (!_revisao) return;
  const btn = document.getElementById('btnConfirmarEnvio');
  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try {
    const modalidade = document.querySelector('input[name="revFrete"]:checked')?.value || null;

    await sb('/hub_pedidos?id=eq.' + _revisao.pedidoId, 'PATCH', {
      ordem_compra: document.getElementById('revOC').value.trim() || null,
      observacoes: document.getElementById('revObs').value.trim() || null,
      forma_pagamento: document.getElementById('revPagamento').value,
      parcelas: +document.getElementById('revParcelas').value || 1,
      frete_modalidade: modalidade
    });

    const resultado = await sbRpc('hub_fn_submeter_pedido', { p_pedido_id: _revisao.pedidoId });

    if (!resultado.ok) {
      // hub_fn_submeter_pedido devolve as regras da politica em `violacoes`,
      // mas credito e cadastro voltam como `erro` solto. Para o cliente e tudo
      // a mesma coisa -- motivo pelo qual o pedido nao saiu -- entao normaliza
      // e mostra tudo no mesmo painel.
      const violacoes = (resultado.violacoes || []).slice();
      if (!violacoes.length && resultado.erro) {
        violacoes.push({
          regra: regraDoErro(resultado.erro),
          mensagem: mensagemDeCredito(resultado)
        });
      }
      // O rascunho fica salvo e continua marcado como "em edicao": o
      // revendedor ajusta o carrinho e reenvia NA MESMA linha, sem gerar
      // um pedido novo a cada tentativa.
      ultimasViolacoes = violacoes;
      closeModal();
      renderCarrinho();
      throw new Error(violacoes.map(v => v.mensagem).join(' ') || 'Erro ao submeter pedido');
    }

    // Submetido: o rascunho deixou de existir como rascunho.
    const pedidoId = _revisao.pedidoId;
    clearPedidoEmEdicao();
    ultimasViolacoes = [];
    _revisao = null;

    closeModal();
    clearCart();
    toast('Pedido ' + resultado.numero + ' enviado!');
    showTab('lista', document.querySelectorAll('.tab')[0]);

    // Espelha no ERP sem prender o cliente: o pedido JA passou pelo portao e ja
    // esta submetido: se o Zen estiver fora do ar, isso e problema nosso, nao
    // dele. Falhou aqui, o api/sync-pedidos-zen empurra depois -- por isso nem
    // avisa erro na tela nem desfaz nada.
    enviarAoErp(pedidoId);

    loadPedidos();
  } catch (e) {
    toast('Erro: ' + erroLegivel(e), 'error');
  } finally {
    if (btn && document.body.contains(btn)) {
      btn.disabled = false;
      btn.textContent = 'Confirmar e enviar';
    }
  }
}

// Best-effort, de proposito: nunca lanca e nunca fala com o usuario. O unico
// caminho garantido de entrega no Zen e o job (api/sync-pedidos-zen); esta
// chamada existe so para o caso normal chegar la em segundos em vez de esperar
// a proxima rodada.
async function enviarAoErp(pedidoId) {
  try {
    const r = await fetch('/api/push-pedido', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + SESSION.access_token },
      body: JSON.stringify({ pedido_id: pedidoId, dry: 0 })
    });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) console.warn('[hub] push ao Zen adiado para o job:', out.error || r.status);
    else setTimeout(loadPedidos, 1200); // ja mostra a etapa "Enviado ao ERP"
  } catch (e) {
    console.warn('[hub] push ao Zen adiado para o job:', e.message);
  }
}

function stockLabel(p, quantidade) {
  // Checagem numerica real: se a quantidade pedida excede o estoque conhecido,
  // isso vale mais que a categoria generica calculada sem olhar a quantidade.
  const estoque = Number(p.estoque_disponivel);
  if (Number.isFinite(estoque) && quantidade != null && quantidade > estoque) {
    if (p.backorder_disponivel) return { cls: 's-bo', text: 'Sob encomenda' };
    return { cls: 's-no', text: 'Indisponivel' };
  }
  if (p.status_estoque === 'disponivel') return { cls: 's-ok', text: 'Em estoque' };
  if (p.status_estoque === 'baixo') return { cls: 's-low', text: 'Estoque baixo' };
  if (p.backorder_disponivel) return { cls: 's-bo', text: 'Sob encomenda' };
  return { cls: 's-no', text: 'Indisponivel' };
}

function updateCartQty(idx, val) {
  const cart = getCart();
  const qty = parseInt(val) || 1;
  if (cart[idx]) {
    cart[idx].quantidade = Math.max(1, qty);
    saveCart(cart);
  }
}

function removeCartItem(idx) {
  const cart = getCart();
  cart.splice(idx, 1);
  saveCart(cart);
}

function clearCart() {
  sessionStorage.removeItem(cartKey());
  // Esvaziar o carrinho encerra a edicao: o proximo envio e um pedido novo.
  // O rascunho antigo continua no historico, para retomar ou descartar de la.
  clearPedidoEmEdicao();
  ultimasViolacoes = [];
  renderCarrinho();
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  }
}

// O nome do no do workflow no Zen e escrito para quem opera o ERP, nao para o
// revendedor. 'Aguardando importacao' soa como problema; 'Analise de Credito'
// nao diz o que ele deve fazer. Aqui vira frase de cliente -- e a que ele nao
// entender vira telefonema, que e justamente o que queremos evitar.
const ETAPA_CLIENTE = {
  'Enviado ao ERP':         { titulo: 'Pedido recebido',            texto: 'Seu pedido chegou ao nosso sistema e entrou na fila de conferencia.' },
  'Inicio':                 { titulo: 'Em conferencia',             texto: 'Nossa equipe comercial esta conferindo os itens.' },
  'Início':                 { titulo: 'Em conferencia',             texto: 'Nossa equipe comercial esta conferindo os itens.' },
  'Orcamento':              { titulo: 'Em conferencia',             texto: 'Nossa equipe comercial esta conferindo os itens.' },
  'Orçamento':              { titulo: 'Em conferencia',             texto: 'Nossa equipe comercial esta conferindo os itens.' },
  'WEB Pronta entrega':     { titulo: 'Separacao',                  texto: 'Itens reservados no estoque para separacao.' },
  'Programado':             { titulo: 'Programado',                 texto: 'Pedido programado para faturamento.' },
  'Analise de Credito':     { titulo: 'Analise financeira',         texto: 'O financeiro esta avaliando o pedido. Voce nao precisa fazer nada agora.' },
  'Análise de Crédito':     { titulo: 'Analise financeira',         texto: 'O financeiro esta avaliando o pedido. Voce nao precisa fazer nada agora.' },
  'Aguardando limite':      { titulo: 'Aguardando limite',          texto: 'O pedido supera o limite disponivel. Fale com o financeiro para liberar.' },
  'Aguardando importacao':  { titulo: 'Reposicao a caminho',        texto: 'Parte dos itens esta em reposicao. Nossa equipe vai confirmar o prazo.' },
  'Aguardando importação':  { titulo: 'Reposicao a caminho',        texto: 'Parte dos itens esta em reposicao. Nossa equipe vai confirmar o prazo.' },
  'Pedido aprovado':        { titulo: 'Pedido aprovado',            texto: 'Aprovado e liberado para faturamento.' },
  'Pedido reprovado':       { titulo: 'Pedido nao aprovado',        texto: 'O pedido nao foi aprovado. Nossa equipe entra em contato.' }
};

// Depois que a venda existe no Zen, quem conta a verdade sobre o pedido e a
// etapa do workflow, nao o status do Hub (que fica em 'submetido' para sempre).
function etapaVisivel(p) {
  const t = ETAPA_CLIENTE[p.erp_workflow_status];
  if (t) return t.titulo;
  return String(p.status || '').replace('_', ' ');
}

function renderTimeline(pedido, eventos) {
  // Rascunho nao tem historia para contar.
  if (pedido.status === 'rascunho') return '';

  // Submetido e ainda sem eco do ERP: o silencio e que assusta. Melhor dizer
  // que esta a caminho do que nao mostrar nada.
  const linhas = (eventos || []).slice();
  if (!linhas.length) {
    return `<div style="padding:12px;background:#f7fafc;border-radius:8px;margin-bottom:16px;font-size:13px;color:#4a5568">
      <strong>Pedido enviado.</strong> Estamos registrando no sistema — a etapa aparece aqui em instantes.
    </div>`;
  }

  const itens = linhas.map((ev, i) => {
    const t = ETAPA_CLIENTE[ev.etapa] || { titulo: ev.etapa, texto: '' };
    const atual = i === linhas.length - 1;
    const cor = atual ? '#25bbee' : '#cbd5e0';
    return `<li style="position:relative;padding:0 0 14px 22px;border-left:2px solid ${i === linhas.length - 1 ? '#e2e8f0' : '#e2e8f0'}">
      <span style="position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:${cor};border:2px solid #fff;box-shadow:0 0 0 1px ${cor}"></span>
      <div style="font-size:13px;font-weight:${atual ? 600 : 500};color:${atual ? '#1d327b' : '#4a5568'}">${esc(t.titulo)}</div>
      ${t.texto ? `<div style="font-size:12px;color:#718096;margin-top:2px">${esc(t.texto)}</div>` : ''}
      <div style="font-size:11px;color:#a0aec0;margin-top:2px">${fmtData(ev.criado_em)}</div>
    </li>`;
  }).join('');

  return `<div style="margin-bottom:16px">
    <div style="font-size:11px;color:#718096;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Acompanhamento</div>
    <ul style="list-style:none;margin:0;padding:0">${itens}</ul>
  </div>`;
}

// Quais acoes o pedido aceita depende de onde ele esta no fluxo.
// A fronteira que importa: assim que o pedido vira venda no Zen
// (erp_pedido_id preenchido), quem manda nele e o Zen/Monitor -- o Hub vira
// so registro, e editar aqui dessincronizaria os dois sistemas.
function acoesPedido(p) {
  const dono = p.cliente_id || '';
  if (p.status === 'rascunho') {
    return `<button class="btn btn-danger" onclick="descartarRascunho('${p.id}')">Descartar</button>
            <button class="btn btn-primary" onclick="retomarPedido('${p.id}','${dono}')">Continuar este pedido</button>`;
  }
  const podeVoltar = p.status === 'submetido' && !p.erp_pedido_id;
  return `${podeVoltar ? `<button class="btn btn-warn" onclick="reverterPedido('${p.id}','${dono}')">Voltar a editar</button>` : ''}
          <button class="btn btn-primary" onclick="repetirPedido('${p.id}','${dono}')">Repetir pedido</button>`;
}

// Representante e admin enxergam pedidos de varias revendas, mas o carrinho
// pertence a UMA revenda (a ativa). Copiar itens de um pedido de outra revenda
// sem avisar e pedir confusao: o preco final e a politica valem para a revenda
// ATIVA, nao para a dona do pedido original. Nao bloqueia -- ha caso legitimo
// de usar um pedido como modelo -- mas exige confirmacao explicita.
function confirmaTrocaDeRevenda(clienteDoPedido) {
  const ativo = getClienteAtivo();
  if (!clienteDoPedido || !ativo || clienteDoPedido === ativo) return true;
  const nome = getClienteAtivoNome() || 'a revenda ativa';
  return confirm(
    'Este pedido e de OUTRA revenda.\n\n' +
    'Os itens vao para o carrinho de ' + nome + ', e serao reprecificados ' +
    'pela tabela e politica dessa revenda — os valores podem mudar.\n\n' +
    'Continuar?'
  );
}

// Carrega os itens de um pedido no carrinho. `substituir` decide se o carrinho
// atual e trocado ou se os itens sao somados a ele.
async function itensParaCarrinho(pedidoId) {
  const itens = await sb('/hub_pedido_itens?pedido_id=eq.' + pedidoId +
    '&select=produto_id,quantidade,preco_unitario,sku,nome_produto,hub_produtos(nome,sku)&order=criado_em.asc');
  if (!itens.length) { toast('Este pedido nao tem itens', 'error'); return false; }

  saveCart(itens.map(i => ({
    produto_id: i.produto_id,
    sku: i.sku || i.hub_produtos?.sku || '',
    nome: i.nome_produto || i.hub_produtos?.nome || '',
    // Preco e so estimativa de tela: hub_fn_submeter_pedido reprecifica tudo
    // no servidor, na faixa correta, no momento do envio.
    preco_base: +i.preco_unitario || 0,
    quantidade: i.quantidade
  })));
  return true;
}

function irParaCarrinho() {
  closeModal();
  showTab('novo', document.querySelectorAll('.tab')[1]);
}

// Mensagem de erro util em vez de generica: um "Erro ao reverter pedido" seco
// escondeu um 400 de cache de schema do PostgREST e custou uma rodada de teste.
function erroLegivel(e) {
  const txt = String(e?.message || e || '');
  try {
    const j = JSON.parse(txt);
    return j.message || j.hint || j.details || txt;
  } catch { return txt.slice(0, 200); }
}

// Continuar/reabrir = seguir editando AQUELE pedido. Repetir = pedido novo.
// A diferenca esta so em marcar (ou nao) o rascunho como "em edicao".
function marcarEdicao(id, clienteDoPedido) {
  if (clienteDoPedido && getClienteAtivo() && clienteDoPedido === getClienteAtivo()) {
    setPedidoEmEdicao(id);
  } else {
    clearPedidoEmEdicao(); // de outra revenda: vira pedido novo da revenda ativa
  }
}

async function retomarPedido(id, clienteDoPedido) {
  if (!confirmaTrocaDeRevenda(clienteDoPedido)) return;
  try {
    if (!await itensParaCarrinho(id)) return;
    marcarEdicao(id, clienteDoPedido);
    irParaCarrinho();
    toast('Itens carregados no carrinho');
  } catch (e) {
    toast('Erro ao retomar pedido: ' + erroLegivel(e), 'error');
  }
}

async function repetirPedido(id, clienteDoPedido) {
  if (!confirmaTrocaDeRevenda(clienteDoPedido)) return;
  try {
    if (!await itensParaCarrinho(id)) return;
    clearPedidoEmEdicao(); // copia gera pedido novo, nunca reescreve o original
    irParaCarrinho();
    toast('Pedido copiado para o carrinho');
  } catch (e) {
    toast('Erro ao repetir pedido: ' + erroLegivel(e), 'error');
  }
}

async function reverterPedido(id, clienteDoPedido) {
  if (!confirm('Voltar este pedido para rascunho? O valor volta para o limite de credito e o pedido podera ser editado e reenviado.')) return;
  try {
    const r = await sbRpc('hub_fn_reverter_pedido', { p_pedido_id: id });
    if (!r?.ok) { toast(r?.erro || 'Nao foi possivel reverter', 'error'); return; }
    await loadPedidos();
    // Reverteu no banco. Levar pro carrinho e opcional: se for de outra
    // revenda e o usuario recusar, o pedido ja esta salvo como rascunho e
    // pode ser retomado depois pela propria revenda dona.
    if (confirmaTrocaDeRevenda(clienteDoPedido) && await itensParaCarrinho(id)) {
      marcarEdicao(id, clienteDoPedido);
      irParaCarrinho();
    } else {
      closeModal();
    }
    toast('Pedido voltou para rascunho');
  } catch (e) {
    toast('Erro ao reverter: ' + erroLegivel(e), 'error');
  }
}

async function descartarRascunho(id) {
  if (!confirm('Descartar este rascunho? Os itens serao perdidos.')) return;
  try {
    await sb('/hub_pedidos?id=eq.' + id, 'PATCH', { ativo: false });
    closeModal();
    await loadPedidos();
    toast('Rascunho descartado');
  } catch (e) {
    toast('Erro ao descartar rascunho', 'error');
  }
}
</script>
</body>
</html>
